name: Local stack

# The local stack (deploy/compose, scripts/dev_stack.sh; DEVELOPING.md "Run the
# NovaWorld servers locally") end to end, so it cannot silently break: the
# script passes shellcheck; the six programs' images, the portal's, the machines'
# hostd image and the smoke test's are built from this commit (the binaries
# compiled here with the compiler cache the Linux jobs share, then laid into
# the Dockerfiles' build stages: `dev_stack.sh up --prebuilt`, which leaves
# every runtime stage as it is); the stack comes up with hosted game servers on
# the synthetic install (no licensed data) as JO's data: the project
# opennova-project makes of it pushed through the editor's routes, a release
# built from that revision, validated and published, its tree applied by the
# data program, nothing uploaded by hand; and the smoke test runs against it
# (scripts/dev_stack.sh smoke: every program's liveness, an account through the
# site's API, the gate's answer and a lobby session, the jobs admin API, and a
# hosted server started through the site on a machine the worker launches,
# running, listed in the lobby, taking console commands, on the admin's pages
# (its machine's agent and trees, its log, the usage samples of it, its machine
# and every program), stopped; and the attention list holding no danger).

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      service-artifact:
        description: "Same-run Linux binary bundle; empty validates/builds a standalone run"
        type: string
        default: ""
      web-artifact:
        description: "Same-run tested web dist; empty builds the portal from source"
        type: string
        default: ""

concurrency:
  group: local-stack-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local-stack:
    # Pinned: the --prebuilt binaries go into ubuntu:24.04 runtime images
    # (apps/novaworld_common/Dockerfile, apps/serve/Dockerfile), so they are
    # built on the same release (its glibc and libstdc++): RunsOn's
    # ubuntu24-full image, test-linux's and net-linux's runner (ci.yml), whose
    # linux-root compiler cache only a job on that image reaches (it lives in
    # RunsOn's Magic Cache, and actions/cache versions an entry by its path,
    # which runner.temp makes differ on GitHub's runners). A fork's pull request
    # runs on GitHub's ubuntu-24.04, cold.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    # A cold compiler cache compiles the service, serve and hostd.
    timeout-minutes: 90
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false   # the stack's images and its synthetic install need no LFS object

      # The stack's script, as infra.yml checks the deploy toolbox's (which also
      # parses the compose files).
      - name: shellcheck scripts/dev_stack.sh
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x
          scripts/dev_stack.sh

      # And Ninja, which RunsOn's ubuntu24-full image leaves out.
      - name: Install libpq, hiredis and Ninja
        if: inputs.service-artifact == ''
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpq-dev libhiredis-dev libssl-dev ninja-build

      - name: Restore the compiler cache
        if: inputs.service-artifact == ''
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      - name: The standalone ONE stamp
        id: one
        if: inputs.service-artifact == ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/staging') && github.run_number || '' }}
        run: scripts/ci/one_stamp.sh "$HEAD_SHA" $RUN | tee -a "$GITHUB_OUTPUT"

      # net-linux.yml's configure (the same flags, the same directory), so the
      # cached objects match; no game window (OPENNOVA_GAME, the SDL3 app).
      - name: Configure (OPENNOVA_NOVAWORLD_SERVICE=ON, BUILD_NOVAWORLD_HTTP=ON)
        if: inputs.service-artifact == ''
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENNOVA_NOVAWORLD_SERVICE=ON -DBUILD_NOVAWORLD_HTTP=ON -DOPENNOVA_GAME=OFF
          -DOPENNOVA_VERSION=${{ steps.one.outputs.version }}
          -DOPENNOVA_STAGING=${{ steps.one.outputs.staging }}
          -DOPENNOVA_COMMIT=${{ steps.one.outputs.commit }}
          -DOPENNOVA_BUILD_TIME=${{ steps.one.outputs.time }}
          -DOPENNOVA_TEST_PG=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          -DOPENNOVA_TEST_REDIS=redis://127.0.0.1:6379

      - name: Build the programs, the machines' binaries and the smoke test
        if: inputs.service-artifact == ''
        run: >-
          cmake --build build -j "$(nproc)" --target opennova_novaworld_gate
          opennova_novaworld_lobby opennova_novaworld_web opennova_novaworld_fleet
          opennova_novaworld_worker opennova_novaworld_data opennova_serve opennova_hostd
          opennova_novaworld_stack_smoke opennova_project opennova_update_tool

      - name: Download the service build
        if: inputs.service-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service-artifact }}
          path: build/bundle-download

      - name: Verify the service build
        if: inputs.service-artifact != ''
        run: >-
          python scripts/ci/service_bundle.py unpack --archive build/bundle-download/service-binaries.tar.gz
          --to build/service-bundle --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download the tested portal
        if: inputs.web-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.web-artifact }}
          path: build/portal-dist

      - name: Bring the stack up (hosted servers on a release of the synthetic install's project)
        env:
          SERVICE_ARTIFACT: ${{ inputs.service-artifact }}
          WEB_ARTIFACT: ${{ inputs.web-artifact }}
        run: |
          tree=build
          if [[ -n "$SERVICE_ARTIFACT" ]]; then tree=build/service-bundle/src/build; fi
          args=(--synthetic-data --prebuilt "$tree")
          if [[ -n "$WEB_ARTIFACT" ]]; then args+=(--web-dist build/portal-dist); fi
          scripts/dev_stack.sh up "${args[@]}"

      - name: The smoke test
        run: scripts/dev_stack.sh smoke

      - name: The stack's logs
        if: failure()
        run: |
          scripts/dev_stack.sh status || true
          scripts/dev_stack.sh logs --no-color --tail 300 || true
          for id in $(docker ps -aq --filter label=opennova.deployment=dev); do
            docker logs --tail 200 "$id" 2>&1 || true
          done

      - name: Bring the stack down
        if: always()
        run: scripts/dev_stack.sh reset || true

      - name: sccache stats
        if: always() && inputs.service-artifact == ''
        run: sccache --show-stats

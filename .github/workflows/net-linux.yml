name: Net stack (Linux)

# The Linux net leg the NovaWorld images and serve image workflows gate their
# image builds on:
# the standalone novaworld server (OPENNOVA_NOVAWORLD_SERVICE) with the Crow
# HTTP layer ON plus the
# net-scoped ctests, on the deploy target's OS and flag set, and a Linux
# compile of the mission-kernel embedders (extract, wire, opennova-serve) with
# the kernel's ungated ctests, and of the machine agent (opennova-hostd, Linux
# only, shipped in the serve image) with its ctests. ci.yml's test-linux job builds the same tree (same
# directory, same flags, so the two share the linux-root compiler cache) and
# runs the whole core suite over it on every push and PR. The service's
# database tests make a database per case on the PostgreSQL service container
# (OPENNOVA_TEST_PG).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  net-linux:
    runs-on: ubuntu-latest
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # net stack consumes no LFS game assets (net fixtures pulled below)

      # The service's client library (libpq; CMake's FindPostgreSQL).
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      # nwmsg_replay_test and nwmsg_codec_parity_test read the captured .nwmsg
      # parity fixtures and nw_self_capture_test the committed
      # opennova-produced self-capture pcap (fixtures/** in .gitattributes:
      # the binaries LFS-tracked, the text fixtures plain blobs). The rest of the net
      # stack consumes no LFS assets, so pull only this subtree to keep checkout
      # fast.
      - name: Materialize net parity fixtures (LFS)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/novaworld/**"

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      # The configure scripts/build.sh runs for ci.yml's test-linux (its
      # --cmake-args add the service, HTTP and test-database flags), so the
      # cached objects match.
      - name: Configure (OPENNOVA_NOVAWORLD_SERVICE=ON, BUILD_NOVAWORLD_HTTP=ON)
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENNOVA_NOVAWORLD_SERVICE=ON -DBUILD_NOVAWORLD_HTTP=ON
          -DOPENNOVA_TEST_PG=postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build server + net tests + the kernel embedders
        run: |
          cmake --build build -j "$(nproc)" --target opennova_novaworld_server \
            url_cipher_test crc32_test nwu_test pubcrypto_test epask_test \
            envelope_test tlv_test session_test \
            registration_url_test gate_response_test gate_probe_test lobby_update_test \
            gate_server_loopback_test gate_listener_test gsb_roundtrip_test protocol_message_test \
            connection_registry_test connection_manager_test \
            db_test db_concurrency_test web_session_test rate_limiter_test \
            child_process_test hosted_supervisor_test hosted_admin_link_test hosted_console_commands_test hosted_ec2_provider_test hosted_agent_protocol_test hosted_placement_test admin_protocol_test             billing_stripe_test \
            session_hello_roundtrip_test lobby_session_test \
            backend_schema_test opennova_novaworld_server_http_routes_test \
            host_key_test nw_host_ownership_e2e_test nw_owner_admin_e2e_test hosted_local_e2e_test \
            opennova_novaworld_server_signal_shutdown_test \
            nw_codec_identity_test nw_self_capture_test \
            unknown_tracker_test nwmsg_replay_test nwmsg_codec_parity_test \
            opennova_extract opennova_wire opennova_serve opennova_hostd opennova_hostd_runtime_test opennova_hostd_agent_test \
            opennova_serve_test opennova_serve_game_cfg_test opennova_serve_novaworld_test serve_registration_parity_test nwu_demux_test opennova_serve_lister_options_test npruntime_host_file_test \
            opennova_serve_server_command_push_test nw_server_command_push_e2e_test \
            npruntime_host_config_test opennova_serve_status_console_test opennova_serve_admin_test \
            npruntime_server_log_recorder_test npruntime_punt_log_test \
            mission_kernel_test mission_kernel_lifecycle_test host_role_test \
            inspect_test terrain_field_store_test sha256_test os_random_test nwu_lobby_draws_test

      - name: Run net ctests + the kernel smoke
        run: |
          ctest --test-dir build --output-on-failure --parallel "$(nproc)" -R \
            "^(url_cipher|crc32|nwu|pubcrypto|epask|envelope|tlv|session|registration_url|gate_response|gate_probe|lobby_update|gate_server_loopback|gate_listener|gsb_roundtrip|protocol_message|connection_registry|connection_manager|db|db_concurrency|web_session|rate_limiter|child_process|hosted_supervisor|hosted_admin_link|hosted_console_commands|hosted_ec2_provider|hosted_agent_protocol|hosted_placement|admin_protocol|billing_stripe|session_hello_roundtrip|lobby_session|backend_schema|opennova_novaworld_server_http_routes|host_key|nw_host_ownership_e2e|nw_owner_admin_e2e|hosted_local_e2e|opennova_novaworld_server_signal_shutdown|nw_codec_identity|nw_self_capture|unknown_tracker|nwmsg_replay|nwmsg_codec_parity|mission_kernel|mission_kernel_lifecycle|host_role|inspect|terrain_field_store|opennova_serve_lan_join|opennova_serve_game_cfg|opennova_serve_novaworld|opennova_serve_server_command_push|nw_server_command_push_e2e|serve_registration_parity|nwu_demux|opennova_serve_lister_options|npruntime_host_file|npruntime_host_config|opennova_serve_status_console|opennova_serve_admin|npruntime_server_log_recorder|npruntime_punt_log|sha256|os_random|nwu_lobby_draws|opennova_hostd_runtime|opennova_hostd_agent)$"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

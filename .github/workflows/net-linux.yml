name: Net stack (Linux)

# The Linux net leg the NovaWorld images and serve image workflows gate their
# image pushes on:
# the NovaWorld service's six programs (OPENNOVA_NOVAWORLD_SERVICE) with the
# Crow HTTP layer ON plus the
# net-scoped ctests, on the deploy target's OS and flag set, and a Linux
# compile of the mission-kernel embedders (extract, wire, opennova-serve) with
# the kernel's ungated ctests, and of the machine agent (opennova-hostd, Linux
# only, shipped in the serve image) with its ctests. ci.yml's test-linux job builds the same tree (same
# directory, same flags, so the two share the linux-root compiler cache) and
# runs the whole suite over it on every push and PR. The service's
# database tests make a database per case on the PostgreSQL service container
# (OPENNOVA_TEST_PG), and the HTTP layer's tests keep their keys on the Valkey
# one (OPENNOVA_TEST_REDIS).

on:
  workflow_call:
    inputs:
      run-tests:
        description: "Run the service unit gate; false builds prerequisites for stack smoke only"
        type: boolean
        default: true
      one_version:
        type: string
        default: ''
      one_staging:
        type: string
        default: ''
      one_commit:
        type: string
        default: ''
      one_time:
        type: string
        default: ''
    outputs:
      artifact-name:
        description: "The validated binaries for this run and attempt"
        value: ${{ jobs.net-linux.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  # On test-linux's RunsOn runner (ci.yml, the same label), which saves the
  # linux-root cache this job reads: only a job on that runner image reaches it
  # (it lives in RunsOn's Magic Cache, and actions/cache versions an entry by
  # its path, which runner.temp makes differ on GitHub's runners). A fork's
  # pull request runs on ubuntu-latest, cold.
  net-linux:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    outputs:
      artifact-name: service-binaries-${{ github.run_attempt }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The HTTP layer's shared web state (OPENNOVA_TEST_REDIS): each test keeps
      # its keys under a prefix of its own.
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false   # net stack consumes no LFS game assets (net fixtures pulled below)

      - name: The shared ONE stamp
        id: one
        env:
          VERSION: ${{ inputs.one_version }}
          STAGING: ${{ inputs.one_staging }}
          COMMIT: ${{ inputs.one_commit }}
          BUILD_TIME: ${{ inputs.one_time }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/staging') && github.run_number || '' }}
        run: |
          if [[ -z "$VERSION$STAGING$COMMIT$BUILD_TIME" ]]; then
            scripts/ci/one_stamp.sh "$HEAD_SHA" $RUN | tee -a "$GITHUB_OUTPUT"
          else
            [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ && "$STAGING" =~ ^(ON|OFF)$ ]]
            [[ "$COMMIT" =~ ^[0-9a-f]{7}$ && "$BUILD_TIME" =~ ^[0-9]+$ ]]
            printf 'version=%s\nstaging=%s\ncommit=%s\ntime=%s\n' \
              "$VERSION" "$STAGING" "$COMMIT" "$BUILD_TIME" >> "$GITHUB_OUTPUT"
          fi

      # The service's client libraries: libpq (CMake's FindPostgreSQL) and, for
      # the service's HTTP layer, hiredis with hiredis_ssl and OpenSSL; and Ninja,
      # which RunsOn's ubuntu24-full image leaves out (ubuntu-latest has it).
      - name: Install libpq, hiredis and Ninja
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpq-dev libhiredis-dev libssl-dev ninja-build

      # nwmsg_replay_test and nwmsg_codec_parity_test read the captured .nwmsg
      # parity fixtures and nw_self_capture_test the committed
      # opennova-produced self-capture pcap (fixtures/** in .gitattributes:
      # the binaries LFS-tracked, the text fixtures plain blobs). The rest of the net
      # stack consumes no LFS assets but the release build's minted install, so pull
      # only these subtrees to keep checkout fast.
      - name: Materialize net parity fixtures (LFS)
        if: inputs.run-tests
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/novaworld/**"
          # The release build's test (release_build_test.cpp, ADR 0069) imports a minted
          # install (tests/editor/minted_install.h), which reads these.
          git lfs pull --include="fixtures/game/**,fixtures/terrain/tmap/**"

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      # The configure scripts/build.sh runs for ci.yml's test-linux (its
      # --cmake-args add the service, HTTP and test-database flags), so the
      # cached objects match.
      - name: Configure (OPENNOVA_NOVAWORLD_SERVICE=ON, BUILD_NOVAWORLD_HTTP=ON)
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENNOVA_NOVAWORLD_SERVICE=ON -DBUILD_NOVAWORLD_HTTP=ON
          -DOPENNOVA_VERSION=${{ steps.one.outputs.version }}
          -DOPENNOVA_STAGING=${{ steps.one.outputs.staging }}
          -DOPENNOVA_COMMIT=${{ steps.one.outputs.commit }}
          -DOPENNOVA_BUILD_TIME=${{ steps.one.outputs.time }}
          -DOPENNOVA_TEST_PG=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          -DOPENNOVA_TEST_REDIS=redis://127.0.0.1:6379

      - name: Build the service's programs + net tests + the kernel embedders
        if: inputs.run-tests
        # opennova_service_tests builds every test tests/novaworld/service_tests.cmake
        # adds; the rest are the net and kernel-embedder tests outside it.
        run: |
          cmake --build build -j "$(nproc)" --target opennova_novaworld_gate \
            opennova_novaworld_lobby opennova_novaworld_web opennova_novaworld_fleet \
            opennova_novaworld_worker opennova_novaworld_data opennova_service_tests \
            url_cipher_test crc32_test nwu_test pubcrypto_test epask_test \
            envelope_test tlv_test session_test \
            registration_url_test gate_response_test gate_probe_test lobby_update_test \
            gate_server_loopback_test gsb_roundtrip_test protocol_message_test \
            child_process_test admin_protocol_test session_hello_roundtrip_test \
            nw_codec_identity_test nw_self_capture_test nwmsg_replay_test nwmsg_codec_parity_test \
            opennova_extract opennova_wire opennova_serve opennova_hostd opennova_hostd_runtime_test opennova_hostd_tree_store_test opennova_hostd_agent_test opennova_project \
            opennova_serve_test opennova_serve_game_cfg_test serve_registration_parity_test nwu_demux_test opennova_serve_lister_options_test opennova_serve_run_reports_test npruntime_host_file_test \
            npruntime_host_config_test opennova_serve_status_console_test opennova_serve_admin_test \
            npruntime_server_log_recorder_test npruntime_punt_log_test \
            mission_kernel_test mission_kernel_lifecycle_test host_role_test \
            inspect_test terrain_field_store_test sha256_test os_random_test nwu_lobby_draws_test \
            opennova_update_tool opennova_novaworld_stack_smoke

      - name: Build the stack's programs
        if: ${{ !inputs.run-tests }}
        run: >-
          cmake --build build -j "$(nproc)" --target
          opennova_novaworld_gate opennova_novaworld_lobby opennova_novaworld_web
          opennova_novaworld_fleet opennova_novaworld_worker opennova_novaworld_data
          opennova_serve opennova_hostd opennova_project opennova_update_tool
          opennova_novaworld_stack_smoke

      # The service rows by their `service` label (every test service_tests.cmake adds),
      # then the net and kernel-embedder rows outside that file by name. A known-flaky
      # e2e row is rerun with the job, as on ci.yml's test-linux.
      - name: Run the service ctests
        if: inputs.run-tests
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)" -L '^service$'

      - name: Run net ctests + the kernel smoke
        if: inputs.run-tests
        run: |
          ctest --test-dir build --output-on-failure --parallel "$(nproc)" -R \
            "^(url_cipher|crc32|nwu|pubcrypto|epask|envelope|tlv|session|registration_url|gate_response|gate_probe|lobby_update|gate_server_loopback|gsb_roundtrip|protocol_message|child_process|admin_protocol|session_hello_roundtrip|nw_codec_identity|nw_self_capture|nwmsg_replay|nwmsg_codec_parity|mission_kernel|mission_kernel_lifecycle|host_role|inspect|terrain_field_store|opennova_serve_lan_join|opennova_serve_game_cfg|serve_registration_parity|nwu_demux|opennova_serve_lister_options|opennova_serve_run_reports|opennova_serve_version|npruntime_host_file|npruntime_host_config|opennova_serve_status_console|opennova_serve_admin|npruntime_server_log_recorder|npruntime_punt_log|sha256|os_random|nwu_lobby_draws|opennova_hostd_runtime|opennova_hostd_tree_store|opennova_hostd_agent)$"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Bundle the validated service binaries
        run: >-
          python scripts/ci/service_bundle.py pack --build build --archive service-binaries.tar.gz
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --one-version "${{ steps.one.outputs.version }}" --one-staging "${{ steps.one.outputs.staging }}"
          --one-commit "${{ steps.one.outputs.commit }}" --one-time "${{ steps.one.outputs.time }}"
          ${{ inputs.run-tests && '--service-tests' || '' }}

      - name: Upload the service build
        uses: actions/upload-artifact@v4
        with:
          name: service-binaries-${{ github.run_attempt }}
          path: service-binaries.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

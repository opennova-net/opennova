name: Net stack (Linux)

# The Linux net leg the NovaWorld images workflow gates its image builds on:
# the standalone novaworld server with the Crow HTTP layer ON plus the
# net-scoped ctests, on the deploy target's OS and flag set, and a Linux
# compile of the mission-kernel embedders (extract, wire, opennova-serve) with
# the kernel's ungated ctests. ci.yml's test-linux job builds the same tree (same
# directory, same flags, so the two share the linux-root compiler cache) and
# runs the whole core suite over it on every push and PR.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  net-linux:
    runs-on: ubuntu-latest
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # net stack consumes no LFS game assets (net fixtures pulled below)

      # nwmsg_replay_test and nwmsg_codec_parity_test read the captured .nwmsg
      # parity fixtures and nw_self_capture_test the committed
      # opennova-produced self-capture pcap (fixtures/** in .gitattributes:
      # the binaries LFS-tracked, the text fixtures plain blobs). The rest of the net
      # stack consumes no LFS assets, so pull only this subtree to keep checkout
      # fast.
      - name: Materialize net parity fixtures (LFS)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/novaworld/**"

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      # The configure scripts/build.sh runs for ci.yml's test-linux (its
      # --cmake-arg adds the HTTP flag), so the cached objects match.
      - name: Configure (BUILD_NOVAWORLD_HTTP=ON)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_NOVAWORLD_HTTP=ON

      - name: Build server + net tests + the kernel embedders
        run: |
          cmake --build build -j "$(nproc)" --target opennova_novaworld_server \
            url_cipher_test crc32_test nwu_test pubcrypto_test epask_test \
            envelope_test tlv_test session_test \
            registration_url_test gate_response_test gate_probe_test lobby_update_test \
            gate_server_loopback_test gsb_roundtrip_test protocol_message_test \
            connection_registry_test connection_manager_test \
            db_sqlite_test session_hello_roundtrip_test lobby_session_test \
            backend_schema_test opennova_novaworld_server_http_routes_test \
            nw_codec_identity_test nw_self_capture_test \
            unknown_tracker_test nwmsg_replay_test nwmsg_codec_parity_test \
            opennova_extract opennova_wire opennova_serve \
            opennova_serve_test opennova_serve_game_cfg_test opennova_serve_novaworld_test serve_registration_parity_test nwu_demux_test nw_lister_destination_policy_test npruntime_host_file_test \
            npruntime_host_config_test opennova_serve_status_console_test opennova_serve_admin_test \
            npruntime_server_log_recorder_test npruntime_punt_log_test \
            mission_kernel_test mission_kernel_lifecycle_test host_role_test \
            inspect_test terrain_field_store_test sha256_test

      - name: Run net ctests + the kernel smoke
        run: |
          ctest --test-dir build --output-on-failure --parallel "$(nproc)" -R \
            "^(url_cipher|crc32|nwu|pubcrypto|epask|envelope|tlv|session|registration_url|gate_response|gate_probe|lobby_update|gate_server_loopback|gsb_roundtrip|protocol_message|connection_registry|connection_manager|db_sqlite|session_hello_roundtrip|lobby_session|backend_schema|opennova_novaworld_server_http_routes|nw_codec_identity|nw_self_capture|unknown_tracker|nwmsg_replay|nwmsg_codec_parity|mission_kernel|mission_kernel_lifecycle|host_role|inspect|terrain_field_store|opennova_serve_lan_join|opennova_serve_game_cfg|opennova_serve_novaworld|serve_registration_parity|nwu_demux|nw_lister_destination_policy|npruntime_host_file|npruntime_host_config|opennova_serve_status_console|opennova_serve_admin|npruntime_server_log_recorder|npruntime_punt_log|sha256)$"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

name: Deploy

# A deploy of the NovaWorld stack (DEPLOY.md, section 5, "The deploy
# workflow"): the toolbox's own `app deploy`, run here from a short-lived AWS
# role in the deployment's own account instead of the vault.
#
# - staging: the staging CI run's complete image set, called by staging-rollout.yml
#   after its component checks pass, in the repository environment
#   `staging`, whose role (infra/org/account/github.tf, made in staging's
#   account) trusts that environment's jobs alone.
# - prod: exactly the images staging's current release runs, by digest
#   (promoted, never built again: no tag input applies), in the environment
#   `prod`, whose required reviewers approve each run before it starts and
#   whose role (in prod's account) trusts that environment's jobs alone. A
#   first job, in `staging`, reads staging's release; the second deploys it.
#
# infra/github makes both environments and their variables (AWS_DEPLOY_ROLE_ARN,
# AWS_REGION, AWS_ACCOUNT_ID, from the vault's aws-<deployment> items). Rolling
# back is the toolbox's `app rollback`. After hostd's roll the run asks the
# service, over ECS Exec into a web task, which hostd image each machine's agent
# reports (its role may exec into web alone; the runner image carries the
# Session Manager plugin the AWS CLI's execute-command runs).

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Promote staging's current service release to prod by digest"
        type: choice
        options: [prod]
        required: true
      no_hosting:
        description: "Deploy with hosted game servers off"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      deployment:
        type: string
        required: true
      staging_attempt:
        description: "Source CI attempt admitted by the staging rollout lock"
        type: string
        default: ""
      source_run_id:
        type: string
        default: ""
      source_sha:
        type: string
        default: ""
      manifest_id:
        type: string
        default: ""

# One deploy of a deployment at a time; a queued one waits, never cancels the
# running one.
concurrency:
  group: deploy-${{ inputs.deployment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.source.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check the deployment source before obtaining AWS credentials
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ inputs.deployment }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.staging_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT" in
            staging)
              source="$(python scripts/ci/staging_manifest.py read --repository "$GITHUB_REPOSITORY" \
                --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --sha "$SOURCE_SHA" \
                --manifest-id "$MANIFEST_ID")"
              images="$(jq -c '.manifest | {deployment:"staging", release:("ci-" + (.source.run_id | tostring) + "-" + (.source.run_attempt | tostring)), images}' <<<"$source")"
              echo "images=$images" >> "$GITHUB_OUTPUT"
              ;;
            prod) ;;
            *) echo "::error::unknown deployment: $DEPLOYMENT"; exit 1 ;;
          esac

  # prod alone: the release staging runs now, read in staging's account.
  staging-release:
    needs: source
    if: inputs.deployment == 'prod'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (OIDC, staging's account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opennova-promote-read-${{ github.run_id }}

      - name: app images (staging)
        id: read
        env:
          OPENNOVA_ROOT: ${{ github.workspace }}
          OPENNOVA_SECRETS_DIR: ${{ runner.temp }}/opennova
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          images="$(deploy/bin/on-deploy --deployment staging app images)"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [source, staging-release]
    if: ${{ !failure() && !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (OIDC, the deployment's account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opennova-deploy-${{ inputs.deployment }}-${{ github.run_id }}

      # The inputs reach the script through the environment alone, never
      # through the script's text.
      - name: app deploy
        env:
          OPENNOVA_ROOT: ${{ github.workspace }}
          OPENNOVA_SECRETS_DIR: ${{ runner.temp }}/opennova
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          IN_DEPLOYMENT: ${{ inputs.deployment }}
          IN_PROMOTED: ${{ needs.staging-release.outputs.images }}
          SOURCE_IMAGES: ${{ needs.source.outputs.images }}
          IN_NO_HOSTING: ${{ inputs.no_hosting }}
        run: |
          set -euo pipefail
          args=()
          if [ "$IN_NO_HOSTING" = true ]; then args+=(--no-hosting); fi
          if [ "$IN_DEPLOYMENT" = prod ]; then
            [ -n "$IN_PROMOTED" ] || { echo "no staging release was read" >&2; exit 1; }
            # The environment's reviewers approved the run: it is the prompt.
            printf '%s' "$IN_PROMOTED" \
              | deploy/bin/on-deploy --deployment prod app deploy --images-from - --yes ${args[@]+"${args[@]}"}
          elif [ "$IN_DEPLOYMENT" = staging ]; then
            [[ -n "$SOURCE_IMAGES" ]] || { echo "::error::no admitted staging image manifest"; exit 1; }
            # All ten images were validated before credentials. Never resolve a
            # mutable sha tag here, and retain the deployment's hosting choice.
            printf '%s' "$SOURCE_IMAGES" \
              | deploy/bin/on-deploy --deployment staging app deploy --images-from - --keep-hosting
          else
            echo "::error::unknown deployment: $IN_DEPLOYMENT"; exit 1
          fi

      - name: Record the deployed release
        env:
          OPENNOVA_ROOT: ${{ github.workspace }}
          OPENNOVA_SECRETS_DIR: ${{ runner.temp }}/opennova
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          images="$(deploy/bin/on-deploy --deployment "$DEPLOYMENT" app images)"
          {
            echo "### Deployed services to $DEPLOYMENT"
            echo "Workflow commit: $GITHUB_SHA; run: $GITHUB_RUN_ID"
            echo "Release: $(jq -r .release <<<"$images")"
            jq -r '.images | to_entries[] | "- \(.key): `\(.value)`"' <<<"$images"
          } >> "$GITHUB_STEP_SUMMARY"

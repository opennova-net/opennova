name: Package Blender add-on

on:
  workflow_call:
    inputs:
      platform:
        description: Target platform (windows or linux)
        type: string
        required: false
        default: windows
      version:
        description: Version stamped into the zipped manifest (a release tag); empty keeps the tracked one
        type: string
        required: false
        default: ""
    outputs:
      artifact_id:
        description: ID of the installable Blender add-on zip
        value: ${{ jobs.package.outputs.artifact_id }}
      artifact_url:
        description: Download URL of the installable Blender add-on zip
        value: ${{ jobs.package.outputs.artifact_url }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-latest' }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      PACKAGE_PLATFORM: ${{ inputs.platform }}
      PACKAGE_PATH: dist/opennova-blender-addon-${{ inputs.platform }}.zip
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate platform
        shell: bash
        run: |
          case "$PACKAGE_PLATFORM" in windows|linux) ;; *) echo "Unsupported platform" >&2; exit 1 ;; esac

      - name: Set up MSVC environment
        if: inputs.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Blender runtime dependencies
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1

      # package-apps.yml builds the same native targets and saves this cache.
      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: ${{ inputs.platform == 'linux' && 'linux-packages' || 'win-mt' }}
          mode: restore

      - name: Package Blender add-on with Release CLI
        shell: bash
        env:
          ADDON_VERSION: ${{ inputs.version }}
        run: scripts/package_blender_addon.sh "$PACKAGE_PATH" "$ADDON_VERSION"

      - name: Smoke-test the packaged CLI
        shell: bash
        run: python scripts/ci/smoke_native_package.py blender "$PACKAGE_PLATFORM" "$PACKAGE_PATH"

      - name: Restore portable Blender
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: build/blender-download
          key: blender-5.1.2-${{ inputs.platform }}-x64

      # Verify cached downloads too; official mirrors and checksums live in the helper.
      - name: Download verified portable Blender
        shell: bash
        run: python scripts/ci/package_blender_test.py "$PACKAGE_PLATFORM" --download-only

      - name: Save portable Blender
        if: steps.blender-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/blender-download
          key: blender-5.1.2-${{ inputs.platform }}-x64

      - name: Test the installed add-on in Blender
        shell: bash
        run: python scripts/ci/package_blender_test.py "$PACKAGE_PLATFORM"

      - name: Upload Blender add-on zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_PATH }}
          archive: false
          if-no-files-found: error

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

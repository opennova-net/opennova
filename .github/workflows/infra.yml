name: Infra

# The offline checks of the deploy stack (DEPLOY.md): the Terraform under
# infra/ (formatted, valid, and the mock-provider tests of infra/aws for both
# deployments, infra/org, infra/zone and infra/github, which plan
# against mocks with no credentials, so nothing reaches AWS, Cloudflare or
# GitHub) at the pinned Terraform the toolbox runs, shellcheck on the deploy
# toolbox (on-deploy, the files it sources, followed with -x, and its tests),
# the backup task's scripts, the fleet image's builder, the portal's
# entrypoint and the hosted machines' script, the toolbox's deployment guard
# and vault requests tests, and `docker compose config` on the local stack's
# compose files.
# Path-filtered: it runs when one of those changes.

on:
  push:
    branches: [master]
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'apps/novaworld_common/hosted/machine/**'
      - 'web/docker-entrypoint.sh'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'apps/novaworld_common/hosted/machine/**'
      - 'web/docker-entrypoint.sh'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # The toolbox's Terraform (deploy/Dockerfile TERRAFORM_VERSION).
      TERRAFORM_IMAGE: hashicorp/terraform:1.11.4
    steps:
      - uses: actions/checkout@v4
      - name: terraform fmt
        run: docker run --rm -v "$PWD:/w" -w /w/infra "$TERRAFORM_IMAGE" fmt -check -recursive -diff
      # Each stack: init with no backend, validate, its mock-provider tests.
      # infra/aws's cover both deployments (each test file names its own
      # var.deployment: an account each, no workspaces).
      - name: terraform init, validate and test (infra/aws, prod and staging)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra/aws "$TERRAFORM_IMAGE" init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra/aws "$TERRAFORM_IMAGE" validate
          docker run --rm --network none -v "$PWD:/w" -w /w/infra/aws "$TERRAFORM_IMAGE" test
      # The Organization's: the accounts, and in each its state bucket, the
      # role boundary, the deploy user, the GitHub deploy role.
      - name: terraform init, validate and test (infra/org)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra/org "$TERRAFORM_IMAGE" init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra/org "$TERRAFORM_IMAGE" validate
          docker run --rm --network none -v "$PWD:/w" -w /w/infra/org "$TERRAFORM_IMAGE" test
      # The Cloudflare zone's shared settings.
      - name: terraform init, validate and test (infra/zone)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra/zone "$TERRAFORM_IMAGE" init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra/zone "$TERRAFORM_IMAGE" validate
          docker run --rm --network none -v "$PWD:/w" -w /w/infra/zone "$TERRAFORM_IMAGE" test
      # The organization's CI runners and deploy environments (infra/github).
      - name: terraform init, validate and test (infra/github)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra/github "$TERRAFORM_IMAGE" init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra/github "$TERRAFORM_IMAGE" validate
          docker run --rm --network none -v "$PWD:/w" -w /w/infra/github "$TERRAFORM_IMAGE" test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x \
            deploy/run.sh \
            deploy/bin/on-deploy \
            deploy/bin/lib/*.sh \
            deploy/bin/tests/*.sh \
            deploy/host/fleet-image.sh \
            deploy/backup/backup.sh \
            deploy/backup/restore.sh \
            deploy/backup/list.sh \
            web/docker-entrypoint.sh \
            apps/novaworld_common/hosted/machine/machine_user_data.sh
      # The toolbox's deployment guard: no default deployment for a change,
      # prod's typed confirmation, data and images in their one direction.
      # (jq from Alpine's packages: the toolbox's commands read their JSON with it;
      # every AWS, vault and terraform call is a stub.)
      - name: deployment guard test
        run: docker run --rm -v "$PWD:/w:ro" -w /w bash:5.2 sh -c 'apk add --no-cache jq >/dev/null && bash deploy/bin/tests/deployment_guard_test.sh'
      # The toolbox's 1Password requests: one token check, one listing and one
      # read of each item a run needs (the service account is rate-limited),
      # every template resolved from those to the vault's values, the retry,
      # the cache in the tmpfs. op, aws, terraform and curl are stubs.
      - name: vault requests test
        run: docker run --rm -v "$PWD:/w:ro" -w /w bash:5.2 sh -c 'apk add --no-cache jq >/dev/null && bash deploy/bin/tests/vault_requests_test.sh'

  # The local stack's compose files parse (deploy/compose: the five programs,
  # the portal, PostgreSQL and Valkey, the hosting overlay's machines; the
  # values scripts/dev_stack.sh writes are placeholders here). local-stack.yml
  # brings the stack up and runs its smoke test.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: deploy/compose
        env:
          ONNET_PUBLIC_HOST: 192.0.2.10
          STACK_DATA_DIR: /tmp
          STACK_DATA_SETS: '{"jop_2_consumer":{}}'
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            -f docker-compose.hosting.yml config --quiet

name: Infra

# The offline checks of the deploy stack (DEPLOY.md): the Terraform under
# infra/ (formatted, valid, and infra/aws/tests' mock-provider runs, which plan
# and apply against mocks with no credentials, so nothing reaches AWS or
# Cloudflare) at the pinned Terraform the toolbox runs, and shellcheck on the
# deploy toolbox, the server instance's user-data template and the hosted
# machines' script. Path-filtered: it runs when
# one of those changes.

on:
  push:
    branches: [master]
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'apps/novaworld_server/hosted/machine/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'apps/novaworld_server/hosted/machine/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # The toolbox's Terraform (deploy/Dockerfile) and the tests' header.
      TERRAFORM_IMAGE: hashicorp/terraform:1.9.5
    steps:
      - uses: actions/checkout@v4
      - name: terraform fmt
        run: docker run --rm -v "$PWD/infra:/tf" -w /tf "$TERRAFORM_IMAGE" fmt -check -recursive -diff
      - name: terraform init (no backend)
        run: docker run --rm -v "$PWD/infra/aws:/tf" -w /tf "$TERRAFORM_IMAGE" init -backend=false -input=false
      - name: terraform validate
        run: docker run --rm -v "$PWD/infra/aws:/tf" -w /tf "$TERRAFORM_IMAGE" validate
      - name: terraform test (mock providers, offline)
        run: docker run --rm --network none -v "$PWD/infra/aws:/tf" -w /tf "$TERRAFORM_IMAGE" test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 \
            deploy/run.sh \
            deploy/bin/on-deploy \
            infra/aws/user_data.sh.tmpl \
            apps/novaworld_server/hosted/machine/user_data.sh \
            apps/novaworld_server/hosted/machine/machine_user_data.sh

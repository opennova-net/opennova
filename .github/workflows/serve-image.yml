name: Serve image

# Builds and publishes the hosted game servers' two images to GHCR from
# apps/serve/Dockerfile: ghcr.io/<owner>/opennova-serve (its serve target), the
# server the hosted game servers run (ADR 0053), and ghcr.io/<owner>/opennova-hostd
# (its hostd target), the machine agent (apps/hostd) the fleet cluster runs as a
# daemon on every machine. Neither holds a retail byte: the game data (the
# server's data set) is mounted at /opt/game (apps/serve/README.md, "Container
# image"). The toolbox deploys them (`app deploy --serve-tag --hostd-tag`). Tags,
# permissions and the PR behaviour (build, never push) follow the NovaWorld images
# (novaworld-images.yml).

on:
  push:
    branches: [master]
    # Everything opennova-serve and opennova-hostd link: every engine group
    # (base, formats, runtime, net), apps/common, the service's half of the
    # agent protocol, the ECS metadata reader and the third-party libs
    # those groups link, plus the CMake root and the build context's ignore
    # list. Master's image so follows every engine change a hosted server runs.
    paths:
      - 'engine/**'
      - 'apps/serve/**'
      - 'apps/hostd/**'
      - 'apps/common/**'
      - 'apps/novaworld_common/hosted/protocol/agent_protocol.*'
      - 'apps/novaworld_common/hosted/protocol/slots.h'
      - 'apps/novaworld_common/core/ecs_metadata.*'
      - 'apps/novaworld_common/core/loggable.h'
      - 'third_party/bcrypt/**'
      - 'third_party/miniz/**'
      - 'third_party/rgbcx/**'
      - 'third_party/imgui/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/net-linux.yml'
      - '.github/workflows/serve-image.yml'
  # Every pull request, whatever its base (stacked PRs included), that touches
  # the image's own sources or its packaging. A PR into the rest of the engine
  # reaches Linux through ci.yml's test-linux, which builds opennova_serve and
  # runs its tests.
  pull_request:
    paths:
      - 'apps/serve/**'
      - 'apps/hostd/**'
      - 'apps/common/**'
      - 'apps/novaworld_common/hosted/protocol/agent_protocol.*'
      - 'apps/novaworld_common/hosted/protocol/slots.h'
      - 'apps/novaworld_common/core/ecs_metadata.*'
      - 'apps/novaworld_common/core/loggable.h'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/net-linux.yml'
      - '.github/workflows/serve-image.yml'
  workflow_dispatch:

# A PR's newer push cancels its older run. Master's pushes queue instead of
# cancelling, so a master run is never cut off mid-publish and the runs finish
# in push order, `latest` last at the newest commit.
concurrency:
  group: serve-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Linux net leg the push gates on, as the NovaWorld images' does
  # (net-linux.yml): it also builds opennova_serve and runs its tests on
  # Linux, so a green here means the image's target builds.
  http-tests:
    uses: ./.github/workflows/net-linux.yml

  # Built into the runner's docker and smoke-run, beside http-tests rather
  # than after it; `push` below pushes the same build.
  serve-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only pushes export the layer cache, mode=min, in a scope of its own, as
      # the NovaWorld images do (novaworld-images.yml says why); `push` builds
      # from it. The two targets share the build stage, so the second build
      # compiles nothing.
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: serve
          build-args: OPENNOVA_VERSION=${{ github.sha }}
          load: true
          tags: opennova-serve:ci
          cache-from: type=gha,scope=opennova-serve
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=opennova-serve,mode=min' || '' }}

      - name: Build hostd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: hostd
          build-args: OPENNOVA_VERSION=${{ github.sha }}
          load: true
          tags: opennova-hostd:ci
          cache-from: type=gha,scope=opennova-serve
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=opennova-serve,mode=min' || '' }}

      # The machine agent's image: the agent reports this commit as its build,
      # and the CLIs it runs are there (the docker client, the AWS CLI, nft);
      # the health check answers 1 with no agent running.
      - name: Smoke-run hostd image
        run: |
          set -euo pipefail
          image=opennova-hostd:ci
          hostd_version="$(docker run --rm "$image" --version)"
          if [ "$hostd_version" != "opennova-hostd ${{ github.sha }}" ]; then
            echo "::error::the hostd image's opennova-hostd reports '$hostd_version'"
            exit 1
          fi
          docker run --rm --entrypoint /usr/bin/docker "$image" --version
          docker run --rm --entrypoint /usr/local/bin/aws "$image" --version
          docker run --rm --entrypoint /usr/sbin/nft "$image" --version
          docker run --rm --entrypoint /usr/local/bin/opennova-serve "$image" --help >/dev/null
          code=0
          docker run --rm "$image" --check-alive || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::--check-alive with no agent running exited $code, expected 1"
            exit 1
          fi

      # The run contract, with no game data: the usage exits 0; a start with
      # no install mounted runs as the image's user (10001) in /srv/serve,
      # whose first act empties admin_log.txt there (a fresh named volume
      # takes the image's ownership), then fails the mount with exit 1. The
      # machine agent is not in it (its own image's).
      - name: Smoke-run serve image
        run: |
          set -euo pipefail
          image=opennova-serve:ci
          docker run --rm "$image" --help
          if docker run --rm --entrypoint /bin/sh "$image" -c 'test -e /usr/local/bin/opennova-hostd'; then
            echo "::error::the serve image carries opennova-hostd"
            exit 1
          fi
          docker volume create serve-smoke >/dev/null
          code=0
          docker run --rm -v serve-smoke:/srv/serve "$image" || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::a start with no game data exited $code, expected 1"
            exit 1
          fi
          owner="$(docker run --rm -v serve-smoke:/srv/serve --entrypoint stat "$image" -c '%u:%g' /srv/serve/admin_log.txt)"
          if [ "$owner" != "10001:10001" ]; then
            echo "::error::admin_log.txt is owned by $owner, expected 10001:10001"
            exit 1
          fi
          docker volume rm serve-smoke >/dev/null

  # On push events alone (PRs from forks can't push to GHCR), once http-tests
  # and the smoke run have passed: the same build, pushed. Its checkout is the
  # smoke run's, so every step hits the cache serve-image just exported for
  # this commit and the job compiles nothing, only uploads (a missed cache
  # costs time alone: the same image builds again here).
  push:
    needs: [http-tests, serve-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-serve
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Push serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: serve
          build-args: OPENNOVA_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opennova-serve

      - name: hostd image metadata
        id: hostd-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-hostd
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Push hostd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: hostd
          build-args: OPENNOVA_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.hostd-meta.outputs.tags }}
          labels: ${{ steps.hostd-meta.outputs.labels }}
          cache-from: type=gha,scope=opennova-serve

name: Serve image

# Builds and publishes the hosted game servers' two images to GHCR from
# apps/serve/Dockerfile: ghcr.io/<owner>/opennova-serve (its serve target), the
# server the hosted game servers run (ADR 0053), and ghcr.io/<owner>/opennova-hostd
# (its hostd target), the machine agent (apps/hostd) the fleet cluster runs as a
# daemon on every machine. Neither holds a retail byte: the game data (the
# server's product) is mounted at /opt/game (apps/serve/README.md, "Container
# image"). The toolbox deploys them (`app deploy --serve-tag --hostd-tag`). Tags,
# permissions and the PR behaviour (build, never push) follow the NovaWorld images
# (novaworld-images.yml).

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      service-artifact:
        description: "Same-run Linux binary bundle; empty validates/builds a standalone run"
        type: string
        default: ""

concurrency:
  # As NovaWorld's images: only master's mutable aliases need a shared lock.
  group: serve-image-${{ github.ref == 'refs/heads/master' && 'master' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  # The Linux net leg the push gates on, as the NovaWorld images' does
  # (net-linux.yml): it also builds opennova_serve and runs its tests on
  # Linux, so a green here means the image's target builds.
  http-tests:
    if: inputs.service-artifact == ''
    uses: ./.github/workflows/net-linux.yml

  # Assemble and smoke-run the tested native binaries. The same bundle is
  # downloaded by the publisher, so a missing layer cache never recompiles.
  serve-image:
    needs: http-tests
    if: ${{ !cancelled() && (inputs.service-artifact != '' || needs.http-tests.result == 'success') }}
    outputs:
      service-artifact: ${{ inputs.service-artifact || needs.http-tests.outputs.artifact-name }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Magic Cache: the builds' type=gha layer cache goes to the ci account's
      # S3 bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the service build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service-artifact || needs.http-tests.outputs.artifact-name }}
          path: build/bundle-download

      - name: Verify the service build
        run: >-
          python scripts/ci/service_bundle.py unpack --archive build/bundle-download/service-binaries.tar.gz
          --to build/service-bundle --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --require-service-tests

      # Only pushes export the layer cache, mode=min, in a scope of its own, as
      # the NovaWorld images do (novaworld-images.yml says why); `push` builds
      # from it. The two targets share the build stage, so the second build
      # compiles nothing.
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: serve
          build-contexts: build=./build/service-bundle
          load: true
          tags: opennova-serve:ci
          cache-from: type=gha,scope=opennova-serve
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=opennova-serve,mode=min' || '' }}

      - name: Build hostd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: hostd
          build-contexts: build=./build/service-bundle
          load: true
          tags: opennova-hostd:ci
          cache-from: type=gha,scope=opennova-serve
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=opennova-serve,mode=min' || '' }}

      # The machine agent's image: the agent reports this commit as its build,
      # and the CLIs it runs are there (the docker client, the AWS CLI, nft);
      # the health check answers 1 with no agent running.
      - name: Smoke-run hostd image
        run: |
          set -euo pipefail
          image=opennova-hostd:ci
          expected_commit="$(jq -er '.one.commit' build/service-bundle/manifest.json)"
          hostd_version="$(docker run --rm "$image" --version)"
          if [ "$hostd_version" != "opennova-hostd $expected_commit" ]; then
            echo "::error::the hostd image's opennova-hostd reports '$hostd_version'"
            exit 1
          fi
          docker run --rm --entrypoint /usr/bin/docker "$image" --version
          docker run --rm --entrypoint /usr/local/bin/aws "$image" --version
          docker run --rm --entrypoint /usr/sbin/nft "$image" --version
          docker run --rm --entrypoint /usr/local/bin/opennova-serve "$image" --help >/dev/null
          code=0
          docker run --rm "$image" --check-alive || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::--check-alive with no agent running exited $code, expected 1"
            exit 1
          fi

      # The run contract, with no game data: the usage exits 0; a start with
      # no install mounted runs as the image's user (10001) in /srv/serve,
      # whose first act empties admin_log.txt there (a fresh named volume
      # takes the image's ownership), then fails the mount with exit 1. The
      # machine agent is not in it (its own image's).
      - name: Smoke-run serve image
        run: |
          set -euo pipefail
          image=opennova-serve:ci
          docker run --rm "$image" --help
          if docker run --rm --entrypoint /bin/sh "$image" -c 'test -e /usr/local/bin/opennova-hostd'; then
            echo "::error::the serve image carries opennova-hostd"
            exit 1
          fi
          docker volume create serve-smoke >/dev/null
          code=0
          docker run --rm -v serve-smoke:/srv/serve "$image" || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::a start with no game data exited $code, expected 1"
            exit 1
          fi
          owner="$(docker run --rm -v serve-smoke:/srv/serve --entrypoint stat "$image" -c '%u:%g' /srv/serve/admin_log.txt)"
          if [ "$owner" != "10001:10001" ]; then
            echo "::error::admin_log.txt is owned by $owner, expected 10001:10001"
            exit 1
          fi
          docker volume rm serve-smoke >/dev/null

  # Trusted push/manual runs publish after validation and smoke checks, then
  # record the actual image digests for the detached staging rollout.
  push:
    needs: [serve-image]
    if: ${{ !cancelled() && needs.serve-image.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: runs-on=${{ github.run_id }}/cpu=4/ram=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # Magic Cache: the layer cache serve-image exported, read from the ci
      # account's S3 bucket.
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the service build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.serve-image.outputs.service-artifact }}
          path: build/bundle-download

      - name: Verify the service build
        run: >-
          python scripts/ci/service_bundle.py unpack --archive build/bundle-download/service-binaries.tar.gz
          --to build/service-bundle --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --require-service-tests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Only the current master updates mutable aliases
        id: aliases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-serve
          tags: |
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' || steps.aliases.outputs.current == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' && steps.aliases.outputs.current == 'true' }}

      - name: Push serve image
        id: serve-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: serve
          build-contexts: build=./build/service-bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opennova-serve

      - name: hostd image metadata
        id: hostd-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-hostd
          tags: |
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' || steps.aliases.outputs.current == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' && steps.aliases.outputs.current == 'true' }}

      - name: Push hostd image
        id: hostd-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          target: hostd
          build-contexts: build=./build/service-bundle
          push: true
          tags: ${{ steps.hostd-meta.outputs.tags }}
          labels: ${{ steps.hostd-meta.outputs.labels }}
          cache-from: type=gha,scope=opennova-serve

      - name: Verify and record the pushed images
        env:
          SERVE_DIGEST: ${{ steps.serve-push.outputs.digest }}
          HOSTD_DIGEST: ${{ steps.hostd-push.outputs.digest }}
        run: |
          set -euo pipefail
          for key in serve hostd; do
            if [[ "$key" == serve ]]; then digest="$SERVE_DIGEST"; else digest="$HOSTD_DIGEST"; fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/opennova-$key"
            image="$repository@$digest"
            docker pull --quiet "$image" >/dev/null
            entry="$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")"
            cid="$(docker create "$image")"
            trap 'docker rm -f "$cid" >/dev/null' EXIT
            docker cp "$cid:$entry" - >/dev/null
            docker rm -f "$cid" >/dev/null
            trap - EXIT
            jq -n --arg image "$key" --arg repository "$repository" --arg digest "$digest" \
              --arg source_sha "$GITHUB_SHA" --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{image: $image, repository: $repository, digest: $digest, source_sha: $source_sha,
                run_id: $run_id, run_attempt: $run_attempt}' > "$key.json"
          done

      - name: Record the serve image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-serve-${{ github.run_attempt }}
          path: serve.json
          retention-days: 7
          if-no-files-found: error

      - name: Record the hostd image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-hostd-${{ github.run_attempt }}
          path: hostd.json
          retention-days: 7
          if-no-files-found: error

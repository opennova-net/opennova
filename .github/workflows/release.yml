name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # A tag publishes only a commit master carries whose master CI run passed,
  # so a release inherits every gate CI requires (the maturity lints, native
  # core and retail, Godot GUT) instead of re-running a subset of them. Master
  # pushes always run everything and are never cancelled (ci.yml's `changes`
  # and concurrency), so a tag on a pushed master head finds its run; a tag
  # pushed straight after the merge waits for that run to finish.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: The tagged commit is on master
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::${GITHUB_REF_NAME} (${sha}) is not on master: release tags point at a master commit."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Master CI passed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          query="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=master&event=push"
          verdict='if any(.workflow_runs[]; .conclusion == "success") then "pass"
            elif any(.workflow_runs[]; .status != "completed") then "running"
            elif (.workflow_runs | length) == 0 then "none" else "fail" end'
          deadline=$((SECONDS + 150 * 60))
          while :; do
            case "$(gh api "$query" --jq "$verdict")" in
              pass)
                echo "Master CI passed on ${SHA}."
                exit 0 ;;
              none)
                echo "::error::No master CI run for ${SHA}: tag a commit a master push ran CI on (a merge head)."
                exit 1 ;;
              fail)
                echo "::error::Master CI did not pass on ${SHA}."
                exit 1 ;;
            esac
            if (( SECONDS > deadline )); then
              echo "::error::Master CI on ${SHA} is still running after 150 minutes."
              exit 1
            fi
            sleep 60
          done

  # Tagged releases ship the runtime, the Blender authoring add-on, the apps and the launcher, without game data.
  package-godot-windows:
    needs: gate
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the package reads assets/ only
          submodules: recursive

      # The models, clips and textures in assets/ ride LFS. Their objects are
      # cached by the pointer set, so a run restores them instead of
      # spending LFS bandwidth on every package.
      - name: Key the bundled LFS assets
        id: assets-lfs
        shell: bash
        run: echo "key=assets-lfs-$(git lfs ls-files -l -I 'assets/**' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the bundled LFS assets
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.assets-lfs.outputs.key }}

      - name: Pull Git LFS assets (assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="assets/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

  package-blender-windows:
    needs: gate
    uses: ./.github/workflows/package-blender-windows.yml
    with:
      # Blender reports the zipped manifest's version: stamp the tag into it.
      version: ${{ github.ref_name }}

  package-apps-windows:
    needs: gate
    # The called job asks for actions: write (its compiler cache's master
    # save); a tag run restores only, but the grant must still cover it.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps-windows.yml

  package-launcher-windows:
    needs: gate
    uses: ./.github/workflows/package-launcher-windows.yml
    with:
      # The exe's file and product version: stamp the tag into it.
      version: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: [gate, package-godot-windows, package-blender-windows, package-apps-windows, package-launcher-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download game, Blender, apps and launcher artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-windows.outputs.artifact_id }},${{ needs.package-blender-windows.outputs.artifact_id }},${{ needs.package-apps-windows.outputs.artifact_id }},${{ needs.package-launcher-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name packages for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          game_zips=(dist/opennova-game-windows-v*.zip)
          if [[ ${#game_zips[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one game zip, found ${#game_zips[@]}"
            exit 1
          fi
          release_zip="dist/opennova-game-windows-${GITHUB_REF_NAME}.zip"
          if [[ "${game_zips[0]}" != "$release_zip" ]]; then
            mv -- "${game_zips[0]}" "$release_zip"
          fi
          mv -- dist/opennova-blender-addon-windows.zip "dist/opennova-blender-addon-windows-${GITHUB_REF_NAME}.zip"
          mv -- dist/opennova-apps-windows.zip "dist/opennova-apps-windows-${GITHUB_REF_NAME}.zip"
          mv -- dist/opennova-launcher-windows.zip "dist/opennova-launcher-windows-${GITHUB_REF_NAME}.zip"

      # The launcher's exe is unsigned, so the release states the zip's hash for a
      # player to check before running it elevated (launcher/README.md).
      - name: SHA-256 of the launcher zip
        shell: bash
        working-directory: dist
        run: |
          zip="opennova-launcher-windows-${GITHUB_REF_NAME}.zip"
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opennova-game-windows-${{ github.ref_name }}.zip
            dist/opennova-blender-addon-windows-${{ github.ref_name }}.zip
            dist/opennova-apps-windows-${{ github.ref_name }}.zip
            dist/opennova-launcher-windows-${{ github.ref_name }}.zip
            dist/opennova-launcher-windows-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

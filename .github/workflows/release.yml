name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # A tag publishes only a commit master carries whose master CI run passed,
  # so a release inherits every gate CI requires (the maturity lints, the
  # native ctests, Godot GUT) instead of re-running a subset of them. Master
  # pushes always run everything and are never cancelled (ci.yml's `changes`
  # and concurrency), so a tag on a pushed master head finds its run; a tag
  # pushed straight after the merge waits for that run to finish.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: The tagged commit is on master
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::${GITHUB_REF_NAME} (${sha}) is not on master: release tags point at a master commit."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Master CI passed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          query="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=master&event=push"
          verdict='if any(.workflow_runs[]; .conclusion == "success") then "pass"
            elif any(.workflow_runs[]; .status != "completed") then "running"
            elif (.workflow_runs | length) == 0 then "none" else "fail" end'
          deadline=$((SECONDS + 150 * 60))
          while :; do
            case "$(gh api "$query" --jq "$verdict")" in
              pass)
                echo "Master CI passed on ${SHA}."
                exit 0 ;;
              none)
                echo "::error::No master CI run for ${SHA}: tag a commit a master push ran CI on (a merge head)."
                exit 1 ;;
              fail)
                echo "::error::Master CI did not pass on ${SHA}."
                exit 1 ;;
            esac
            if (( SECONDS > deadline )); then
              echo "::error::Master CI on ${SHA} is still running after 150 minutes."
              exit 1
            fi
            sleep 60
          done

  # Tagged releases ship the runtime, the editor with its own copy of the
  # runtime, the Blender authoring add-on, the apps and the switcher. The game carries
  # OpenNova's own game beside the executable, and no retail data.
  package-godot-windows:
    needs: gate
    uses: ./.github/workflows/package-godot.yml
    with:
      platform: windows

  package-godot-linux:
    needs: gate
    uses: ./.github/workflows/package-godot.yml
    with:
      platform: linux

  package-blender-windows:
    needs: gate
    uses: ./.github/workflows/package-blender.yml
    with:
      platform: windows
      # Blender reports the zipped manifest's version: stamp the tag into it.
      version: ${{ github.ref_name }}

  package-blender-linux:
    needs: gate
    uses: ./.github/workflows/package-blender.yml
    with:
      platform: linux
      version: ${{ github.ref_name }}

  package-apps-windows:
    needs: gate
    # The called job asks for actions: write (its compiler cache's master
    # save); a tag run restores only, but the grant must still cover it.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps.yml
    with:
      platform: windows

  package-apps-linux:
    needs: gate
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps.yml
    with:
      platform: linux

  package-switcher-windows:
    needs: gate
    uses: ./.github/workflows/package-switcher-windows.yml
    with:
      # The exe's file and product version: stamp the tag into it.
      version: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: [gate, package-godot-windows, package-godot-linux, package-blender-windows, package-blender-linux, package-apps-windows, package-apps-linux, package-switcher-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the game, editor, Blender, apps and switcher artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-linux.outputs.artifact_id }},${{ needs.package-godot-linux.outputs.editor_artifact_id }},${{ needs.package-blender-linux.outputs.artifact_id }},${{ needs.package-apps-linux.outputs.artifact_id }},${{ needs.package-godot-windows.outputs.artifact_id }},${{ needs.package-godot-windows.outputs.editor_artifact_id }},${{ needs.package-blender-windows.outputs.artifact_id }},${{ needs.package-apps-windows.outputs.artifact_id }},${{ needs.package-switcher-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name the packages for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          for platform in windows linux; do
            suffix=zip
            if [[ "$platform" == linux ]]; then suffix=tar.gz; fi
            for product in game editor; do
              archives=(dist/opennova-${product}-${platform}-v*.${suffix})
              if [[ ${#archives[@]} -ne 1 ]]; then
                echo "::error::Expected exactly one ${platform} ${product} archive, found ${#archives[@]}"
                exit 1
              fi
              release_archive="dist/opennova-${product}-${platform}-${GITHUB_REF_NAME}.${suffix}"
              if [[ "${archives[0]}" != "$release_archive" ]]; then
                mv -- "${archives[0]}" "$release_archive"
              fi
            done
            mv -- "dist/opennova-blender-addon-${platform}.zip" "dist/opennova-blender-addon-${platform}-${GITHUB_REF_NAME}.zip"
            mv -- "dist/opennova-apps-${platform}.${suffix}" "dist/opennova-apps-${platform}-${GITHUB_REF_NAME}.${suffix}"
          done
          mv -- dist/opennova-switcher-windows.zip "dist/opennova-switcher-windows-${GITHUB_REF_NAME}.zip"

      # The switcher's exe is unsigned, so the release states the zip's hash for a
      # player to check before running it elevated (switcher/README.md).
      - name: SHA-256 of the switcher zip
        shell: bash
        working-directory: dist
        run: |
          zip="opennova-switcher-windows-${GITHUB_REF_NAME}.zip"
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opennova-game-linux-${{ github.ref_name }}.tar.gz
            dist/opennova-editor-linux-${{ github.ref_name }}.tar.gz
            dist/opennova-apps-linux-${{ github.ref_name }}.tar.gz
            dist/opennova-blender-addon-linux-${{ github.ref_name }}.zip
            dist/opennova-game-windows-${{ github.ref_name }}.zip
            dist/opennova-editor-windows-${{ github.ref_name }}.zip
            dist/opennova-blender-addon-windows-${{ github.ref_name }}.zip
            dist/opennova-apps-windows-${{ github.ref_name }}.zip
            dist/opennova-switcher-windows-${{ github.ref_name }}.zip
            dist/opennova-switcher-windows-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # A tag publishes only a commit master carries whose master CI run passed,
  # so a release inherits every gate CI requires (the maturity lints, the
  # native ctests, Godot GUT) instead of re-running a subset of them. Master
  # pushes always run everything and are never cancelled (ci.yml's `changes`
  # and concurrency), so a tag on a pushed master head finds its run; a tag
  # pushed straight after the merge waits for that run to finish.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: The tagged commit is on master
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::${GITHUB_REF_NAME} (${sha}) is not on master: release tags point at a master commit."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Master CI passed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          query="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=master&event=push"
          verdict='if any(.workflow_runs[]; .conclusion == "success") then "pass"
            elif any(.workflow_runs[]; .status != "completed") then "running"
            elif (.workflow_runs | length) == 0 then "none" else "fail" end'
          deadline=$((SECONDS + 150 * 60))
          while :; do
            case "$(gh api "$query" --jq "$verdict")" in
              pass)
                echo "Master CI passed on ${SHA}."
                exit 0 ;;
              none)
                echo "::error::No master CI run for ${SHA}: tag a commit a master push ran CI on (a merge head)."
                exit 1 ;;
              fail)
                echo "::error::Master CI did not pass on ${SHA}."
                exit 1 ;;
            esac
            if (( SECONDS > deadline )); then
              echo "::error::Master CI on ${SHA} is still running after 150 minutes."
              exit 1
            fi
            sleep 60
          done

  # Tagged releases ship the runtime (one zip per game: OpenNova's own, Joint
  # Operations and DFX2), the editor with its own copy of the runtime, the Blender
  # authoring add-on, the apps and the switcher. Each game zip carries the updater
  # beside the executable; its game downloads on first launch.
  package-godot-windows:
    needs: gate
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
      jointops_artifact_id: ${{ steps.upload_jointops.outputs.artifact-id }}
      dfx2_artifact_id: ${{ steps.upload_dfx2.outputs.artifact-id }}
      editor_artifact_id: ${{ steps.upload_editor.outputs.artifact-id }}
      runtime_artifact_id: ${{ steps.upload_runtime.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # the minimal package reads no game content
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download the preceding full runtime package
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release view --repo $env:GITHUB_REPOSITORY --json assets,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the preceding release" }
          $packages = @($previous.assets | Where-Object { $_.name -like 'opennova-runtime-windows-*.sfs' })
          if ($packages.Count -gt 1) { throw "The preceding release has multiple runtime packages" }
          if ($packages.Count -eq 1) {
            $folder = Join-Path $env:RUNNER_TEMP 'previous-runtime'
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern $packages[0].name --dir $folder
            if ($LASTEXITCODE -ne 0) { throw "Could not download the preceding runtime package" }
            "package=$(Join-Path $folder $packages[0].name)" >> $env:GITHUB_OUTPUT
          }

      - name: Package Godot Windows apps
        shell: pwsh
        env:
          PREVIOUS_RUNTIME_PACKAGE: ${{ steps.previous.outputs.package }}
        run: scripts/package_godot_windows.ps1 -PreviousRuntimePackage $env:PREVIOUS_RUNTIME_PACKAGE

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload Joint Operations Windows game zip
        id: upload_jointops
        uses: actions/upload-artifact@v7
        with:
          path: dist/jointops-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload DFX2 Windows game zip
        id: upload_dfx2
        uses: actions/upload-artifact@v7
        with:
          path: dist/dfx2-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenNova Windows editor zip
        id: upload_editor
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload the full runtime update
        id: upload_runtime
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-runtime-windows-v*.sfs
          archive: false
          if-no-files-found: error

  package-blender-windows:
    needs: gate
    uses: ./.github/workflows/package-blender-windows.yml
    with:
      # Blender reports the zipped manifest's version: stamp the tag into it.
      version: ${{ github.ref_name }}

  package-apps-windows:
    needs: gate
    # The called job asks for actions: write (its compiler cache's master
    # save); a tag run restores only, but the grant must still cover it.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps-windows.yml

  package-switcher-windows:
    needs: gate
    uses: ./.github/workflows/package-switcher-windows.yml
    with:
      # The exe's file and product version: stamp the tag into it.
      version: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: [gate, package-godot-windows, package-blender-windows, package-apps-windows, package-switcher-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the game, editor, Blender, apps and switcher artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-windows.outputs.artifact_id }},${{ needs.package-godot-windows.outputs.jointops_artifact_id }},${{ needs.package-godot-windows.outputs.dfx2_artifact_id }},${{ needs.package-godot-windows.outputs.editor_artifact_id }},${{ needs.package-godot-windows.outputs.runtime_artifact_id }},${{ needs.package-blender-windows.outputs.artifact_id }},${{ needs.package-apps-windows.outputs.artifact_id }},${{ needs.package-switcher-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name the packages for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          for product in opennova-game jointops-game dfx2-game opennova-editor; do
            zips=(dist/${product}-windows-v*.zip)
            if [[ ${#zips[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one ${product} zip, found ${#zips[@]}"
              exit 1
            fi
            release_zip="dist/${product}-windows-${GITHUB_REF_NAME}.zip"
            if [[ "${zips[0]}" != "$release_zip" ]]; then
              mv -- "${zips[0]}" "$release_zip"
            fi
          done
          updates=(dist/opennova-runtime-windows-v*.sfs)
          if [[ ${#updates[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one runtime update, found ${#updates[@]}"
            exit 1
          fi
          release_update="dist/opennova-runtime-windows-${GITHUB_REF_NAME}.sfs"
          if [[ "${updates[0]}" != "$release_update" ]]; then
            mv -- "${updates[0]}" "$release_update"
          fi
          mv -- dist/opennova-blender-addon-windows.zip "dist/opennova-blender-addon-windows-${GITHUB_REF_NAME}.zip"
          mv -- dist/opennova-apps-windows.zip "dist/opennova-apps-windows-${GITHUB_REF_NAME}.zip"
          mv -- dist/opennova-switcher-windows.zip "dist/opennova-switcher-windows-${GITHUB_REF_NAME}.zip"

      # The switcher's exe is unsigned, so the release states the zip's hash for a
      # player to check before running it elevated (switcher/README.md).
      - name: SHA-256 of the switcher zip
        shell: bash
        working-directory: dist
        run: |
          zip="opennova-switcher-windows-${GITHUB_REF_NAME}.zip"
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opennova-game-windows-${{ github.ref_name }}.zip
            dist/jointops-game-windows-${{ github.ref_name }}.zip
            dist/dfx2-game-windows-${{ github.ref_name }}.zip
            dist/opennova-editor-windows-${{ github.ref_name }}.zip
            dist/opennova-runtime-windows-${{ github.ref_name }}.sfs
            dist/opennova-blender-addon-windows-${{ github.ref_name }}.zip
            dist/opennova-apps-windows-${{ github.ref_name }}.zip
            dist/opennova-switcher-windows-${{ github.ref_name }}.zip
            dist/opennova-switcher-windows-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Opt in only after the existing admin API token and portal URL are configured.
  # The helper uploads, waits for validation, then publishes through the admin API.
  publish-runtime-update:
    needs: release
    if: vars.PUBLISH_RUNTIME_UPDATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download and publish the released runtime update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_TOKEN" || { echo '::error::ADMIN_API_TOKEN is required for update publication'; exit 1; }
          test -n "$UPDATE_PUBLISH_URL" || { echo '::error::UPDATE_PUBLISH_URL is required for update publication'; exit 1; }
          gh release download "$GITHUB_REF_NAME" --pattern "opennova-runtime-windows-${GITHUB_REF_NAME}.sfs" --dir dist
          umask 077
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$ADMIN_API_TOKEN" > "$token_file"
          unset ADMIN_API_TOKEN
          python scripts/publish_update.py --url "$UPDATE_PUBLISH_URL" --token-file "$token_file" \
            --package "dist/opennova-runtime-windows-${GITHUB_REF_NAME}.sfs" \
            --name "OpenNova runtime ${GITHUB_REF_NAME}" --publish

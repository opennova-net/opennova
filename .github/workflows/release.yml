name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install uv==0.11.17

      - name: Build and test
        shell: bash
        env:
          BUILD_GODOT: "0"
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_blender.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload Blender addon package
        id: upload_blender
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova_blender-v*.zip
          archive: false
          if-no-files-found: error

  package-importer:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_importer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload importer package
        id: upload_importer
        uses: actions/upload-artifact@v7
        with:
          path: dist/onimport-v*.exe
          archive: false
          if-no-files-found: error

  # One zip: the editor and the game runtime side by side with the GDExtension
  # DLL they share (the editor launches the runtime from its own directory).
  package-godot-windows:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_windows.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload OpenNova Windows zip
        id: upload_windows
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-windows-v*.zip
          archive: false
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, package-addon, package-importer, package-godot-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: >-
            ${{ needs.package-addon.outputs.artifact_id }},
            ${{ needs.package-importer.outputs.artifact_id }},
            ${{ needs.package-godot-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their CONTENTS into dist/ — the .zip files themselves go missing and
          # validation fails. skip-decompress keeps each artifact as its raw file.
          # (ci.yml's validate-deliverables download already does this; keep in sync.)
          skip-decompress: true

      - name: Validate release deliverables
        run: python scripts/validate_release_deliverables.py --release-version "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-assets/*
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build and test
        shell: bash
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/opennova_blender-v*.zip

  package-max-mzp:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Max MZP
        shell: pwsh
        run: scripts/package_max_mzp.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_max
          path: dist/opennova_max-v*.mzp

  package-importer:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport-v*.exe

  package-godot:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Package Godot exports
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload opennova-modtools Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_windows
          path: dist/opennova-modtools-windows-v*.zip

      - name: Upload opennova runtime Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_windows
          path: dist/opennova-runtime-windows-v*.zip

  package-godot-macos:
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Package Godot exports (macOS)
        shell: bash
        run: scripts/package_godot_macos.sh

      - name: Upload opennova-modtools macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_macos
          path: dist/opennova-modtools-macos-v*.zip

      - name: Upload opennova runtime macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_macos
          path: dist/opennova-runtime-macos-v*.zip

  release:
    runs-on: ubuntu-latest
    needs: [package-addon, package-max-mzp, package-importer, package-godot, package-godot-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate release deliverables
        run: python scripts/validate_release_deliverables.py --release-version "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-assets/*
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # A tag publishes only a commit master carries whose master CI run passed,
  # so a release inherits every gate CI requires (the maturity lints, the
  # native ctests, Godot GUT) instead of re-running a subset of them. Master
  # pushes always run everything and are never cancelled (ci.yml's `changes`
  # and concurrency), so a tag on a pushed master head finds its run; a tag
  # pushed straight after the merge waits for that run to finish.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: The tagged commit is on master
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::${GITHUB_REF_NAME} (${sha}) is not on master: release tags point at a master commit."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Master CI passed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          query="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=master&event=push"
          verdict='if any(.workflow_runs[]; .conclusion == "success") then "pass"
            elif any(.workflow_runs[]; .status != "completed") then "running"
            elif (.workflow_runs | length) == 0 then "none" else "fail" end'
          deadline=$((SECONDS + 150 * 60))
          while :; do
            case "$(gh api "$query" --jq "$verdict")" in
              pass)
                echo "Master CI passed on ${SHA}."
                exit 0 ;;
              none)
                echo "::error::No master CI run for ${SHA}: tag a commit a master push ran CI on (a merge head)."
                exit 1 ;;
              fail)
                echo "::error::Master CI did not pass on ${SHA}."
                exit 1 ;;
            esac
            if (( SECONDS > deadline )); then
              echo "::error::Master CI on ${SHA} is still running after 150 minutes."
              exit 1
            fi
            sleep 60
          done

  # A tag's run builds the five apps' plain builds as its artifacts, ci.yml's
  # names (ADR 0072): the runtime's and the editor's (release mode) here, the
  # Blender add-on's, the tools' and the switcher's in their own workflows. Publish
  # (publish.yml) takes them from this run: prod's service packs and publishes all
  # five, and the GitHub release gets the zips prod's downloads host then serves
  # (each game's among them, rendered from the runtime).
  package-godot-windows:
    needs: gate
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # the minimal package reads no game content
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # The builds carry the tag's version (its name without the "v"): the zips' and the
      # exes' VERSIONINFO, whatever project.godot says. Publish stamps it on each release.
      - name: Package Godot Windows apps
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          scripts/package_godot_windows.ps1 -Version $version -BuildCommit ${{ github.sha }}

      - name: Upload the runtime's plain build
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-runtime-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload the editor's plain build
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

  package-blender-windows:
    needs: gate
    uses: ./.github/workflows/package-blender-windows.yml
    with:
      # Blender reports the zipped manifest's version: stamp the tag into it.
      version: ${{ github.ref_name }}

  package-apps-windows:
    needs: gate
    # The called job asks for actions: write (its compiler cache's master
    # save); a tag run restores only, but the grant must still cover it.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps-windows.yml

  package-switcher-windows:
    needs: gate
    uses: ./.github/workflows/package-switcher-windows.yml
    with:
      # The exe's file and product version: stamp the tag into it.
      version: ${{ github.ref_name }}

  # The GitHub release, its notes alone, once every build is in: Publish attaches the
  # zips prod's downloads host serves, once prod has published them.
  release:
    runs-on: ubuntu-latest
    needs: [gate, package-godot-windows, package-blender-windows, package-apps-windows, package-switcher-windows]
    permissions:
      contents: write
    steps:
      # The switcher's exe is unsigned, so the notes state its zip's SHA-256 for a player
      # to check before running it elevated (switcher/README.md): the zip Publish attaches
      # is this build as uploaded.
      - name: Download the switcher's build
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-switcher-windows.outputs.artifact_id }}
          merge-multiple: true
          skip-decompress: true

      - name: SHA-256 of the switcher zip
        id: switcher
        shell: bash
        run: |
          sha="$(sha256sum dist/opennova-switcher-windows.zip | cut -d' ' -f1)"
          echo "$sha  opennova-switcher-windows-${GITHUB_REF_NAME}.zip"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            SHA-256 of `opennova-switcher-windows-${{ github.ref_name }}.zip`: `${{ steps.switcher.outputs.sha256 }}`
          generate_release_notes: true

  # The release onto prod through Publish (publish.yml), this run's builds its source:
  # prod's service packs and publishes the five apps, and the GitHub release gets the
  # zips prod's downloads host serves, once prod's reviewers approve. Publish runs from
  # master: prod's environment takes runs from protected branches alone, never a tag's.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write   # starts publish.yml
    steps:
      - name: Start the prod Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref master
          -f deployment=prod -f release="$GITHUB_REF_NAME" -f run_id="$GITHUB_RUN_ID"

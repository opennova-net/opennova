name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Build and test
        shell: bash
        run: scripts/build.sh --no-godot

  # Tagged releases ship the runtime (game data is supplied via CLI) and the
  # editor with its own copy of the runtime.
  package-godot-windows:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
      editor_artifact_id: ${{ steps.upload_editor.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # Runtime export contains no game data.
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenNova Windows editor zip
        id: upload_editor
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, package-godot-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the game and editor artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-windows.outputs.artifact_id }},${{ needs.package-godot-windows.outputs.editor_artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name the zips for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          for product in game editor; do
            zips=(dist/opennova-${product}-windows-v*.zip)
            if [[ ${#zips[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one ${product} zip, found ${#zips[@]}"
              exit 1
            fi
            release_zip="dist/opennova-${product}-windows-${GITHUB_REF_NAME}.zip"
            if [[ "${zips[0]}" != "$release_zip" ]]; then
              mv -- "${zips[0]}" "$release_zip"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opennova-game-windows-${{ github.ref_name }}.zip
            dist/opennova-editor-windows-${{ github.ref_name }}.zip
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Build and test
        shell: bash
        env:
          BUILD_GODOT: "0"
        run: scripts/build.sh

  # Tagged releases ship the GAME zip only: opennova.exe + the packed pffs,
  # built by ONED's hidden --pack-game CLI, pre-configured to boot from its own
  # directory. The dev build (game + ONED + loose sources) comes
  # from master CI runs, not releases.
  package-godot-windows:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, package-godot-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download game artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name game zip for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          game_zips=(dist/opennova-game-windows-v*.zip)
          if [[ ${#game_zips[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one game zip, found ${#game_zips[@]}"
            exit 1
          fi
          release_zip="dist/opennova-game-windows-${GITHUB_REF_NAME}.zip"
          if [[ "${game_zips[0]}" != "$release_zip" ]]; then
            mv -- "${game_zips[0]}" "$release_zip"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/opennova-game-windows-${{ github.ref_name }}.zip
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build and test
        shell: bash
        env:
          BUILD_GODOT: "0"
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_blender.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload Blender addon package
        id: upload_blender
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova_blender-v*.zip
          archive: false
          if-no-files-found: error

  package-max-mzp:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_max.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Max MZP
        shell: pwsh
        run: scripts/package_max_mzp.ps1

      - name: Upload 3ds Max package
        id: upload_max
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova_max-v*.mzp
          archive: false
          if-no-files-found: error

  package-importer:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_importer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload importer package
        id: upload_importer
        uses: actions/upload-artifact@v7
        with:
          path: dist/onimport-v*.exe
          archive: false
          if-no-files-found: error

  package-godot-windows-editor:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_modtools.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows editor export
        shell: pwsh
        run: scripts/package_godot_editor_windows.ps1

      - name: Upload opennova-modtools Windows zip
        id: upload_modtools
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-modtools-windows-v*.zip
          archive: false
          if-no-files-found: error

  package-godot-windows-runtime:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_runtime.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows runtime export
        shell: pwsh
        run: scripts/package_godot_runtime_windows.ps1

      - name: Upload opennova runtime Windows zip
        id: upload_runtime
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-runtime-windows-v*.zip
          archive: false
          if-no-files-found: error

  package-godot-macos-editor:
    runs-on: macos-latest
    outputs:
      artifact_id: ${{ steps.upload_modtools_macos.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot macOS editor export
        shell: bash
        run: scripts/package_godot_editor_macos.sh

      - name: Upload opennova-modtools macOS zip
        id: upload_modtools_macos
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-modtools-macos-v*.zip
          archive: false
          if-no-files-found: error

  package-godot-macos-runtime:
    runs-on: macos-latest
    outputs:
      artifact_id: ${{ steps.upload_runtime_macos.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot macOS runtime export
        shell: bash
        run: scripts/package_godot_runtime_macos.sh

      - name: Upload opennova runtime macOS zip
        id: upload_runtime_macos
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-runtime-macos-v*.zip
          archive: false
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, package-addon, package-max-mzp, package-importer, package-godot-windows-editor, package-godot-windows-runtime, package-godot-macos-editor, package-godot-macos-runtime]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: >-
            ${{ needs.package-addon.outputs.artifact_id }},
            ${{ needs.package-max-mzp.outputs.artifact_id }},
            ${{ needs.package-importer.outputs.artifact_id }},
            ${{ needs.package-godot-windows-editor.outputs.artifact_id }},
            ${{ needs.package-godot-windows-runtime.outputs.artifact_id }},
            ${{ needs.package-godot-macos-editor.outputs.artifact_id }},
            ${{ needs.package-godot-macos-runtime.outputs.artifact_id }}
          merge-multiple: true

      - name: Validate release deliverables
        run: python scripts/validate_release_deliverables.py --release-version "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-assets/*
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

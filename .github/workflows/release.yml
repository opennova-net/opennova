name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and test
        shell: bash
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh --version "${GITHUB_REF#refs/tags/v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/*.zip

  package-importer:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport.exe

  package-godot:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Package Godot exports
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload opennova-modtools.exe
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_windows
          path: dist/opennova-modtools.exe

      - name: Upload opennova.exe
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_windows
          path: dist/opennova.exe

  release:
    runs-on: ubuntu-latest
    needs: [package-addon, package-importer, package-godot]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/onimport.exe
            dist/opennova.exe
            dist/opennova-modtools.exe
          generate_release_notes: true

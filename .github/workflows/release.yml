name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build and test
        shell: bash
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/opennova_blender-v*.zip

  package-importer:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport-v*.exe

  package-godot:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Package Godot exports
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload opennova-modtools Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_windows
          path: dist/opennova-modtools-windows-v*.zip

      - name: Upload opennova runtime Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_windows
          path: dist/opennova-runtime-windows-v*.zip

  release:
    runs-on: ubuntu-latest
    needs: [package-addon, package-importer, package-godot]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build component manifest
        run: |
          BLENDER=$(grep -E '^version = ' blender/blender_manifest.toml | sed -E 's/.*"(.*)".*/\1/')
          IMPORTER=$(grep -E '^version = ' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          GODOT=$(grep -E '^config/version=' godot/project.godot | sed -E 's/.*"(.*)".*/\1/')
          cat > release-body.md <<EOF
          ## Components in this release

          | Component | Version |
          |---|---|
          | Blender addon | ${BLENDER} |
          | Standalone importer | ${IMPORTER} |
          | Godot mod tools | ${GODOT} |
          | Godot runtime | ${GODOT} |

          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/onimport-v*.exe
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

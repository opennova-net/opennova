name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Build and test
        shell: bash
        run: scripts/build.sh --no-godot

  # Tagged releases ship the runtime, the editor with its own copy of the
  # runtime, the Blender authoring add-on and the apps, without game data.
  package-godot-windows:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
      editor_artifact_id: ${{ steps.upload_editor.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the package reads assets/ only
          submodules: recursive

      # The models, clips and textures in assets/ ride LFS. Their objects are
      # cached by the pointer set, so a run restores them instead of
      # spending LFS bandwidth on every package.
      - name: Key the bundled LFS assets
        id: assets-lfs
        shell: bash
        run: echo "key=assets-lfs-$(git lfs ls-files -l -I 'assets/**' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the bundled LFS assets
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.assets-lfs.outputs.key }}

      - name: Pull Git LFS assets (assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="assets/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenNova Windows editor zip
        id: upload_editor
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

  package-blender-windows:
    uses: ./.github/workflows/package-blender-windows.yml
    with:
      # Blender reports the zipped manifest's version: stamp the tag into it.
      version: ${{ github.ref_name }}

  package-apps-windows:
    # The called job asks for actions: write (its compiler cache's master
    # save); a tag run restores only, but the grant must still cover it.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/package-apps-windows.yml

  release:
    runs-on: ubuntu-latest
    needs: [test, package-godot-windows, package-blender-windows, package-apps-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the game, editor, Blender and apps artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          artifact-ids: ${{ needs.package-godot-windows.outputs.artifact_id }},${{ needs.package-godot-windows.outputs.editor_artifact_id }},${{ needs.package-blender-windows.outputs.artifact_id }},${{ needs.package-apps-windows.outputs.artifact_id }}
          merge-multiple: true
          # The package jobs upload with `archive: false` (raw blob, no archive
          # wrapper), so the .zip deliverables are stored as the bare .zip. Without
          # skip-decompress, download-artifact@v8 decompresses those payload zips and
          # dumps their contents into dist; skip-decompress preserves the deliverable.
          skip-decompress: true

      - name: Name the packages for the release tag
        shell: bash
        run: |
          shopt -s nullglob
          for product in game editor; do
            zips=(dist/opennova-${product}-windows-v*.zip)
            if [[ ${#zips[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one ${product} zip, found ${#zips[@]}"
              exit 1
            fi
            release_zip="dist/opennova-${product}-windows-${GITHUB_REF_NAME}.zip"
            if [[ "${zips[0]}" != "$release_zip" ]]; then
              mv -- "${zips[0]}" "$release_zip"
            fi
          done
          mv -- dist/opennova-blender-addon-windows.zip "dist/opennova-blender-addon-windows-${GITHUB_REF_NAME}.zip"
          mv -- dist/opennova-apps-windows.zip "dist/opennova-apps-windows-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/opennova-game-windows-${{ github.ref_name }}.zip
            dist/opennova-editor-windows-${{ github.ref_name }}.zip
            dist/opennova-blender-addon-windows-${{ github.ref_name }}.zip
            dist/opennova-apps-windows-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

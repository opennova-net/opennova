name: NovaWorld images

# Builds and publishes the NovaWorld service's container images to GHCR, all
# public (the ECS task definitions pull them with no registry credentials):
# its six programs from apps/novaworld_common/Dockerfile, one target each
# (ghcr.io/<owner>/opennova-novaworld-gate, -lobby, -web, -fleet, -worker and
# -data), the web portal's nginx image (ghcr.io/<owner>/novaworld-web, the
# second container in web's task) and the nightly backup task's
# (ghcr.io/<owner>/opennova-novaworld-backup, deploy/backup). Each is tagged
# sha-<short commit>, its branch and, on master, latest: `app deploy --tag`
# pins every one from one tag (DEPLOY.md). CI selects this reusable workflow
# and supplies its shared, tested Linux build and web dist. Manual runs build
# their own prerequisites. All eight runtime images assemble in one bake.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      service-artifact:
        description: "Same-run Linux binary bundle; empty validates/builds a standalone run"
        type: string
        default: ""
      web-artifact:
        description: "Same-run tested web dist; empty builds the portal from source"
        type: string
        default: ""

concurrency:
  # Parent CI owns superseded-build cancellation. Master alone serializes its
  # mutable master/latest aliases; queue:max keeps every full master build.
  group: nw-images-${{ github.ref == 'refs/heads/master' && 'master' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  # Standalone fallback. CI calls net-linux once for both image families and
  # the local stack; every image consumer verifies the same-run bundle.
  http-tests:
    if: inputs.service-artifact == ''
    uses: ./.github/workflows/net-linux.yml

  # Assemble runtime layers from the tested binaries. Only trusted builds
  # export the final-image cache; PRs read it. Cache misses still use the
  # downloaded build, so neither this job nor the publishers compiles C++.
  build:
    needs: http-tests
    if: ${{ !cancelled() && (inputs.service-artifact != '' || needs.http-tests.result == 'success') }}
    outputs:
      service-artifact: ${{ inputs.service-artifact || needs.http-tests.outputs.artifact-name }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    permissions:
      contents: read
    steps:
      # Magic Cache: the bake's type=gha layer cache goes to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the service build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service-artifact || needs.http-tests.outputs.artifact-name }}
          path: build/bundle-download

      - name: Verify the service build
        run: >-
          python scripts/ci/service_bundle.py unpack --archive build/bundle-download/service-binaries.tar.gz
          --to build/service-bundle --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --require-service-tests

      - name: Download the tested portal
        if: inputs.web-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.web-artifact }}
          path: build/portal-build/app/dist

      - name: Build the images
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: ${{ github.event_name != 'pull_request' && 'readwrite' || 'read' }}
          SERVICE_CONTEXT: ./build/service-bundle
          PORTAL_CONTEXT: ${{ inputs.web-artifact != '' && './build/portal-build' || '' }}
        with:
          source: .
          files: apps/novaworld_common/docker-bake.hcl

  # Publish only after the validated build succeeds, never on PRs. Retain the
  # per-target cache/push layout and inspect each published digest: an earlier
  # cached publication lost base layers. Digest records feed staging's release
  # manifest, avoiding mutable tag lookups during its detached rollout.
  push:
    name: push (${{ matrix.target }})
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: runs-on=${{ github.run_id }}/cpu=4/ram=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: gate, image: opennova-novaworld-gate }
          - { target: lobby, image: opennova-novaworld-lobby }
          - { target: web, image: opennova-novaworld-web }
          - { target: fleet, image: opennova-novaworld-fleet }
          - { target: worker, image: opennova-novaworld-worker }
          - { target: data, image: opennova-novaworld-data }
          # The web portal (nginx), web's second container.
          - { target: portal, image: novaworld-web }
          # The nightly backup task's image (pg_dump to S3; deploy/backup).
          - { target: backup, image: opennova-novaworld-backup }
    steps:
      # Magic Cache: the layer cache the build exported, read from the ci
      # account's S3 bucket.
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the service build
        if: matrix.target != 'portal' && matrix.target != 'backup'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.service-artifact }}
          path: build/bundle-download

      - name: Verify the service build
        if: matrix.target != 'portal' && matrix.target != 'backup'
        run: >-
          python scripts/ci/service_bundle.py unpack --archive build/bundle-download/service-binaries.tar.gz
          --to build/service-bundle --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --require-service-tests

      - name: Download the tested portal
        if: matrix.target == 'portal' && inputs.web-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.web-artifact }}
          path: build/portal-build/app/dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's tags and labels as a bake file for the bake definition's
      # meta-<target> target.
      - name: Only the current master updates mutable aliases
        id: aliases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          bake-target: meta-${{ matrix.target }}
          tags: |
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' || steps.aliases.outputs.current == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' && steps.aliases.outputs.current == 'true' }}

      - name: Push the image
        id: push
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: read
          SERVICE_CONTEXT: ${{ matrix.target != 'portal' && matrix.target != 'backup' && './build/service-bundle' || '' }}
          PORTAL_CONTEXT: ${{ matrix.target == 'portal' && inputs.web-artifact != '' && './build/portal-build' || '' }}
        with:
          source: .
          push: true
          targets: ${{ matrix.target }}
          files: |
            apps/novaworld_common/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}

      # A push assembled from the layer cache once shipped a worker image of its last three layers
      # alone, no base and no program (sha-061caf4, 2026-10-26), which no task could start. The
      # image is pulled back and must hold the file its entrypoint names, or the job fails before a
      # deploy can take the tag.
      - name: Check the pushed image holds its entrypoint
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          METADATA: ${{ steps.push.outputs.metadata }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          digest="$(jq -er --arg target "$TARGET" '.[$target]["containerimage.digest"]' <<< "$METADATA")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$IMAGE@$digest"
          docker pull --quiet "$image" >/dev/null
          entry="$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")"
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          if ! docker cp "$cid:$entry" - >/dev/null; then
            echo "::error::$image holds no $entry, the program its entrypoint names"
            exit 1
          fi
          echo "$image holds $entry ($(docker image inspect --format '{{len .RootFS.Layers}}' "$image") layers)"
          jq -n --arg image "$TARGET" --arg repository "$IMAGE" --arg digest "$digest" \
            --arg source_sha "$GITHUB_SHA" --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{image: $image, repository: $repository, digest: $digest, source_sha: $source_sha,
              run_id: $run_id, run_attempt: $run_attempt}' > "$TARGET.json"

      - name: Record the validated image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ matrix.target }}.json
          retention-days: 7
          if-no-files-found: error

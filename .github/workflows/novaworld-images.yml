name: NovaWorld images

# Builds and publishes the NovaWorld server + web portal container images to
# GHCR. The deploy toolbox (deploy/) pulls these so a third party can deploy
# without building locally. Image names: ghcr.io/<owner>/novaworld-server and
# ghcr.io/<owner>/novaworld-web. A third image, ghcr.io/<owner>/opennova-serve
# (apps/serve/Dockerfile), is the headless game server the hosted game servers
# run (ADR 0053); it holds no retail byte, and nothing deploys it yet.

on:
  push:
    branches: [master]
    paths:
      - 'apps/novaworld_server/**'
      # Every engine group: opennova-serve links them all (the server images'
      # engine/net/* paths among them), so master's serve image follows every
      # engine change a hosted server runs.
      - 'engine/**'
      - 'apps/common/**'
      - 'apps/serve/**'
      - 'apps/nw_lister/**'
      - 'backend/**'
      - 'third_party/sqlite/**'
      - 'third_party/bcrypt/**'
      - 'web/**'
      - 'tests/novacrypto/**'
      - 'tests/napi/**'
      - 'tests/novaworld/**'
      - '.github/workflows/novaworld-images.yml'
  # Every pull request, whatever its base (stacked PRs included).
  pull_request:
    paths:
      - 'apps/novaworld_server/**'
      - 'engine/net/novaworld/**'
      - 'engine/net/npwire/**'
      - 'engine/net/napi/**'
      - 'engine/net/novacrypto/**'
      - 'backend/**'
      - 'web/**'
      # The serve image's own sources (its Dockerfile is in apps/serve). A PR
      # into the rest of the engine reaches Linux through ci.yml's test-linux,
      # which builds opennova_serve and runs its tests.
      - 'apps/serve/**'
      - 'apps/nw_lister/**'
      - '.github/workflows/novaworld-images.yml'
  workflow_dispatch:

concurrency:
  group: nw-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the image builds on the net scope passing with the HTTP layer ON,
  # on Linux (the deploy target): the same job definition ci.yml runs on every
  # push and PR (.github/workflows/net-linux.yml), the same flag set the server
  # image uses, so a green here means the image will build.
  http-tests:
    uses: ./.github/workflows/net-linux.yml

  images:
    needs: http-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in + push on push events (PRs from forks can't push to GHCR).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (server)
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novaworld-server
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # Only pushes export the layer cache: a PR's layers are readable by that
      # PR alone and crowd the repository's 10 GB Actions cache. Each image
      # keeps its own scope (one shared scope let the web build's index replace
      # the server's), and mode=min exports the final image's layers only. The
      # build stage's `COPY . .` and compile layers change with every commit,
      # so mode=max wrote ~250 MB of blobs per push that no later build could
      # hit, and they filled the cache until the 7-day expiry.
      - name: Build + push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/novaworld_server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha,scope=novaworld-server
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=novaworld-server,mode=min' || '' }}

      - name: Image metadata (web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novaworld-web
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=novaworld-web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=novaworld-web,mode=min' || '' }}

  # opennova-serve, the headless game server (ADR 0051), as the hosted game
  # servers run it (ADR 0053). The image holds no retail byte: the game data is
  # mounted at /opt/jo (apps/serve/README.md, "Container image"). net-linux.yml,
  # the gate above, builds opennova_serve and runs its tests on Linux. The
  # image is built into the runner's docker and smoke-run first, then the same
  # build (from the builder's cache) is pushed, on push events only.
  serve-image:
    needs: http-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in + push on push events (PRs from forks can't push to GHCR).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (serve)
        id: meta_serve
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-serve
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          load: true
          tags: opennova-serve:ci
          cache-from: type=gha,scope=opennova-serve

      # The run contract, with no game data: the usage exits 0; a start with
      # no install mounted runs as the image's user (10001) in /srv/serve,
      # whose first act empties admin_log.txt there (a fresh named volume
      # takes the image's ownership), then fails the mount with exit 1.
      - name: Smoke-run serve image
        run: |
          set -euo pipefail
          image=opennova-serve:ci
          docker run --rm "$image" --help
          docker volume create serve-smoke >/dev/null
          code=0
          docker run --rm -v serve-smoke:/srv/serve "$image" || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::a start with no game data exited $code, expected 1"
            exit 1
          fi
          owner="$(docker run --rm -v serve-smoke:/srv/serve --entrypoint stat "$image" -c '%u:%g' /srv/serve/admin_log.txt)"
          if [ "$owner" != "10001:10001" ]; then
            echo "::error::admin_log.txt is owned by $owner, expected 10001:10001"
            exit 1
          fi
          docker volume rm serve-smoke >/dev/null

      - name: Push serve image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/serve/Dockerfile
          push: true
          tags: ${{ steps.meta_serve.outputs.tags }}
          labels: ${{ steps.meta_serve.outputs.labels }}
          cache-from: type=gha,scope=opennova-serve
          cache-to: type=gha,scope=opennova-serve,mode=min

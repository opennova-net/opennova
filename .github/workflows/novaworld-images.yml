name: NovaWorld images

# Builds and publishes the NovaWorld service's container images to GHCR, all
# public (the ECS task definitions pull them with no registry credentials):
# its six programs from apps/novaworld_common/Dockerfile, one target each
# (ghcr.io/<owner>/opennova-novaworld-gate, -lobby, -web, -fleet, -worker and
# -data), the web portal's nginx image (ghcr.io/<owner>/novaworld-web, the
# second container in web's task) and the nightly backup task's
# (ghcr.io/<owner>/opennova-novaworld-backup, deploy/backup). Each is tagged
# sha-<short commit>, its branch and, on master, latest: `app deploy --tag`
# pins every one from one tag (DEPLOY.md). All eight build as one bake
# (apps/novaworld_common/docker-bake.hcl) while http-tests runs, and each
# pushes once it has passed.

on:
  push:
    branches: [master]
    # Everything the images' binaries are built from (apps/novaworld_common/Dockerfile):
    # the six programs and the data program's two tools (opennova-project, so the whole
    # editor, and opennova-update-tool) link every engine group, apps/common and the
    # third-party libs those groups link, with the CMake root and the build context's
    # ignore list; plus the portal, the backup task and the http-tests' sources. Master's
    # images so follow every change a deployed program runs (`app deploy --tag sha-<head>`
    # finds them). scripts/ci/test_workflow_triggers.py checks the Dockerfile's targets
    # against this list.
    paths:
      - 'engine/**'
      - 'apps/novaworld_*/**'
      - 'apps/common/**'
      - 'apps/project/**'
      - 'apps/update_tool/**'
      - 'backend/**'
      - 'deploy/backup/**'
      - 'third_party/bcrypt/**'
      - 'third_party/miniz/**'
      - 'third_party/rgbcx/**'
      - 'third_party/imgui/**'
      - 'web/**'
      - 'tests/novacrypto/**'
      - 'tests/napi/**'
      - 'tests/novaworld/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/net-linux.yml'
      - '.github/workflows/novaworld-images.yml'
  # Every pull request, whatever its base (stacked PRs included), that touches the
  # images' own sources or packaging: the service's net libraries, the update wire and
  # the titles' identities its programs speak, the data program's two tools. A PR into
  # the rest of the engine reaches Linux through ci.yml's test-linux, which builds the
  # same targets with the same flags (serve-image.yml draws the same line).
  pull_request:
    paths:
      - 'apps/novaworld_*/**'
      - 'apps/common/**'
      - 'apps/project/**'
      - 'apps/update_tool/**'
      - 'engine/net/novaworld/**'
      - 'engine/net/npwire/**'
      - 'engine/net/napi/**'
      - 'engine/net/novacrypto/**'
      - 'engine/net/update/**'
      - 'engine/net/title/**'
      - 'backend/**'
      - 'deploy/backup/**'
      - 'web/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/novaworld-images.yml'
  workflow_dispatch:

# A PR's newer push cancels its older run. Master's pushes queue instead of
# cancelling, so no run is cut off between its pushes (one image's `latest`
# and sha tag at the new commit, another's still at the old).
concurrency:
  group: nw-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate the push on the net scope passing with the HTTP layer ON, on Linux
  # (the deploy target): the job definition serve-image.yml calls too
  # (.github/workflows/net-linux.yml; ci.yml's test-linux builds a superset of
  # it its own way on every push and on every PR that changes more than the
  # docs pointer and markdown), the same flag set the programs' images use,
  # so a green here means the images will build.
  http-tests:
    uses: ./.github/workflows/net-linux.yml

  # The eight images, one bake, run beside http-tests rather than after it:
  # the one solve compiles the programs' shared build stage once, finishes the
  # six program targets together and builds the portal and the backup image
  # alongside. It pushes nothing. Only push events export the layer cache,
  # each image to its own scope (mode=min: the final image's layers; the
  # build stage's `COPY . .` and compile layers change with every commit, so
  # mode=max would write blobs no later build could hit), which `push` then
  # builds from. A PR's layers would be readable by that PR alone and crowd
  # the repository's 10 GB Actions cache, so a PR's or a manual run's build
  # only reads it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the images
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: ${{ github.event_name != 'pull_request' && 'readwrite' || 'read' }}
        with:
          source: .
          files: apps/novaworld_common/docker-bake.hcl

  # On master's pushes and on a manual run (a branch's images for staging before
  # it merges: its sha and branch tags, never `latest`), never a PR's (PRs from
  # forks can't push to GHCR), once http-tests and the build have passed: each image pushed by a job of its own, its bake
  # target built again with its tags. The checkout is the build's, so every
  # step hits the layer cache the build exported for this commit and nothing
  # compiles; each job only uploads (a missed cache costs time alone: the
  # image builds again, the same). One target per job, not the eight in one
  # bake: a bake whose targets share the build stage but read different cache
  # scopes misses that stage and compiles it again. fail-fast is off so one
  # failed push stops no other image's.
  push:
    name: push (${{ matrix.target }})
    needs: [http-tests, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: gate, image: opennova-novaworld-gate }
          - { target: lobby, image: opennova-novaworld-lobby }
          - { target: web, image: opennova-novaworld-web }
          - { target: fleet, image: opennova-novaworld-fleet }
          - { target: worker, image: opennova-novaworld-worker }
          - { target: data, image: opennova-novaworld-data }
          # The web portal (nginx), web's second container.
          - { target: portal, image: novaworld-web }
          # The nightly backup task's image (pg_dump to S3; deploy/backup).
          - { target: backup, image: opennova-novaworld-backup }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's tags and labels as a bake file for the bake definition's
      # meta-<target> target.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          bake-target: meta-${{ matrix.target }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Push the image
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: read
        with:
          source: .
          push: true
          targets: ${{ matrix.target }}
          files: |
            apps/novaworld_common/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}

name: NovaWorld images

# Builds and publishes the NovaWorld service's container images to GHCR, all
# public (the ECS task definitions pull them with no registry credentials):
# its five programs from apps/novaworld_common/Dockerfile, one target each
# (ghcr.io/<owner>/opennova-novaworld-gate, -lobby, -web, -controller and
# -worker), the web portal's nginx image (ghcr.io/<owner>/novaworld-web, the
# second container in web's task) and the nightly backup task's
# (ghcr.io/<owner>/opennova-novaworld-backup, deploy/backup). Each is tagged
# sha-<short commit>, its branch and, on master, latest: `app deploy --tag`
# pins every one from one tag (DEPLOY.md). All seven build as one bake
# (apps/novaworld_common/docker-bake.hcl) while http-tests runs, and push
# once it has passed.

on:
  push:
    branches: [master]
    paths:
      - 'apps/novaworld_*/**'
      - 'engine/net/novacrypto/**'
      - 'engine/net/napi/**'
      - 'engine/net/novaworld/**'
      - 'engine/net/npwire/**'
      - 'apps/common/**'
      - 'backend/**'
      - 'deploy/backup/**'
      - 'third_party/bcrypt/**'
      - 'web/**'
      - 'tests/novacrypto/**'
      - 'tests/napi/**'
      - 'tests/novaworld/**'
      - '.github/workflows/novaworld-images.yml'
  # Every pull request, whatever its base (stacked PRs included).
  pull_request:
    paths:
      - 'apps/novaworld_*/**'
      - 'engine/net/novaworld/**'
      - 'engine/net/npwire/**'
      - 'engine/net/napi/**'
      - 'engine/net/novacrypto/**'
      - 'backend/**'
      - 'deploy/backup/**'
      - 'web/**'
      - '.github/workflows/novaworld-images.yml'
  workflow_dispatch:

# A PR's newer push cancels its older run. Master's pushes queue instead of
# cancelling, so no run is cut off between its pushes (one image's `latest`
# and sha tag at the new commit, another's still at the old).
concurrency:
  group: nw-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate the push on the net scope passing with the HTTP layer ON, on Linux
  # (the deploy target): the same job definition ci.yml runs on every push and
  # PR (.github/workflows/net-linux.yml), the same flag set the programs'
  # images use, so a green here means the images will build.
  http-tests:
    uses: ./.github/workflows/net-linux.yml

  # The seven images, one bake, run beside http-tests rather than after it:
  # the one solve compiles the programs' shared build stage once, finishes the
  # five program targets together and builds the portal and the backup image
  # alongside. It pushes nothing. Only push events export the layer cache,
  # each image to its own scope (mode=min: the final image's layers; the
  # build stage's `COPY . .` and compile layers change with every commit, so
  # mode=max would write blobs no later build could hit), which `push` then
  # builds from. A PR's layers would be readable by that PR alone and crowd
  # the repository's 10 GB Actions cache, so a PR's or a manual run's build
  # only reads it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the images
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: ${{ github.event_name == 'push' && 'readwrite' || 'read' }}
        with:
          source: .
          files: apps/novaworld_common/docker-bake.hcl

  # On push events alone (PRs from forks can't push to GHCR), once http-tests
  # and the build have passed: the same bake with each image's tags, pushed.
  # Its checkout is the build's, so every step hits the cache the build just
  # exported for this commit and the job compiles nothing, only uploads (a
  # missed cache costs time alone: the same images build again here).
  push:
    needs: [http-tests, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One bake file of tags and labels per image, each for the bake
      # definition's meta-<image> target.
      - name: Image metadata (gate)
        id: meta_gate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-gate
          bake-target: meta-gate
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Image metadata (lobby)
        id: meta_lobby
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-lobby
          bake-target: meta-lobby
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Image metadata (web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-web
          bake-target: meta-web
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Image metadata (controller)
        id: meta_controller
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-controller
          bake-target: meta-controller
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Image metadata (worker)
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-worker
          bake-target: meta-worker
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # The web portal (nginx), web's second container.
      - name: Image metadata (portal)
        id: meta_portal
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novaworld-web
          bake-target: meta-portal
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # The nightly backup task's image (pg_dump to S3; deploy/backup).
      - name: Image metadata (backup)
        id: meta_backup
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennova-novaworld-backup
          bake-target: meta-backup
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Push the images
        uses: docker/bake-action@v6
        env:
          GHA_CACHE: read
        with:
          source: .
          push: true
          files: |
            apps/novaworld_common/docker-bake.hcl
            ${{ steps.meta_gate.outputs.bake-file }}
            ${{ steps.meta_lobby.outputs.bake-file }}
            ${{ steps.meta_web.outputs.bake-file }}
            ${{ steps.meta_controller.outputs.bake-file }}
            ${{ steps.meta_worker.outputs.bake-file }}
            ${{ steps.meta_portal.outputs.bake-file }}
            ${{ steps.meta_backup.outputs.bake-file }}

name: Package Blender add-on

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the zipped manifest (a release tag); empty keeps the tracked one
        type: string
        required: false
        default: ""
    outputs:
      artifact_id:
        description: ID of the installable Blender add-on zip
        value: ${{ jobs.package.outputs.artifact_id }}
      artifact_url:
        description: Download URL of the installable Blender add-on zip
        value: ${{ jobs.package.outputs.artifact_url }}

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # The CLI builds from the root CMake project without godot-cpp or GUT,
      # so the submodules stay uninitialized.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The apps package's build tree (same flags, a superset of this one's
      # targets): package-apps-windows.yml saves it, this job only reads it.
      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-mt
          mode: restore

      - name: Package Blender add-on with Release CLI
        shell: bash
        env:
          ADDON_VERSION: ${{ inputs.version }}
        run: scripts/package_blender_addon.sh dist/opennova-blender-addon-windows.zip "$ADDON_VERSION"

      - name: Smoke-test the packaged CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $unpacked = "build/blender-package-smoke"
          Expand-Archive -LiteralPath dist/opennova-blender-addon-windows.zip -DestinationPath $unpacked -Force
          $cli = "$unpacked/opennova_3di/bin/opennova-3di.exe"
          $dependencies = & dumpbin /DEPENDENTS $cli | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect packaged CLI dependencies" }
          Write-Host $dependencies
          if ($dependencies -match '(?i)\b(?:MSVCP|VCRUNTIME)\w*\.dll\b') {
            throw "Packaged CLI requires an unbundled Visual C++ runtime DLL"
          }
          & $cli build fixtures/threedi/o3d/spinner.o3d -o "$unpacked/spinner.3di"
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to build a model" }
          & $cli scene "$unpacked/spinner.3di" -o "$unpacked/spinner.o3d"
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to read a model" }
          & $cli build "$unpacked/spinner.o3d" -o "$unpacked/spinner-roundtrip.3di"
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to rebuild a model" }
          & $cli compare "$unpacked/spinner.3di" "$unpacked/spinner-roundtrip.3di"
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI round trip changed the model" }
          $timing = & $cli weapon timing fixtures/anim/weapon_timing.txt -o "$unpacked/weapon_actions.txt"
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to compile weapon timing" }
          $preview = $timing | ConvertFrom-Json
          if ($preview.entries[0].cycle_ticks -ne 5 -or $preview.entries[0].rpm -ne 750) {
            throw "Packaged weapon timing disagrees with the native FSM"
          }

      # The add-on as a user installs it: a portable Blender 5.1 (the add-on
      # needs 5.0 or newer; cached by version), the zip installed as an
      # extension into a user folder of the job's own, and every
      # tests/blender/*_test.py run against it (`-- --installed`, see
      # tests/blender/addon_harness.py).
      # Restored everywhere, saved by master only: a PR-scoped copy is
      # readable by that PR alone and crowds the repository's 10 GB cache.
      - name: Restore portable Blender
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: build/blender-download
          key: blender-5.1.2-windows-x64

      # download.blender.org can answer a runner with a bot challenge, so its
      # official mirrors follow it; the checksum is the release's own
      # (blender-5.1.2.sha256).
      - name: Download portable Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $name = "blender-5.1.2-windows-x64.zip"
          $sha256 = "345bedea7b0acf7cc9666423d8553f9129622aea34ded65c23e8cb70f83f14ff"
          New-Item -ItemType Directory -Force build/blender-download | Out-Null
          $zip = "build/blender-download/$name"
          foreach ($site in @("https://download.blender.org/release/Blender5.1",
                              "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.1",
                              "https://mirrors.ocf.berkeley.edu/blender/release/Blender5.1")) {
            try {
              Invoke-WebRequest -Uri "$site/$name" -OutFile $zip
              if ((Get-FileHash -Algorithm SHA256 $zip).Hash -eq $sha256) { break }
              Write-Host "$site/$name does not match the release checksum"
            } catch {
              Write-Host "$site/$name could not be downloaded: $_"
            }
            Remove-Item -Force -ErrorAction SilentlyContinue $zip
          }
          if (-not (Test-Path $zip)) { throw "Could not download $name" }

      - name: Save portable Blender
        if: steps.blender-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/blender-download
          key: blender-5.1.2-windows-x64

      - name: Test the installed add-on in Blender
        shell: pwsh
        env:
          BLENDER_USER_RESOURCES: ${{ github.workspace }}/build/blender-user
        run: |
          $ErrorActionPreference = "Stop"
          7z x -y -obuild/blender build/blender-download/blender-5.1.2-windows-x64.zip | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack Blender" }
          $blender = "build/blender/blender-5.1.2-windows-x64/blender.exe"
          & $blender --background --factory-startup --command extension install-file -r user_default -e `
            dist/opennova-blender-addon-windows.zip
          if ($LASTEXITCODE -ne 0) { throw "Blender could not install the add-on zip" }
          $tests = @(Get-ChildItem tests/blender -Filter *_test.py | Sort-Object Name)
          if ($tests.Count -eq 0) { throw "No tests/blender/*_test.py to run" }
          foreach ($test in $tests) {
            Write-Host "== $($test.Name)"
            & $blender --background --factory-startup --python-exit-code 1 --python $test.FullName -- --installed
            if ($LASTEXITCODE -ne 0) { throw "$($test.Name) failed against the installed add-on" }
          }

      # Upload the installable zip directly, without a second archive wrapper.
      - name: Upload Blender add-on zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-blender-addon-windows.zip
          archive: false
          if-no-files-found: error

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

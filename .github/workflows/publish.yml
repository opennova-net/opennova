name: Publish
# Ships one build to a deployment everywhere at once (ADR 0070, ADR 0071;
# DEPLOY.md):
#
# - the OpenNova runtime's release on the deployment's update service: the
#   build's opennova-runtime-windows-*.sfs uploaded through the deployment's
#   admin API (the environment's ADMIN_API_TOKEN secret and NOVAWORLD_URL
#   variable), waited through validation and published
#   (scripts/publish_runtime.py). The runtime is the game with no project: its
#   releases arrive from here alone. It goes first, so a package the service
#   refuses stops the run before the downloads host changes.
# - the downloads host (downloads.<domain>, infra/aws/downloads.tf), the builds
#   the site's download buttons fetch: the current set alone, each build under
#   its stable name (scripts/stage_downloads.py) beside manifest.json, the
#   builds uploaded first and the manifest last, each with a short Cache-Control
#   so the CDN serves the new set within minutes. The deployment's GitHub deploy
#   role writes the bucket's objects alone (infra/org/account/github.tf).
#
# Two deployments:
#
# - prod: a tagged release's assets, release builds that talk to prod. In the
#   environment `prod`, whose required reviewers approve each run; release.yml
#   starts one for every tag.
# - staging: a pull request's CI build (its run id), debug builds that talk to
#   staging. In the environment `staging`. A master run's builds are release
#   builds, which talk to prod, so a staging publish takes a pull request's run
#   alone.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "prod (a release tag) or staging (a pull request's CI run)"
        type: choice
        options: [staging, prod]
        required: true
      release:
        description: "prod: the release tag (v0.0.21)"
        required: false
        default: ""
      run_id:
        description: "staging: the CI run id of a pull request's build (its Actions URL's number)"
        required: false
        default: ""

# One publish to a deployment at a time.
concurrency:
  group: publish-${{ inputs.deployment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment }}
    permissions:
      contents: read
      actions: read     # a pull request run's artifacts
      id-token: write   # the deployment's deploy role (OIDC)
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT: ${{ inputs.deployment }}
      RELEASE: ${{ inputs.release }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check what to publish
        id: source
        shell: bash
        env:
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$NOVAWORLD_URL" ]] || { echo "::error::the $DEPLOYMENT environment has no NOVAWORLD_URL variable (its site, https://<host>)"; exit 1; }
          [[ -n "$ADMIN_API_TOKEN" ]] || { echo "::error::the $DEPLOYMENT environment has no ADMIN_API_TOKEN secret (the deployment's admin API token)"; exit 1; }
          if [[ "$DEPLOYMENT" == prod ]]; then
            [[ -z "$RUN_ID" ]] || { echo "::error::prod publishes a release tag alone (a CI run's builds are not a release)"; exit 1; }
            [[ "$RELEASE" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::prod needs a release tag (v0.0.21)"; exit 1; }
            gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "build=release" >> "$GITHUB_OUTPUT"
          else
            [[ -z "$RELEASE" ]] || { echo "::error::staging publishes a pull request's CI run alone (a release's builds talk to prod)"; exit 1; }
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::staging needs a CI run id"; exit 1; }
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            event="$(jq -r .event <<<"$run")"
            workflow="$(jq -r .path <<<"$run")"
            conclusion="$(jq -r .conclusion <<<"$run")"
            [[ "$workflow" == .github/workflows/ci.yml ]] || { echo "::error::run $RUN_ID is not a CI run ($workflow)"; exit 1; }
            [[ "$event" == pull_request ]] || { echo "::error::run $RUN_ID is a $event run: its builds are release builds, which talk to prod"; exit 1; }
            [[ "$conclusion" == success ]] || { echo "::error::run $RUN_ID did not succeed ($conclusion)"; exit 1; }
            commit="$(jq -r .head_sha <<<"$run")"
            pr="$(jq -r '.pull_requests[0].number // empty' <<<"$run")"
            echo "version=${pr:+PR #$pr }(${commit:0:7})" >> "$GITHUB_OUTPUT"
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "build=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release's assets
        if: inputs.deployment == 'prod'
        shell: bash
        run: |
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "*-windows-$RELEASE.zip" --pattern "opennova-runtime-windows-$RELEASE.sfs"

      # The package jobs upload with `archive: false`: skip-decompress keeps each
      # zip the zip it is (release.yml does the same). The pattern takes the
      # runtime package too (opennova-runtime-windows-v*.sfs).
      - name: Download the run's builds
        if: inputs.deployment == 'staging'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: "*-windows*"
          merge-multiple: true
          skip-decompress: true
          path: dist

      # Before anything is published: a set missing a build stops here.
      - name: Lay out the stable names and the manifest
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE: ${{ steps.source.outputs.url }}
          COMMIT: ${{ steps.source.outputs.commit }}
          BUILD: ${{ steps.source.outputs.build }}
        run: >-
          python scripts/stage_downloads.py --from dist --to stage --version "$VERSION" --source "$SOURCE"
          --commit "$COMMIT" --build "$BUILD"

      - name: Publish the runtime release
        shell: bash
        env:
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          NAME: OpenNova runtime ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$ADMIN_API_TOKEN" > "$token_file"
          unset ADMIN_API_TOKEN
          python scripts/publish_runtime.py --url "$NOVAWORLD_URL" --token-file "$token_file" \
            --from dist --name "$NAME"

      - name: AWS credentials (OIDC, the deployment's account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the downloads host
        shell: bash
        env:
          BUCKET: opennova-${{ inputs.deployment }}-downloads-${{ vars.AWS_ACCOUNT_ID }}
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          # The builds first (a build the set no longer has removed), then the
          # manifest that names them.
          aws s3 sync stage "s3://$BUCKET/" --exclude manifest.json --delete \
            --content-type application/zip --cache-control "public, max-age=300"
          aws s3 cp stage/manifest.json "s3://$BUCKET/manifest.json" \
            --content-type application/json --cache-control "public, max-age=60"
          {
            echo "### Published ${VERSION} to ${DEPLOYMENT}"
            echo ""
            echo "From ${SOURCE}: the runtime release on ${NOVAWORLD_URL}, and the downloads host."
          } >> "$GITHUB_STEP_SUMMARY"

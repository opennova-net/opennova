name: Publish
# Releases one run's five apps on a deployment (ADR 0072; DEPLOY.md, "The downloads
# host"): the runtime, the editor, the tools, the Blender add-on and the Switcher, each
# the plain build its package job uploaded as the run's artifact, uploaded as a release
# of its product through the deployment's admin API (the environment's ADMIN_API_TOKEN
# secret and NOVAWORLD_URL variable), waited until every one is a draft and then all
# published (scripts/publish_apps.py), so one refusal publishes none. The service packs
# the updatable apps (the runtime and the editor, with the OPENNOVA.WIZ naming its own
# update host) and, once a release is published, renders the downloads host from the
# published releases (each game's zip among them); nothing here writes the host.
#
# Two deployments:
#
# - prod: a tag's release.yml run (release builds, which talk to prod), its VERSION the
#   tag without its "v". In the environment `prod`, whose required reviewers approve each
#   run; release.yml starts one for every tag. Once published, the run waits for the
#   downloads host to list the new releases and attaches every file the host serves to
#   the tag's GitHub release, as <name>-<tag>.zip.
# - staging: a pull request's CI run (debug builds, which talk to staging), its VERSION
#   the head's config/version and the run's number ("0.0.22.123"). ci.yml's
#   publish-staging calls this for every run of a branch of this repository once its
#   package jobs pass; a run id dispatched by hand publishes that run again.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "prod (a release tag's run) or staging (a pull request's CI run)"
        type: choice
        options: [staging, prod]
        required: true
      release:
        description: "prod: the release tag (v0.0.22)"
        required: false
        default: ""
      run_id:
        description: "the run whose builds to publish: prod's tag's release.yml run, staging's pull request CI run"
        required: true
  workflow_call:
    inputs:
      deployment:
        type: string
        required: true
      release:
        type: string
        required: false
        default: ""
      run_id:
        type: string
        required: true

# One publish to a deployment at a time. ci.yml's caller job holds publish-staging
# itself, so a called run takes another name, or the two would wait on each other.
concurrency:
  group: publish-${{ inputs.deployment }}${{ github.event_name == 'workflow_dispatch' && '' || '-ci' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment }}
    permissions:
      contents: write   # prod: the GitHub release's assets
      actions: read     # the run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT: ${{ inputs.deployment }}
      RELEASE: ${{ inputs.release }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check what to publish
        id: source
        shell: bash
        env:
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$NOVAWORLD_URL" ]] || { echo "::error::the $DEPLOYMENT environment has no NOVAWORLD_URL variable (its site, https://<host>)"; exit 1; }
          [[ -n "$ADMIN_API_TOKEN" ]] || { echo "::error::the $DEPLOYMENT environment has no ADMIN_API_TOKEN secret (the deployment's admin API token)"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be the id of the run whose builds to publish"; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          workflow="$(jq -r .path <<<"$run")"
          event="$(jq -r .event <<<"$run")"
          head="$(jq -r .head_sha <<<"$run")"
          if [[ "$DEPLOYMENT" == prod ]]; then
            [[ "$RELEASE" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "::error::prod needs a release tag (v0.0.22)"; exit 1; }
            [[ "$workflow" == .github/workflows/release.yml ]] || { echo "::error::run $RUN_ID is not a release.yml run ($workflow): prod publishes a tag's release builds"; exit 1; }
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
            [[ "$commit" == "$head" ]] || { echo "::error::run $RUN_ID built $head, not $RELEASE ($commit)"; exit 1; }
            gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
            echo "version=${RELEASE#v}" >> "$GITHUB_OUTPUT"
            echo "label=$RELEASE" >> "$GITHUB_OUTPUT"
          else
            [[ -z "$RELEASE" ]] || { echo "::error::staging publishes a pull request's CI run alone (a release's builds talk to prod)"; exit 1; }
            [[ "$workflow" == .github/workflows/ci.yml ]] || { echo "::error::run $RUN_ID is not a CI run ($workflow)"; exit 1; }
            [[ "$event" == pull_request ]] || { echo "::error::run $RUN_ID is a $event run: its builds are release builds, which talk to prod"; exit 1; }
            # The head's config/version, then the run's number: dotted numbers alone, as a
            # command file's VERSION must be (D-UPD-11).
            project="$(gh api "repos/$GITHUB_REPOSITORY/contents/godot/project.godot?ref=$head" --jq .content | base64 -d)"
            base="$(sed -n 's/^config\/version="\([0-9.]*\)"$/\1/p' <<<"$project" | head -n 1)"
            [[ "$base" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::$head's config/version ($base) is not one to three numbers"; exit 1; }
            pr="$(jq -r '.pull_requests[0].number // empty' <<<"$run")"
            echo "version=$base.$(jq -r .run_number <<<"$run")" >> "$GITHUB_OUTPUT"
            echo "label=${pr:+PR #$pr }(${head:0:7})" >> "$GITHUB_OUTPUT"
          fi

      # The package jobs upload with `archive: false`, each artifact the zip it is:
      # skip-decompress keeps it so (release.yml's own downloads do the same). A called
      # run reads its caller's artifacts while that run is still going.
      - name: Download the run's builds
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: "opennova-*-windows*.zip"
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Publish the apps
        shell: bash
        env:
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
          LABEL: ${{ steps.source.outputs.label }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$ADMIN_API_TOKEN" > "$token_file"
          unset ADMIN_API_TOKEN
          python scripts/publish_apps.py publish --url "$NOVAWORLD_URL" --token-file "$token_file" \
            --from dist --version "$VERSION" --label "$LABEL" --out published.json
          {
            echo "### Published $LABEL ($VERSION) to $DEPLOYMENT"
            echo ""
            jq -r '.[] | "- \(.key): \(if .unchanged then "unchanged" else "release \(.release.id)" end)"' published.json
          } >> "$GITHUB_STEP_SUMMARY"

      # The downloads host is downloads.<the site's host> (web/src/api/downloads.ts).
      - name: Attach the downloads host's files to the GitHub release
        if: inputs.deployment == 'prod'
        shell: bash
        env:
          NOVAWORLD_URL: ${{ vars.NOVAWORLD_URL }}
        run: |
          set -euo pipefail
          host="${NOVAWORLD_URL#https://}"
          host="${host%%/*}"
          python scripts/publish_apps.py attach --manifest "https://downloads.${host#www.}/manifest.json" \
            --published published.json --tag "$RELEASE" --to assets > assets.txt
          mapfile -t files < assets.txt
          (( ${#files[@]} > 0 )) || { echo "::error::the downloads host lists no file"; exit 1; }
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build and test
        shell: bash
        run: scripts/build.sh

  godot-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ matrix.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" ]; then
            mkdir -p .godot-bin
            curl -fL -o .godot-bin/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot.zip -d .godot-bin
            chmod +x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi

      - name: Install Godot (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      - name: Build GDExtension
        shell: bash
        run: |
          cmake -S godot/engine -B build-godot -DCMAKE_BUILD_TYPE=Release
          cmake --build build-godot --config Release --target opennova -j

      - name: Prime Godot import cache
        shell: bash
        continue-on-error: true
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          else
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/bootstrap_godot.sh
          "$GODOT_BIN" --headless --path godot --import

      - name: Run Godot tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          else
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/test_godot.sh

  package-addon:
    runs-on: ubuntu-latest
    needs: [test, godot-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/*.zip

  package-importer:
    runs-on: windows-latest
    needs: [test, godot-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport.exe

  package-max-mzp:
    runs-on: windows-latest
    needs: [test, godot-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package 3ds Max MZP
        shell: pwsh
        run: scripts/package_max_mzp.ps1

      - name: Upload 3ds Max MZP
        uses: actions/upload-artifact@v4
        with:
          name: opennova_max
          path: dist/opennova_max-v*.mzp

  package-godot:
    runs-on: windows-latest
    needs: [test, godot-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Package Godot exports
        shell: pwsh
        run: scripts/package_godot_windows.ps1

      - name: Upload opennova-modtools Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_windows
          path: dist/opennova-modtools-windows.zip

      - name: Upload opennova runtime Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_windows
          path: dist/opennova-runtime-windows.zip

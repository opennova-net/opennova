name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build and test
        shell: bash
        env:
          BUILD_GODOT: "0"
        run: scripts/build.sh

  modsuperoed-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Validate ModSuperOED fixture pack
        shell: bash
        run: |
          git -C third_party/modsuperoed lfs install --local
          git -C third_party/modsuperoed lfs pull
          git -C third_party/modsuperoed lfs fsck --objects
          test -f third_party/modsuperoed/ModSuperOed.exe
          test -f third_party/modsuperoed/CharModel.3dp
          test -f third_party/modsuperoed/CharModel.3di

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv

      - name: Build ModSuperOED hook
        shell: pwsh
        run: |
          cmake -S . -B build-modsuperoed -A Win32
          cmake --build build-modsuperoed --config Release --target modsuperoed_injector modsuperoed_hook

      - name: Build native comparator library
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_SHARED_LIB=ON -DOPENNOVA_ENABLE_MODSUPEROED_TOOLS=OFF
          cmake --build build --config Release --target opennova_shared

      - name: Run ModSuperOED smoke
        shell: pwsh
        env:
          OPENNOVA_MODSUPEROED_DIR: ${{ github.workspace }}\third_party\modsuperoed
        run: uv run pytest tests/test_modsuperoed_automation.py::test_external_modsuperoed_smoke -q

  godot-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ matrix.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" ]; then
            mkdir -p .godot-bin
            curl -fL -o .godot-bin/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot.zip -d .godot-bin
            chmod +x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi

      - name: Install Godot (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      - name: Install Godot (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # macOS Godot ships as a .app bundle; the binary lives inside it.
          if [ ! -x ".godot-bin/Godot.app/Contents/MacOS/Godot" ]; then
            mkdir -p .godot-bin
            curl -fL -o .godot-bin/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
            unzip -o .godot-bin/godot.zip -d .godot-bin
            chmod +x ".godot-bin/Godot.app/Contents/MacOS/Godot"
          fi

      - name: Build GDExtension
        shell: bash
        run: |
          cmake -S godot/engine -B build-godot -DCMAKE_BUILD_TYPE=Release
          # Bound parallelism: a bare -j on the macOS Unix Makefiles generator
          # means unbounded jobs, which OOM/swap-thrashes the 3-core runner.
          cmake --build build-godot --config Release --target opennova -j 3

      - name: Prime Godot import cache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            GODOT_BIN="${PWD}/.godot-bin/Godot.app/Contents/MacOS/Godot"
          else
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/bootstrap_godot.sh
          # The editor importer can still crash on a cold import; a half-baked
          # cache makes the test run fail with confusing "missing resource"
          # errors instead of a clear signal. Retry, and fail loudly if the
          # import never completes (was previously masked by continue-on-error).
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Godot tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export GODOT_BIN="${PWD}/.godot-bin/Godot.app/Contents/MacOS/Godot"
          else
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/test_godot.sh

  package-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/opennova_blender-v*.zip

  package-max-mzp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Max MZP
        shell: pwsh
        run: scripts/package_max_mzp.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_max
          path: dist/opennova_max-v*.mzp

  package-importer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport-v*.exe

  package-godot-windows-editor:
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows editor export
        shell: pwsh
        run: scripts/package_godot_editor_windows.ps1

      - name: Upload opennova-modtools Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_windows
          path: dist/opennova-modtools-windows-v*.zip

  package-godot-windows-runtime:
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot Windows runtime export
        shell: pwsh
        run: scripts/package_godot_runtime_windows.ps1

      - name: Upload opennova runtime Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_windows
          path: dist/opennova-runtime-windows-v*.zip

  package-godot-macos-editor:
    runs-on: macos-latest
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot macOS editor export
        shell: bash
        run: scripts/package_godot_editor_macos.sh

      - name: Upload opennova-modtools macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_modtools_macos
          path: dist/opennova-modtools-macos-v*.zip

  package-godot-macos-runtime:
    runs-on: macos-latest
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck --objects

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Package Godot macOS runtime export
        shell: bash
        run: scripts/package_godot_runtime_macos.sh

      - name: Upload opennova runtime macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: opennova_runtime_macos
          path: dist/opennova-runtime-macos-v*.zip

  validate-deliverables:
    runs-on: ubuntu-latest
    needs: [test, godot-tests, package-addon, package-max-mzp, package-importer, package-godot-windows-editor, package-godot-windows-runtime, package-godot-macos-editor, package-godot-macos-runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate release deliverables
        run: python scripts/validate_release_deliverables.py --release-version 0.0.0-ci

      - name: Upload staged release assets
        uses: actions/upload-artifact@v4
        with:
          name: opennova_release_assets
          path: dist/release-assets/*

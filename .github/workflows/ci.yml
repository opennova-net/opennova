name: CI

on:
  push:
    branches: [master]
  # Every pull request, whatever its base: a PR stacked on another PR's
  # branch gets the same checks as one targeting master.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a PR, github.head_ref is the source branch, so a new push cancels the older
# run (and prevents two runs racing to post the build-links comment). On push to
# master, head_ref is empty and we fall back to the unique run_id, so master runs
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only the private docs pointer and markdown
  # builds and tests nothing: no build or test reads those paths, and the lint
  # gates that do read them still run in `test`. Every other PR, and every
  # master push, runs everything. The two required checks (`test`,
  # `godot-tests`) gate their steps on `code` instead of skipping the job: a
  # skipped matrix job reports under its bare name, which would leave the
  # required "<job> (windows-latest)" check pending forever.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
            if [[ -n "$files" ]] && ! grep -qvxE 'docs|.*\.md' <<< "$files"; then
              code=false
              echo "Only the docs pointer and markdown changed: the builds and tests skip." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  # The C++ engine + ctest suites, core then retail, from ONE build. Built with
  # Ninja + sccache (.github/actions/compiler-cache): the Visual Studio
  # generator ignores CMAKE_*_COMPILER_LAUNCHER. scripts/build.sh lets CMake
  # read CMAKE_GENERATOR and the launcher variables from the environment on a
  # fresh configure, and Release carries no PDB flags, so every object is
  # cacheable as-is. The retail leg (docs/asset-gated-tests.md) reuses the
  # tree: the two roots are read at test time only, so `--suite retail`
  # rebuilds nothing. It runs whenever the reference data is reachable (not on
  # fork PRs) and blocks the merge like the core leg.
  test:
    # One-entry matrix on purpose: branch protection requires the check named
    # "test (windows-latest)", which the matrix produces.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [changes, retail-availability]
    permissions:
      contents: read
      actions: write   # the compiler cache's master save replaces its older entries
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CODE: ${{ needs.changes.outputs.code }}
      RETAIL: ${{ needs.retail-availability.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only
          submodules: recursive
          # Full history so the diff-scoped maturity lint can resolve
          # origin/master...HEAD on PR builds (it self-skips without a base).
          fetch-depth: 0

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Maturity-program guards (docs/maturity-program.md, STD-1), enforced
      # since the Wave-2 boundary (STD-3): the ratchet fails on any counter
      # increase vs scripts/lint/maturity_baseline.json; the diff-scoped
      # dict-contract lint fails on new class-level Dictionary contracts
      # (magic numbers stay advisory). The divergence-ledger scoreboard check
      # lives with the ledger in the private docs repo (tools/ledger_check.py).
      # The link-graph check (LIBS-1, ADR 0020) has no configured build tree
      # at this point in the job, so it walks the CMake files transitively;
      # local runs against build/ use `cmake --graphviz` ground truth.
      - name: Maturity gates (STD-1, enforced)
        shell: bash
        run: |
          python scripts/lint/ratchet_counts.py --enforce
          python scripts/lint/maturity_lint.py --enforce
          python scripts/lint/link_graph_check.py --enforce
          python scripts/lint/include_graph_check.py --enforce
          # The godot-cpp build profile (godot/src/godot_cpp_profile.json) is
          # derived from godot/src: a binding that starts using a new engine
          # class must regenerate it (--write) or the extension fails to compile.
          python scripts/lint/godot_cpp_profile.py --enforce
          # Orphan engine headers (the post-merge tidy rounds' recurring
          # finding): a header included only by its test must carry the
          # STAGED, NOT WIRED paragraph or a reasoned allowlist row.
          python scripts/lint/orphan_header_check.py --enforce
          # Witness-address census (ADR 0043): the SET of `@0xADDR` addresses
          # cited under engine/, godot/, apps/ and tests/ never loses a member
          # silently; a structural slice leaves it identical, a deletion is
          # banked with --write-baseline and named in the commit.
          python scripts/lint/cite_census.py --enforce
          # Fixture provenance gate (fixtures/README.md): every fixture is
          # minted by a generator, authored, or a keep-set retail-interop row
          # in scripts/lint/fixture_allowlist.json; LFS-tracked, under 2 MiB,
          # referenced by a test or doc, and materialized in this checkout.
          python scripts/lint/fixture_lint.py --enforce --require-pulled
          # Environment-variable gate (docs/dev-env-vars.md): the two machine
          # roots through their resolvers, GODOT_BIN in the scripts, the
          # deployed service's own config and the OS variables; nothing else.
          python scripts/lint/env_lint.py --enforce
          # Vocabulary conventions (CLAUDE.md): no Nova/nova_ prefix (ADR 0040).
          python scripts/lint/conventions_lint.py --enforce
          # Suite isolation, migration coverage and report-completeness checks.
          python scripts/ci/test_suites.py --suite core --check-layout
          python -B -m unittest discover -s scripts/ci -p test_test_suites.py
          # The scripted game launch starts behind every window and never takes
          # the foreground (game_mcp.BehindLaunch; docs/mcp.md "Launching").
          python -B -m unittest discover -s scripts/mcp -p "test_*.py"

      # cl/link on PATH for the Ninja generator (the VS generator found them by
      # itself; vcvars prepends the VC bin dir, and CMake's Ninja compiler search
      # takes the first compiler in PATH order); sccache in front of cl for the
      # compiler-launcher cache.
      - name: Set up MSVC environment
        if: env.CODE == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the compiler cache
        if: env.CODE == 'true'
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-root
          mode: restore

      - name: Toolchain sanity (Ninja + cl on PATH)
        if: env.CODE == 'true'
        shell: bash
        run: |
          cmake --version
          ninja --version
          command -v cl

      - name: Build and test (core)
        if: env.CODE == 'true'
        shell: bash
        run: scripts/build.sh --no-godot --suite core

      - name: Upload native core test reports
        if: always() && env.CODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-core-reports
          if-no-files-found: warn
          path: build/Testing/

      # The retail data the asset gates need (docs/asset-gated-tests.md): the
      # composite action restores or checks out the two private reference
      # repositories and exports the two roots.
      - name: Mount the reference data
        if: env.CODE == 'true' && env.RETAIL == 'true'
        uses: ./.github/actions/mount-reference-data
        with:
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          enabled: ${{ env.RETAIL }}

      - name: Test (retail)
        if: env.CODE == 'true' && env.RETAIL == 'true'
        shell: bash
        run: scripts/build.sh --no-godot --suite retail

      - name: Upload native retail test reports
        if: always() && env.CODE == 'true' && env.RETAIL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-retail-reports
          if-no-files-found: warn
          path: build/Testing/

      - name: sccache stats
        if: always() && env.CODE == 'true'
        shell: bash
        run: sccache --show-stats

      - name: Save the compiler cache
        if: env.CODE == 'true'
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-root
          mode: save

  # The same build on Linux, configured with the NovaWorld server's HTTP layer
  # ON (the deploy target's flag set; it adds the Crow sources to the server
  # target and changes no other object), so this job also covers the net leg
  # .github/workflows/net-linux.yml runs for the NovaWorld images workflow.
  # The two share the linux-root compiler cache.
  test-linux:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's master save replaces its older entries
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # The root CMake project builds without godot-cpp or GUT, so the
      # submodules stay uninitialized.
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      - name: Build and test
        shell: bash
        run: scripts/build.sh --no-godot --suite core --cmake-arg -DBUILD_NOVAWORLD_HTTP=ON

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: save

      - name: Upload Linux native core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-linux-reports
          if-no-files-found: warn
          path: build/Testing/

  # Match the Windows flavours: PRs exercise the editor/debug extension;
  # master pushes and manual runs also compile the release extension. Both
  # Linux flavours build as CMake Release (no debug info, stripped): the
  # template_debug .so only feeds godot-tests-linux, and RelWithDebInfo made
  # it a 674 MiB artifact and a compiler cache several times this size.
  build-gdextension-linux:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's master save replaces its older entries
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["template_debug"]') || fromJSON('["template_debug","template_release"]') }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-gdext-${{ matrix.target }}
          mode: restore

      - name: Build Linux GDExtension (${{ matrix.target }})
        env:
          GODOTCPP_TARGET: ${{ matrix.target }}
        run: |
          case "$GODOTCPP_TARGET" in
            template_debug) build_dir=build-godot-debug ;;
            template_release) build_dir=build-godot-release ;;
            *) echo "unknown GODOTCPP_TARGET: $GODOTCPP_TARGET" >&2; exit 2 ;;
          esac
          cmake -S godot/src -B "$build_dir" -G Ninja \
            -DGODOTCPP_TARGET="$GODOTCPP_TARGET" -DCMAKE_BUILD_TYPE=Release
          # Both variants, as on Windows (ADR 0046 d4): a source run such as GUT
          # loads the editor-enabled library through the plain .gdextension row.
          cmake --build "$build_dir" --target opennova opennova_editor_gdext --parallel "$(nproc)"
          test -f "godot/bin/libopennova.linux.$GODOTCPP_TARGET.x86_64.so"
          test -f "godot/bin/libopennova_editor.linux.$GODOTCPP_TARGET.x86_64.so"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-gdext-${{ matrix.target }}
          mode: save

      - name: Upload Linux GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gdext_linux_${{ matrix.target }}
          if-no-files-found: error
          path: |
            godot/bin/libopennova.linux.${{ matrix.target }}.x86_64.so
            godot/bin/libopennova_editor.linux.${{ matrix.target }}.x86_64.so

  # The web build's side module (ADR 0049), in the Emscripten that built Godot
  # 4.6's web templates (scripts/build_godot_web.sh pins it). A compile check:
  # an engine change that breaks wasm32 (ILP32, -pthread) fails here, while the
  # site image itself is game-web.yml's.
  # Paused: the web build is on hold (the Compatibility renderer's 4096-value
  # instance-uniform buffer cannot hold a mission's terrain and objects), so
  # no PR waits on it. Drop the `if` to turn it back on.
  build-gdextension-web:
    if: false
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.20
    permissions:
      contents: read
      actions: write   # the compiler cache's master save replaces its older entries
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: web-gdext
          mode: restore

      # The image's CMake predates the sqlite fetch's options.
      - name: Install CMake + Ninja
        run: pip install --no-cache-dir "cmake>=3.28,<4" ninja

      - name: Build the web GDExtension (template_release)
        run: |
          scripts/build_godot_web.sh --release --build-dir build-godot-web
          test -f godot/bin/libopennova.web.template_release.wasm32.wasm

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: web-gdext
          mode: save

  godot-tests-linux:
    runs-on: ubuntu-latest
    needs: [build-gdextension-linux]   # skipped with it on docs-only PRs
    env:
      GODOT_VERSION: 4.6.1-stable
      OPENNOVA_JO_DIR: ''
      OPENNOVA_JO_ASSETS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        run: |
          bin=".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$bin" ]]; then
            mkdir -p .godot-bin
            curl -fsSL --retry 3 -o .godot-bin/godot-linux.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot-linux.zip -d .godot-bin
          fi
          chmod +x "$bin"

      # The template_debug flavour; GUT loads the editor-enabled variant through
      # the plain .gdextension row.
      - name: Download Linux GDExtensions
        uses: actions/download-artifact@v4
        with:
          name: gdext_linux_template_debug
          path: godot/bin

      - name: Prime Godot import cache
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          bash scripts/bootstrap_godot.sh
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Linux Godot core tests
        run: |
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          bash scripts/test_godot.sh --suite core

      - name: Upload Linux Godot core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-core-linux-reports
          if-no-files-found: warn
          path: build/Testing/

  # Type-check + build the NovaWorld web portal (web/). The built dist is an
  # artifact only; production images bake it via web/Dockerfile (Track B).
  web:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          if-no-files-found: error
          path: web/dist

  # Compile the GDExtension (godot/src + engine/ + the pinned third_party/godot-cpp)
  # once per flavour; godot-tests and the Windows package job download the
  # DLLs instead of recompiling. Flavours are godot-cpp targets and name the DLL:
  #   template_debug   -> what the Godot EDITOR loads (godot-tests, and the export
  #                       step's script scan) and what a --export-debug exe loads.
  #   template_release -> what a --export-release exe loads (the release zip).
  # A pull request builds only template_debug and packages in debug export mode
  # (~4.7 min per flavour on a warm cache, mostly MSVC preprocessing on sccache
  # hits — halving the legs halves the wall-clock in front of godot-tests and the
  # PR build links). Master pushes and manual runs also build template_release,
  # in parallel, so the release flavour and release-mode packaging stay
  # continuously verified. sccache caches godot-cpp's objects across runs, so
  # after one warm-up only changed engine/ sources recompile. Windows must
  # use Ninja: the Visual Studio generator ignores CMAKE_*_COMPILER_LAUNCHER.
  build-gdextension-windows:
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's master save replaces its older entries
    strategy:
      fail-fast: false
      matrix:
        # Per-key fromJSON is the documented matrix form. The target -> CMake
        # config mapping lives in the build step, NOT in matrix.include: an
        # include entry whose target is absent from this list would be added as
        # an extra combination and resurrect the release leg on PRs.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["template_debug"]') || fromJSON('["template_debug","template_release"]') }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # the build consumes no LFS game assets

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-gdext-${{ matrix.target }}
          mode: restore

      - name: Build GDExtension (${{ matrix.target }})
        shell: pwsh
        env:
          GODOTCPP_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          # First-run toolchain sanity: CMake must be >= 3.25 for the /Z7 flag, and
          # Ninja + cl must be on PATH (the latter via msvc-dev-cmd).
          cmake --version
          ninja --version
          Write-Host "cl: $((Get-Command cl -ErrorAction SilentlyContinue).Source)"
          # template_debug is built RelWithDebInfo: optimized native code plus
          # symbols, the same flavour scripts/build_godot.sh Dev produces for the
          # editor. template_release is a plain Release. The build dirs keep their
          # names on purpose: sccache keys embed the absolute paths of godot-cpp's
          # generated headers under the build dir, so renaming a dir invalidates
          # every cached godot-cpp object (one cold ~28 min leg).
          $flavours = @{
            template_debug   = @{ config = "RelWithDebInfo"; dir = "build-godot-debug" }
            template_release = @{ config = "Release"; dir = "build-godot-release" }
          }
          $flavour = $flavours[$env:GODOTCPP_TARGET]
          if (-not $flavour) { throw "unknown GODOTCPP_TARGET: $env:GODOTCPP_TARGET" }
          $buildType = $flavour.config
          $buildDir = $flavour.dir
          # -G Ninja so the sccache compiler launcher is honored. /Z7 (embedded
          # debug info via CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) makes the
          # RelWithDebInfo objects cacheable; the default /Zi separate-PDB is not.
          # CMP0141=NEW forces that policy into godot-cpp (its CMake policy ceiling
          # is < 3.25).
          cmake -S godot/src -B $buildDir -G Ninja `
            "-DGODOTCPP_TARGET=$env:GODOTCPP_TARGET" `
            "-DCMAKE_BUILD_TYPE=$buildType" `
            "-DCMAKE_POLICY_DEFAULT_CMP0141=NEW" `
            "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          if ($LASTEXITCODE -ne 0) { throw "configure $env:GODOTCPP_TARGET failed" }
          # Both variants of the flavour from the one configure (ADR 0046 d4): the
          # runtime-only libopennova.* and the editor-enabled libopennova_editor.*.
          cmake --build $buildDir --target opennova opennova_editor_gdext
          if ($LASTEXITCODE -ne 0) { throw "build $env:GODOTCPP_TARGET failed" }
          foreach ($dll in @("godot/bin/libopennova.windows.$env:GODOTCPP_TARGET.x86_64.dll",
                             "godot/bin/libopennova_editor.windows.$env:GODOTCPP_TARGET.x86_64.dll")) {
            if (-not (Test-Path $dll)) { throw "missing GDExtension DLL: $dll" }
          }

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-gdext-${{ matrix.target }}
          mode: save

      - name: Upload Windows GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gdext_windows_${{ matrix.target }}
          if-no-files-found: error
          path: |
            godot/bin/libopennova.windows.${{ matrix.target }}.x86_64.dll
            godot/bin/libopennova_editor.windows.${{ matrix.target }}.x86_64.dll

  godot-tests:
    # One-entry matrix on purpose: branch protection requires the check named
    # "godot-tests (windows-latest)", which the matrix produces.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [changes, build-gdextension-windows]
    # Runs (its steps gated on `code`) when the extension build was skipped
    # for a docs-only PR, so the required check still reports; skipped, as
    # before, when that build failed. A failed `changes` skips it too, which
    # leaves the required check pending rather than vacuously green.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.build-gdextension-windows.result != 'failure'
    env:
      GODOT_VERSION: 4.6.1-stable
      OPENNOVA_JO_DIR: ''
      OPENNOVA_JO_ASSETS: ''
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: env.CODE == 'true'
        with:
          lfs: false   # scoped below: the tests read fixtures/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        if: env.CODE == 'true'
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      # runner.os, like the package and release jobs: one cache entry serves
      # every job that installs this binary.
      - name: Cache Godot binary
        if: env.CODE == 'true'
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # This job uses the Windows console binary and matching GDExtension.
      - name: Install Godot (Windows)
        if: env.CODE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64_console.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      # The editor binary that runs GUT loads the template_debug flavour only
      # (the editor-enabled variant, through the plain .gdextension row).
      - name: Download GDExtensions (Windows)
        if: env.CODE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gdext_windows_template_debug
          path: godot/bin

      - name: Prime Godot import cache
        if: env.CODE == 'true'
        shell: bash
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/bootstrap_godot.sh
          # The editor importer can still crash on a cold import; a half-baked
          # cache makes the test run fail with confusing "missing resource"
          # errors instead of a clear signal. Retry, and fail loudly if the
          # import never completes (was previously masked by continue-on-error).
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Godot tests
        if: env.CODE == 'true'
        shell: bash
        run: |
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/test_godot.sh --suite core

      - name: Upload godot core test reports
        if: always() && env.CODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: godot-core-reports
          if-no-files-found: warn
          path: build/Testing/

  # The game archive and the editor archive (the editor plus the runtime it
  # plays a project with).
  package-godot-windows:
    runs-on: windows-latest
    needs: [build-gdextension-windows]
    outputs:
      game_artifact_url: ${{ steps.upload_game.outputs.artifact-url }}
      editor_artifact_url: ${{ steps.upload_editor.outputs.artifact-url }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the package reads assets/ only
          submodules: recursive

      # The models, clips and textures in assets/ ride LFS. Their objects are
      # cached by the pointer set, so a run restores them instead of
      # spending LFS bandwidth on every package. Like every large cache here,
      # only master saves it: a PR-scoped copy is readable by that PR alone
      # and crowds the repository's 10 GB cache.
      - name: Key the bundled LFS assets
        id: assets-lfs
        shell: bash
        run: echo "key=assets-lfs-$(git lfs ls-files -l -I 'assets/**' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the bundled LFS assets
        id: assets-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.assets-lfs.outputs.key }}

      - name: Pull Git LFS assets (assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="assets/**"

      - name: Save the bundled LFS assets
        if: github.ref == 'refs/heads/master' && steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.assets-lfs.outputs.key }}

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # The x86_64 Windows templates only (the export preset's target), not the
      # whole 1.2 GB set: package_godot_windows.ps1 skips its download
      # whenever version.txt is present.
      - name: Restore Godot export templates
        id: templates-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/version.txt
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/icudt_godot.dat
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/windows_*_x86_64*
          key: godot-export-templates-windows-${{ env.GODOT_VERSION }}

      # Every flavour this run built (template_debug only on a PR).
      - name: Download GDExtension
        uses: actions/download-artifact@v4
        with:
          pattern: gdext_windows_*
          merge-multiple: true
          path: godot/bin

      # PRs export in debug mode (debug export template + the template_debug DLL,
      # the development flavour); master/manual runs export in
      # release mode like the release workflow.
      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1 -SkipBuild -ExportMode ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

      - name: Save Godot export templates
        if: github.ref == 'refs/heads/master' && steps.templates-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/version.txt
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/icudt_godot.dat
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/windows_*_x86_64*
          key: godot-export-templates-windows-${{ env.GODOT_VERSION }}

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenNova Windows editor zip
        id: upload_editor
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

  # The same installable Blender package is built for PRs and tagged releases.
  package-blender-windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/package-blender-windows.yml

  # The native apps (opennova-3di, opennova-extract, opennova-lan-probe,
  # opennova-nw-lister, opennova-wire and the NovaWorld server) in one zip, built
  # for PRs and tagged releases alike.
  package-apps-windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # its compiler cache's master save replaces older entries
    uses: ./.github/workflows/package-apps-windows.yml

  # Surface the Windows packages on the PR as a single comment that updates
  # in place after every package succeeds. A failed package leaves the previous
  # comment untouched.
  pr-build-links:
    runs-on: ubuntu-latest
    needs: [package-godot-windows, package-blender-windows, package-apps-windows]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the build-links comment
        uses: actions/github-script@v7
        env:
          GAME_URL: ${{ needs.package-godot-windows.outputs.game_artifact_url }}
          EDITOR_URL: ${{ needs.package-godot-windows.outputs.editor_artifact_url }}
          BLENDER_URL: ${{ needs.package-blender-windows.outputs.artifact_url }}
          APPS_URL: ${{ needs.package-apps-windows.outputs.artifact_url }}
        with:
          script: |
            // A hidden marker lets us find our own comment across runs, so there
            // is only ever one: find it -> update; absent -> create.
            const marker = '<!-- opennova-ci-build-links -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = (context.payload.pull_request.head.sha || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### OpenNova CI builds',
              '',
              `Windows builds for this PR (commit \`${sha}\`, run [#${context.runNumber}](${runUrl})). The game uses the debug export template and template_debug GDExtension. The Blender add-on and the apps are Release builds. Tagged releases publish every package, with the game in release mode.`,
              '',
              '| Build | Download |',
              '| --- | --- |',
              `| Runtime: opennova.exe with the placeholder menu; PLAY RETAIL plays your own Joint Operations install | [opennova-game-windows.zip](${process.env.GAME_URL}) |`,
              `| Editor: opennova-editor.exe with the runtime it plays a project with (experimental) | [opennova-editor-windows.zip](${process.env.EDITOR_URL}) |`,
              `| Blender 5.0+ add-on for Windows: import/export .3di models and their .adm/.bad animations; install the zip from disk | [opennova-blender-addon-windows.zip](${process.env.BLENDER_URL}) |`,
              `| Apps: opennova-3di, opennova-extract, opennova-lan-probe, opennova-nw-lister, opennova-wire and the NovaWorld server (gate and session listeners) | [opennova-apps-windows.zip](${process.env.APPS_URL}) |`,
              '',
              'Downloading requires a GitHub login. Artifacts are removed after 90 days. This comment updates on each successful build.',
            ].join('\n');
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // Forked-PR tokens are read-only and cannot comment; warn instead of
              // failing CI. Same-repo branch PRs (the normal path here) always work.
              core.warning(`Could not post build-links comment (forked PR or token lacks pull-requests:write?): ${err.message}`);
            }

  # Secrets are unavailable on fork PRs. Record that explicitly and skip only
  # retail legs (test's retail steps, godot-tests-retail); ordinary engine and
  # Godot checks always run.
  retail-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.reference.outputs.available }}
    steps:
      - name: Check reference-data access
        id: reference
        shell: bash
        env:
          HAVE_REFERENCE_ASSETS: ${{ secrets.REFERENCE_ASSETS_TOKEN != '' }}
        run: |
          echo "available=$HAVE_REFERENCE_ASSETS" >> "$GITHUB_OUTPUT"
          if [[ "$HAVE_REFERENCE_ASSETS" != "true" ]]; then
            echo "::notice::Retail compatibility tests skipped: REFERENCE_ASSETS_TOKEN is unavailable."
            echo "Retail compatibility tests skipped: reference-data credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

  godot-tests-retail:
    if: needs.retail-availability.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [build-gdextension-windows, retail-availability]
    env:
      GODOT_VERSION: 4.6.1-stable
      HAVE_REFERENCE_ASSETS: ${{ secrets.REFERENCE_ASSETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      # The retail data the asset gates need (docs/asset-gated-tests.md); the
      # same composite action as the engine test job.
      - name: Mount the reference data
        uses: ./.github/actions/mount-reference-data
        with:
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          enabled: ${{ env.HAVE_REFERENCE_ASSETS }}

      # runner.os, like the package and release jobs: one cache entry serves
      # every job that installs this binary.
      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # This job uses the Windows console binary and matching GDExtension.
      - name: Install Godot (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64_console.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      # The editor binary that runs GUT loads the template_debug flavour only
      # (the editor-enabled variant, through the plain .gdextension row).
      - name: Download GDExtensions (Windows)
        uses: actions/download-artifact@v4
        with:
          name: gdext_windows_template_debug
          path: godot/bin

      - name: Prime Godot import cache
        shell: bash
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/bootstrap_godot.sh
          # The editor importer can still crash on a cold import; a half-baked
          # cache makes the test run fail with confusing "missing resource"
          # errors instead of a clear signal. Retry, and fail loudly if the
          # import never completes (was previously masked by continue-on-error).
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Godot tests
        shell: bash
        run: |
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/test_godot.sh --suite retail

      - name: Upload godot retail test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-retail-reports
          if-no-files-found: warn
          path: build/Testing/

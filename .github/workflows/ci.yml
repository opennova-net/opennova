name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and test
        shell: bash
        run: scripts/build.sh

  package-addon:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_blender
          path: dist/*.zip

  package-importer:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package importer
        shell: pwsh
        run: scripts/package_importer_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennova_importer
          path: dist/onimport.exe

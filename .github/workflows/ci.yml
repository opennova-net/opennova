name: CI

on:
  # Master: its pushes are the runs that save the compiler caches
  # (.github/actions/compiler-cache), which the pull requests then read.
  push:
    branches: [master]
  # Every pull request, whatever its base: a PR stacked on another PR's
  # branch gets the same checks as one targeting master.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a PR, github.head_ref is the source branch, so a new push cancels the older
# run (and prevents two runs racing to post the build-links comment). On push to
# master, head_ref is empty and we fall back to the unique run_id, so master runs
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build and test legs (test-core, test-linux, both gdext builds, the
# Godot package) run on RunsOn's 16-vCPU runners in the
# Organization's ci account (infra/ci; DEPLOY.md, "CI runners"): an EC2 spot
# instance of its own per job, launched for it and ended after it, on RunsOn's
# images: Windows Server 2025 with Visual Studio 2022 (windows-latest and the
# maintainers build with 2026) and Ubuntu 24.04, which leaves Ninja out (the
# Linux legs install it). The
# compiles and the tests are CPU-bound. Every other job, the Godot tests among
# them (one test at a time: more cores buy nothing), runs on GitHub's standard
# runners, windows-latest and ubuntu-latest, free for a public repository. So
# does every job of a pull request from a
# fork: only the organization's own branches start an instance. The legs run
# side by side on runners of their own (the two test shards, a gdext build
# per flavour) and lean on the compiler caches, and each
# build takes as many jobs as its runner has cores (scripts/build.sh's --jobs
# default, nproc, Ninja's own). Their caches live in RunsOn's Magic Cache (the
# label's extras=s3-cache and the runs-on/action step): actions/cache reads and
# writes the ci account's S3 bucket, in the runners' region, instead of
# GitHub's (no transfer out of AWS, no 10 GB cap). A RunsOn job and a GitHub
# runner's never share an entry either way: actions/cache versions an entry by
# its path, and runner.temp differs between the two.
jobs:
  # A pull request that changes only the private docs pointer and markdown
  # builds and tests nothing: no build or test reads those paths, and the lint
  # gates that do read them still run in `gates` (reported through the required
  # `test` check). Every other PR, and every
  # push, runs everything. The two required checks (`test`,
  # `godot-tests`) are jobs of their own that always run and judge their legs
  # against `code`, never skipped matrix jobs: a skipped matrix job reports
  # under its bare name, which would leave the required
  # "<job> (windows-latest)" check pending forever.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
            if [[ -n "$files" ]] && ! grep -qvxE 'docs|.*\.md' <<< "$files"; then
              code=false
              echo "Only the docs pointer and markdown changed: the builds and tests skip." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  # Formatting and per-language lint on the lines a change adds
  # (scripts/lint/format_lint.py: clang-format, ruff, gdlint/gdformat at the
  # pins below). Advisory until the tree's whitespace-only reformat lands: it
  # annotates the diff and never fails, and it is not a required check.
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          # The merge-base with origin/master is the diff base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format lint (advisory)
        shell: bash
        run: |
          python -m pip install --quiet clang-format==21.1.6 ruff==0.16.9 gdtoolkit==4.5.0
          python scripts/lint/format_lint.py --github

  # The repository gates on Windows, off the build legs' critical path: the
  # maturity lints and the switcher's xunit suite, reported through `test`.
  gates:
    runs-on: windows-latest
    needs: [changes]
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: fixture_lint reads fixtures/ only
          # godot_cpp_profile.py reads third_party/godot-cpp's extension_api.json.
          submodules: recursive
          # Full history so the diff-scoped maturity lint can resolve
          # origin/master...HEAD on PR builds (it self-skips without a base).
          fetch-depth: 0

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Maturity-program guards (docs/maturity-program.md, STD-1), enforced
      # since the Wave-2 boundary (STD-3): the ratchet fails on any counter
      # increase vs scripts/lint/maturity_baseline.json; the diff-scoped
      # dict-contract lint fails on new class-level Dictionary contracts
      # (magic numbers stay advisory). The divergence-ledger scoreboard check
      # lives with the ledger in the private docs repo (tools/ledger_check.py).
      # The link-graph check (LIBS-1, ADR 0020) has no configured build tree
      # in this job, so it walks the CMake files transitively; local runs
      # against build/ use `cmake --graphviz` ground truth.
      - name: Maturity gates (STD-1, enforced)
        shell: bash
        run: |
          python scripts/lint/ratchet_counts.py --enforce
          python scripts/lint/maturity_lint.py --enforce
          python scripts/lint/link_graph_check.py --enforce
          python scripts/lint/include_graph_check.py --enforce
          # The godot-cpp build profile (godot/src/godot_cpp_profile.json) is
          # derived from godot/src: a binding that starts using a new engine
          # class must regenerate it (--write) or the extension fails to compile.
          python scripts/lint/godot_cpp_profile.py --enforce
          # Orphan engine headers (the post-merge tidy rounds' recurring
          # finding): a header included only by its test must carry the
          # STAGED, NOT WIRED paragraph or a reasoned allowlist row.
          python scripts/lint/orphan_header_check.py --enforce
          # Witness-address census (ADR 0043): the SET of `@0xADDR` addresses
          # cited under engine/, godot/, apps/ and tests/ never loses a member
          # silently; a structural slice leaves it identical, a deletion is
          # banked with --write-baseline and named in the commit.
          python scripts/lint/cite_census.py --enforce
          # Fixture provenance gate (fixtures/README.md): every fixture is
          # minted by a generator, authored, or a keep-set retail-interop row
          # in scripts/lint/fixture_allowlist.json; LFS-tracked, under 2 MiB,
          # referenced by a test or doc, and materialized in this checkout.
          python scripts/lint/fixture_lint.py --enforce --require-pulled
          # Environment-variable gate (docs/dev-env-vars.md): GODOT_BIN in the
          # scripts, the deployed service's own config and the OS variables;
          # nothing else.
          python scripts/lint/env_lint.py --enforce
          # Vocabulary conventions (CLAUDE.md): no Nova/nova_ prefix (ADR 0040).
          python scripts/lint/conventions_lint.py --enforce
          # No test reads retail data; then the suite runner's own checks
          # (shards, inventory against report) and the workflows' triggers
          # against what their builds are made from (test_workflow_triggers.py).
          python scripts/ci/test_suites.py --check-layout
          python -B -m unittest discover -s scripts/ci -p "test_*.py"
          # The cite image rule cite_census.py and scripts/ida/cite_sweep.py share.
          python -B -m unittest discover -s scripts/lint -p "test_*.py"
          # cite_sweep.py's classifier (the sweep itself needs a live IDA).
          python -B -m unittest discover -s scripts/ida -p "test_*.py"
          # The scripted game launch starts behind every window and never takes
          # the foreground (game_mcp.BehindLaunch; docs/mcp.md "Launching").
          python -B -m unittest discover -s scripts/mcp -p "test_*.py"
          # The parity runner's scenario aim_at arithmetic (retail's look yaw).
          python -B -m unittest discover -s scripts/net -p "test_*.py"
          # Publish's helper (publish.yml): the apps' releases through the admin
          # API, and the downloads host's files for a tag's GitHub release.
          python -B -m unittest discover -s scripts -p test_publish_apps.py

      # The OpenNova Switcher's xunit suite (switcher/, ADR 0054): here, the
      # required `test` check gates it; package-switcher-windows.yml runs it
      # again before it packages the exe.
      - name: Set up .NET (switcher)
        if: env.CODE == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Switcher tests (.NET)
        if: env.CODE == 'true'
        shell: bash
        run: dotnet test switcher/OpenNovaSwitcher.sln -c Release --nologo

  # The C++ engine + ctest suite on Windows as two shards (test-core), two
  # runners at once, each its own build from the same compiler cache, and
  # `test` reporting them under the required check's name.
  #
  # The suite is split by the `editor` ctest label (scripts/ci/
  # test_suites.py SHARDS): `editor` runs tests/editor's rows, `rest` the
  # others, and each attests its own selection (inventory == report). The two
  # selections partition the suite by construction. Each shard builds the full
  # tree, so both compile the same objects and either may save the cache; the
  # editor shard does.
  #
  # Built with Ninja + sccache (.github/actions/compiler-cache): the Visual
  # Studio generator ignores CMAKE_*_COMPILER_LAUNCHER. scripts/build.sh lets
  # CMake read CMAKE_GENERATOR and the launcher variables from the environment
  # on a fresh configure, and Release carries no PDB flags, so every object is
  # cacheable as-is. Linked by lld-link (CMAKE_LINKER_TYPE LLD; the runner
  # image has LLVM on PATH): the ~930 executables are mostly tests over the
  # same static libraries, and link.exe spent ~3 min of every build on them
  # after the last cache hit. Only the link step changes, so the cache's
  # objects serve either linker.
  test-core:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+m7i+m8i/image=windows25-full-x64/volume=150gb/extras=s3-cache', github.run_id) }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's branch save replaces its older entries
    strategy:
      fail-fast: false
      matrix:
        shard: [editor, rest]
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      # RunsOn's Windows image carries Python 3.14 alone; 3.11 would install.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # cl/link on PATH for the Ninja generator (the VS generator found them by
      # itself; vcvars prepends the VC bin dir, and CMake's Ninja compiler search
      # takes the first compiler in PATH order); sccache in front of cl for the
      # compiler-launcher cache.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-root
          mode: restore

      - name: Toolchain sanity (Ninja + cl + lld-link on PATH)
        shell: bash
        run: |
          cmake --version
          ninja --version
          command -v cl
          command -v lld-link

      - name: Build
        shell: bash
        run: scripts/build.sh --no-godot --no-test --cmake-arg -DCMAKE_LINKER_TYPE=LLD

      # The project tool the Godot shells shard's built-project boot test drives
      # (godot/tests/game/built_project_boot_test.gd, ADR 0046 d8), from the one
      # leg that saves the cache; godot-tests-core lays it where the test looks.
      - name: Upload opennova-project
        if: matrix.shard == 'editor'
        uses: actions/upload-artifact@v4
        with:
          name: opennova-project-windows
          if-no-files-found: error
          path: build/apps/project/opennova-project.exe

      # The minted install's writer (tests/editor/mint_install_main.cpp) for editor-e2e, a
      # master push's only.
      - name: Upload mint_install
        if: matrix.shard == 'editor' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: mint-install-windows
          if-no-files-found: error
          path: build/tests/mint_install.exe

      # Right after the build, so the step's numbers are this build's hit rate.
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      # ctest starts the shard's longest rows first (.github/actions/ctest-costs).
      - name: Restore the ctest cost data
        uses: ./.github/actions/ctest-costs
        with:
          leg: core-${{ matrix.shard }}
          mode: restore

      # The build is up to date, so the second call goes straight to the tests.
      - name: Test (${{ matrix.shard }})
        shell: bash
        run: scripts/build.sh --no-godot --shard ${{ matrix.shard }}

      - name: Save the ctest cost data
        if: always()
        uses: ./.github/actions/ctest-costs
        with:
          leg: core-${{ matrix.shard }}
          mode: save

      # build/.ninja_log carries each compile's and link's time.
      - name: Upload native core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-reports-${{ matrix.shard }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/Testing/
            build/.ninja_log

      # The one Windows leg that saves the win-root flavour: the rest shard
      # builds the same objects and only reads it.
      - name: Save the compiler cache
        if: matrix.shard == 'editor'
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-root
          mode: save

  # The required check "test (windows-latest)" (branch protection names it):
  # green when the gates passed and both test shards passed (a matrix job's
  # result is success only when every leg is) or were skipped for a docs-only
  # change (no instance starts for one). It runs when a leg fails too, so a
  # failure reports red, never skipped.
  test:
    name: test (windows-latest)
    if: ${{ !cancelled() }}
    needs: [changes, gates, test-core]
    runs-on: ubuntu-latest
    steps:
      - name: The Windows legs
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          GATES: ${{ needs.gates.result }}
          CORE: ${{ needs.test-core.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "gates: ${GATES}; test-core: ${CORE}"
          if [[ "$CHANGES" != success ]]; then
            echo "::error::a gate job did not pass (changes: ${CHANGES})"
            exit 1
          fi
          if [[ "$GATES" != success ]]; then
            echo "::error::gates: ${GATES}"
            exit 1
          fi
          want=skipped
          if [[ "$CODE" == true ]]; then want=success; fi
          if [[ "$CORE" != "$want" ]]; then
            echo "::error::test-core: ${CORE} (expected ${want})"
            exit 1
          fi

  # The same build on Linux, configured with the NovaWorld service and its
  # HTTP layer ON (the deploy target's flag set: the service target, the
  # server app and their tests, which the Windows jobs leave out; the Crow
  # sources join the server target and change no other object), so this job
  # also covers the net leg .github/workflows/net-linux.yml runs for the
  # NovaWorld images workflow. The two share the linux-root compiler cache.
  # The service's database tests make a database per case on the PostgreSQL
  # service container below (OPENNOVA_TEST_PG), and the HTTP layer's tests keep
  # their keys on the Valkey one (OPENNOVA_TEST_REDIS); without them they skip,
  # which the suite fails.
  test-linux:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's branch save replaces its older entries
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The HTTP layer's shared web state (OPENNOVA_TEST_REDIS): each test keeps
      # its keys under a prefix of its own.
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      # The root CMake project builds without godot-cpp or GUT, so the
      # submodules stay uninitialized.
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only

      # The service's client libraries: libpq (CMake's FindPostgreSQL) and, for
      # the server's HTTP layer, hiredis with hiredis_ssl and OpenSSL; and Ninja,
      # which RunsOn's ubuntu24-full image leaves out (ubuntu-latest has it).
      - name: Install libpq, hiredis and Ninja
        shell: bash
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpq-dev libhiredis-dev libssl-dev ninja-build

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: restore

      # ctest starts the suite's longest rows first (.github/actions/ctest-costs).
      - name: Restore the ctest cost data
        uses: ./.github/actions/ctest-costs
        with:
          leg: linux-core
          mode: restore

      - name: Build and test
        shell: bash
        # billing_stripe_e2e's Stripe test-mode key (infra/github, secrets.tf). A
        # fork's pull request gets none, and the vault's REPLACE_ME counts as none:
        # the test skips.
        env:
          ONNET_STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: >-
          scripts/build.sh --no-godot
          --cmake-arg -DOPENNOVA_NOVAWORLD_SERVICE=ON --cmake-arg -DBUILD_NOVAWORLD_HTTP=ON
          --cmake-arg -DOPENNOVA_TEST_PG=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          --cmake-arg -DOPENNOVA_TEST_REDIS=redis://127.0.0.1:6379

      # The project tool the Linux GUT run's built-project boot test drives
      # (godot/tests/game/built_project_boot_test.gd, ADR 0046 d8), whatever the
      # native tests did; godot-tests-linux lays it where the test looks.
      - name: Upload opennova-project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opennova-project-linux
          if-no-files-found: warn
          path: build/apps/project/opennova-project

      - name: Save the ctest cost data
        if: always()
        uses: ./.github/actions/ctest-costs
        with:
          leg: linux-core
          mode: save

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-root
          mode: save

      - name: Upload Linux native core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-linux-reports
          if-no-files-found: warn
          path: build/Testing/

  # Match the Windows flavours: PRs exercise the editor/debug extension;
  # pushes (master) and manual runs also compile the release
  # extension. Both Linux flavours build as CMake Release (no debug info,
  # stripped): the template_debug .so only feeds godot-tests-linux, and
  # RelWithDebInfo made it a 674 MiB artifact and a compiler cache several
  # times this size.
  build-gdextension-linux:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+c8a+m7i+m7a/image=ubuntu24-full-x64/volume=100gb/extras=s3-cache', github.run_id) }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's branch save replaces its older entries
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["template_debug"]') || fromJSON('["template_debug","template_release"]') }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      # RunsOn's ubuntu24-full image leaves Ninja out (ubuntu-latest has it).
      - name: Install Ninja
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-gdext-${{ matrix.target }}
          mode: restore

      - name: Build Linux GDExtension (${{ matrix.target }})
        env:
          GODOTCPP_TARGET: ${{ matrix.target }}
        run: |
          case "$GODOTCPP_TARGET" in
            template_debug) build_dir=build-godot-debug ;;
            template_release) build_dir=build-godot-release ;;
            *) echo "unknown GODOTCPP_TARGET: $GODOTCPP_TARGET" >&2; exit 2 ;;
          esac
          cmake -S godot/src -B "$build_dir" -G Ninja \
            -DGODOTCPP_TARGET="$GODOTCPP_TARGET" -DCMAKE_BUILD_TYPE=Release
          # Both variants, as on Windows (ADR 0046 d2): a source run such as GUT
          # loads the editor-enabled library through the plain .gdextension row.
          cmake --build "$build_dir" --target opennova opennova_editor_gdext --parallel "$(nproc)"
          test -f "godot/bin/libopennova.linux.$GODOTCPP_TARGET.x86_64.so"
          test -f "godot/bin/libopennova_editor.linux.$GODOTCPP_TARGET.x86_64.so"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: linux-gdext-${{ matrix.target }}
          mode: save

      - name: Upload Linux GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gdext_linux_${{ matrix.target }}
          if-no-files-found: error
          path: |
            godot/bin/libopennova.linux.${{ matrix.target }}.x86_64.so
            godot/bin/libopennova_editor.linux.${{ matrix.target }}.x86_64.so

  godot-tests-linux:
    runs-on: ubuntu-latest
    # Skipped with the extension build on docs-only PRs; test-linux for its
    # opennova-project build, run whatever the native tests did.
    needs: [build-gdextension-linux, test-linux]
    if: ${{ !cancelled() && needs.build-gdextension-linux.result == 'success' }}
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        run: |
          bin=".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$bin" ]]; then
            mkdir -p .godot-bin
            curl -fsSL --retry 3 -o .godot-bin/godot-linux.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot-linux.zip -d .godot-bin
          fi
          chmod +x "$bin"

      # The template_debug flavour; GUT loads the editor-enabled variant through
      # the plain .gdextension row.
      - name: Download Linux GDExtensions
        uses: actions/download-artifact@v4
        with:
          name: gdext_linux_template_debug
          path: godot/bin

      # Where built_project_boot_test.gd looks for the project tool (an artifact
      # keeps no mode bits). A test-linux build that failed uploaded none, and the
      # test then stays pending.
      - name: Download opennova-project (Linux)
        id: project_tool
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: opennova-project-linux
          path: build/apps/project

      - name: Make opennova-project executable
        if: steps.project_tool.outcome == 'success'
        run: chmod +x build/apps/project/opennova-project

      - name: Prime Godot import cache
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          bash scripts/bootstrap_godot.sh
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Linux Godot tests
        run: |
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          bash scripts/test_godot.sh

      - name: Upload Linux Godot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-core-linux-reports
          if-no-files-found: warn
          path: build/Testing/

  # The suite's graphics scripts (godot/tests/windowed/: every test that needs a
  # RenderingDevice, which no headless run has) on a software GPU: Mesa's
  # lavapipe Vulkan driver on an Xvfb display, Forward+ as a windowed run draws
  # (scripts/test_godot.sh --windowed, where a pending test fails). Gated with
  # the Windows shards (godot-tests below); skipped with the extension build on
  # a docs-only PR.
  godot-tests-windowed:
    runs-on: ubuntu-latest
    needs: [build-gdextension-linux]
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        run: |
          bin=".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [[ ! -f "$bin" ]]; then
            mkdir -p .godot-bin
            curl -fsSL --retry 3 -o .godot-bin/godot-linux.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot-linux.zip -d .godot-bin
          fi
          chmod +x "$bin"

      # The software GPU: lavapipe (mesa-vulkan-drivers) behind the Vulkan
      # loader, an X server with no screen for Godot's window, and a window
      # manager over it (openbox; xprop to see it up).
      - name: Install lavapipe, Xvfb and openbox
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb openbox x11-utils

      - name: Download Linux GDExtensions
        uses: actions/download-artifact@v4
        with:
          name: gdext_linux_template_debug
          path: godot/bin

      - name: Prime Godot import cache
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          bash scripts/bootstrap_godot.sh
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      # The loader takes lavapipe alone, its manifest found by the package's own file list (the
      # name changes with the Mesa release: lvp_icd.x86_64.json in older ones).
      - name: Run the windowed Godot tests (lavapipe)
        run: |
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$' | head -n 1)
          if [[ -z "$icd" ]]; then
            echo "::error::mesa-vulkan-drivers installed no lavapipe ICD manifest"
            dpkg -L mesa-vulkan-drivers | grep -i 'icd' || true
            exit 1
          fi
          echo "lavapipe ICD: ${icd}"
          export VK_ICD_FILENAMES="$icd"
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          vulkaninfo --summary
          # Under a window manager: a window minimizes and comes back only through one
          # (editor_screenshot_minimized_test.gd); Xvfb alone leaves it as it is.
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            openbox --sm-disable &
            for _ in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id" && break
              sleep 0.2
            done
            xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id" ||
              { echo "::error::openbox did not start"; exit 1; }
            bash scripts/test_godot.sh --windowed'

      - name: Upload windowed Godot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-windowed-reports
          if-no-files-found: warn
          path: build/Testing/

  # The OpenNova Editor end to end (scripts/mcp/editor_mission_e2e.py and editor_terrain_e2e.py: a
  # project made on an install, a mission imported, edited, built and played through the editor's and
  # the game's MCP endpoints) over the synthetic install tests/editor/minted_install.h mints, since no
  # repository holds a game (ADR 0067). Master pushes only (the maintainer's decision, lane G Q11),
  # not a required check. The mission it plays is E2E_MISSION; until the minted install holds it the
  # job says so and runs nothing, as a warning.
  editor-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    needs: [build-gdextension-windows, test-core]
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.6.1-stable
      E2E_MISSION: onjo_e2e.bms
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the minted install reads fixtures/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64_console.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      # The editor binary loads the editor-enabled template_debug variant (oneditord.dll), and its
      # Play the runtime one, both from this artifact.
      - name: Download GDExtensions (Windows)
        uses: actions/download-artifact@v4
        with:
          name: gdext_windows_template_debug
          path: godot/bin

      - name: Download mint_install
        uses: actions/download-artifact@v4
        with:
          name: mint-install-windows
          path: build/tests

      - name: Prime Godot import cache
        shell: bash
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/bootstrap_godot.sh
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      # From the repository: the writer reads fixtures/ there.
      - name: Mint the install
        id: mint
        shell: bash
        run: |
          install="${RUNNER_TEMP}/minted-install"
          # The console's CRLF lines read as the mission names they print.
          build/tests/mint_install.exe "$install" | tr -d '\r' | tee "${RUNNER_TEMP}/minted-missions.txt"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          if grep -qx "mission ${E2E_MISSION}" "${RUNNER_TEMP}/minted-missions.txt"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::editor-e2e skipped: the minted install holds no ${E2E_MISSION} yet (tests/editor/minted_install.h; its missions are listed above)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The mission editor end to end
        if: steps.mint.outputs.ready == 'true'
        shell: bash
        run: >-
          python -B scripts/mcp/editor_mission_e2e.py --install "${{ steps.mint.outputs.install }}"
          --mission "$E2E_MISSION" --godot "${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"

      - name: The terrain editor end to end
        if: steps.mint.outputs.ready == 'true'
        shell: bash
        run: >-
          python -B scripts/mcp/editor_terrain_e2e.py --install "${{ steps.mint.outputs.install }}"
          --mission "$E2E_MISSION" --godot "${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"

  # Type-check + build the NovaWorld web portal (web/), after its unit tests
  # (vitest, `npm test`). The built dist is an artifact only; production images
  # bake it via web/Dockerfile (Track B).
  web:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, type-check and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          if-no-files-found: error
          path: web/dist

  # Compile the GDExtension (godot/src + engine/ + the pinned third_party/godot-cpp)
  # once per flavour; godot-tests and the Windows package job download the
  # DLLs instead of recompiling. Flavours are godot-cpp targets and name the DLL:
  #   template_debug   -> what the Godot EDITOR loads (godot-tests, and the export
  #                       step's script scan) and what a --export-debug exe loads.
  #   template_release -> what a --export-release exe loads (the release zip).
  # A pull request builds only template_debug and packages in debug export mode
  # (~4.7 min per flavour on a warm cache, mostly MSVC preprocessing on sccache
  # hits — halving the legs halves the wall-clock in front of godot-tests and the
  # PR build links). Pushes (master) and manual runs also build
  # template_release, in parallel, so the release flavour and release-mode
  # packaging stay continuously verified. sccache caches godot-cpp's objects across runs, so
  # after one warm-up only changed engine/ sources recompile. Windows must
  # use Ninja: the Visual Studio generator ignores CMAKE_*_COMPILER_LAUNCHER.
  build-gdextension-windows:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+m7i+m8i/image=windows25-full-x64/volume=150gb/extras=s3-cache', github.run_id) }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # the compiler cache's branch save replaces its older entries
    strategy:
      fail-fast: false
      matrix:
        # Per-key fromJSON is the documented matrix form. The target -> CMake
        # config mapping lives in the build step, NOT in matrix.include: an
        # include entry whose target is absent from this list would be added as
        # an extra combination and resurrect the release leg on PRs.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["template_debug"]') || fromJSON('["template_debug","template_release"]') }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # the build consumes no LFS game assets

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-gdext-${{ matrix.target }}
          mode: restore

      - name: Build GDExtension (${{ matrix.target }})
        shell: pwsh
        env:
          GODOTCPP_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          # First-run toolchain sanity: CMake must be >= 3.25 for the /Z7 flag, and
          # Ninja + cl must be on PATH (the latter via msvc-dev-cmd).
          cmake --version
          ninja --version
          Write-Host "cl: $((Get-Command cl -ErrorAction SilentlyContinue).Source)"
          # template_debug is built RelWithDebInfo: optimized native code plus
          # symbols, the same flavour scripts/build_godot.sh Dev produces for the
          # editor. template_release is a plain Release. The build dirs keep their
          # names on purpose: sccache keys embed the absolute paths of godot-cpp's
          # generated headers under the build dir, so renaming a dir invalidates
          # every cached godot-cpp object (one cold ~28 min leg).
          $flavours = @{
            template_debug   = @{ config = "RelWithDebInfo"; dir = "build-godot-debug" }
            template_release = @{ config = "Release"; dir = "build-godot-release" }
          }
          $flavour = $flavours[$env:GODOTCPP_TARGET]
          if (-not $flavour) { throw "unknown GODOTCPP_TARGET: $env:GODOTCPP_TARGET" }
          $buildType = $flavour.config
          $buildDir = $flavour.dir
          # -G Ninja so the sccache compiler launcher is honored. /Z7 (embedded
          # debug info via CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) makes the
          # RelWithDebInfo objects cacheable; the default /Zi separate-PDB is not.
          # CMP0141=NEW forces that policy into godot-cpp (its CMake policy ceiling
          # is < 3.25).
          cmake -S godot/src -B $buildDir -G Ninja `
            "-DGODOTCPP_TARGET=$env:GODOTCPP_TARGET" `
            "-DGODOTCPP_USE_STATIC_CPP=ON" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DCMAKE_BUILD_TYPE=$buildType" `
            "-DCMAKE_POLICY_DEFAULT_CMP0141=NEW" `
            "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          if ($LASTEXITCODE -ne 0) { throw "configure $env:GODOTCPP_TARGET failed" }
          # Both variants of the flavour from the one configure (ADR 0046 d2): the
          # runtime-only libopennova.* and the editor-enabled libopennova_editor.*.
          cmake --build $buildDir --target opennova opennova_editor_gdext
          if ($LASTEXITCODE -ne 0) { throw "build $env:GODOTCPP_TARGET failed" }
          $suffix = if ($env:GODOTCPP_TARGET -eq "template_debug") { "d" } else { "" }
          foreach ($dll in @("godot/bin/opennova$suffix.dll", "godot/bin/oneditor$suffix.dll")) {
            if (-not (Test-Path $dll)) { throw "missing GDExtension DLL: $dll" }
          }

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Save the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-gdext-${{ matrix.target }}
          mode: save

      - name: Upload Windows GDExtensions
        uses: actions/upload-artifact@v4
        with:
          name: gdext_windows_${{ matrix.target }}
          if-no-files-found: error
          path: |
            godot/bin/opennova${{ matrix.target == 'template_debug' && 'd' || '' }}.dll
            godot/bin/oneditor${{ matrix.target == 'template_debug' && 'd' || '' }}.dll

      # The debug DLLs' symbols, apart so no test job downloads them: a sampling profile of a
      # live run off a PR's DLL resolves our frames with them.
      - name: Upload Windows GDExtension symbols
        if: matrix.target == 'template_debug'
        uses: actions/upload-artifact@v4
        with:
          name: gdext_windows_template_debug_pdb
          if-no-files-found: warn
          retention-days: 7
          path: |
            godot/bin/opennovad.pdb
            godot/bin/oneditord.pdb

  # The Godot suite on Windows as two shards, each on a runner of its own
  # (scripts/ci/test_suites.py GODOT_SHARDS: `shells` the scripts under
  # tests/authoring, game, mcp and probes, `world` the others), each attesting
  # its own selection; one GUT process ran them back to back (~7 min of
  # scripts, the run's longest leg). GitHub's standard runners, free for a
  # public repository: GUT runs one test at a time. `godot-tests` reports them
  # under the required check's name. Skipped with the extension build on a
  # docs-only PR.
  godot-tests-core:
    strategy:
      fail-fast: false
      matrix:
        shard: [shells, world]
    runs-on: windows-latest
    # test-core for its opennova-project build: the shards run when the extension
    # built, whatever the native tests did (their failure is test-core's to report).
    needs: [build-gdextension-windows, test-core]
    if: ${{ !cancelled() && needs.build-gdextension-windows.result == 'success' }}
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**"

      # runner.os, like the package and release jobs: one cache entry serves
      # every job that installs this binary.
      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # This job uses the Windows console binary and matching GDExtension.
      - name: Install Godot (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64_console.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      # The editor binary that runs GUT loads the template_debug flavour only
      # (the editor-enabled variant, through the plain .gdextension row).
      - name: Download GDExtensions (Windows)
        uses: actions/download-artifact@v4
        with:
          name: gdext_windows_template_debug
          path: godot/bin

      # Where built_project_boot_test.gd looks for the project tool. A test-core
      # build that failed uploaded none, and the test then stays pending.
      - name: Download opennova-project (Windows)
        if: matrix.shard == 'shells'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: opennova-project-windows
          path: build/apps/project

      - name: Prime Godot import cache
        shell: bash
        run: |
          GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/bootstrap_godot.sh
          # The editor importer can still crash on a cold import; a half-baked
          # cache makes the test run fail with confusing "missing resource"
          # errors instead of a clear signal. Retry, and fail loudly if the
          # import never completes (was previously masked by continue-on-error).
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Godot tests (${{ matrix.shard }})
        shell: bash
        run: |
          export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          bash scripts/test_godot.sh --shard ${{ matrix.shard }}

      - name: Upload godot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-core-reports-${{ matrix.shard }}
          if-no-files-found: warn
          path: build/Testing/

  # The required check "godot-tests (windows-latest)" (branch protection names
  # it): green when both Windows shards and the windowed scripts' software-GPU
  # run (godot-tests-windowed) passed, or were skipped because there was
  # nothing for them to run (a docs-only change). It runs when a leg or an
  # extension build fails too, so a failure reports red, never skipped.
  godot-tests:
    name: godot-tests (windows-latest)
    if: ${{ !cancelled() }}
    needs: [changes, godot-tests-core, godot-tests-windowed]
    runs-on: ubuntu-latest
    steps:
      - name: The Windows Godot shards and the windowed scripts
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.godot-tests-core.result }}
          WINDOWED: ${{ needs.godot-tests-windowed.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "godot-tests-core: ${CORE}"
          echo "godot-tests-windowed: ${WINDOWED}"
          if [[ "$CHANGES" != success ]]; then
            echo "::error::a gate job did not pass (changes: ${CHANGES})"
            exit 1
          fi
          want=skipped
          if [[ "$CODE" == true ]]; then want=success; fi
          if [[ "$CORE" != "$want" ]]; then
            echo "::error::godot-tests-core: ${CORE} (expected ${want})"
            exit 1
          fi
          if [[ "$WINDOWED" != "$want" ]]; then
            echo "::error::godot-tests-windowed: ${WINDOWED} (expected ${want})"
            exit 1
          fi

  # The runtime's and the editor's plain builds (ADR 0072): the runtime zip
  # (opennova.exe and the updater pair) and the editor zip (oneditor.exe and the
  # onplay.exe it plays a project with, one flat folder), neither with a wizard or
  # a command file. The update service packs both; the game zips are rendered from
  # its published runtime on the deployment's downloads host.
  package-godot-windows:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || format('runs-on={0}/cpu=16/family=c7i+c7a+c8i+m7i+m8i/image=windows25-full-x64/volume=150gb/extras=s3-cache', github.run_id) }}
    needs: [build-gdextension-windows]
    permissions:
      contents: read
    outputs:
      runtime_artifact_url: ${{ steps.upload_runtime.outputs.artifact-url }}
      editor_artifact_url: ${{ steps.upload_editor.outputs.artifact-url }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      # Magic Cache: this job's actions/cache calls go to the ci account's S3
      # bucket (a no-op on GitHub's runners, a fork's).
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          lfs: false   # the minimal package reads no game content
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # The x86_64 Windows templates only (the export preset's target), not the
      # whole 1.2 GB set: package_godot_windows.ps1 skips its download
      # whenever version.txt is present.
      - name: Restore Godot export templates
        id: templates-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/version.txt
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/icudt_godot.dat
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/windows_*_x86_64*
          key: godot-export-templates-windows-${{ env.GODOT_VERSION }}

      # Every flavour this run built (template_debug only on a PR).
      - name: Download GDExtension
        uses: actions/download-artifact@v4
        with:
          pattern: gdext_windows_*
          merge-multiple: true
          path: godot/bin

      # Build the updater executables and the update tool (the smoke packages) with the root cache.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          flavour: win-root
          mode: restore

      # PRs export in debug mode (debug export template + the template_debug DLL,
      # the development flavour); pushes and manual runs export in
      # release mode like the release workflow.
      - name: Package Godot Windows apps
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
        # -BuildCommit: the commit the main menu names (D-MNU-76), a pull request's head as the downloads
        # page names it.
        run: >-
          scripts/package_godot_windows.ps1 -SkipBuild
          -ExportMode ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          -BuildCommit ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Save Godot export templates
        if: github.ref == 'refs/heads/master' && steps.templates-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/version.txt
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/icudt_godot.dat
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION_PLAIN }}.stable/windows_*_x86_64*
          key: godot-export-templates-windows-${{ env.GODOT_VERSION }}

      # The five builds Publish takes from a run (publish.yml): these two and the
      # Blender add-on's, the tools' and the switcher's (their own workflows).
      - name: Upload the runtime's plain build
        id: upload_runtime
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-runtime-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload the editor's plain build
        id: upload_editor
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-editor-windows-v*.zip
          archive: false
          if-no-files-found: error

  # The same installable Blender package is built for PRs and tagged releases.
  package-blender-windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/package-blender-windows.yml

  # The tools, the native apps (opennova-3di, opennova-extract, opennova-lan-probe,
  # opennova-parity, opennova-serve, opennova-update-tool and opennova-wire)
  # in one zip, opennova-tools-windows.zip, built for PRs and tagged releases alike.
  # The NovaWorld server is Linux-only (its container image).
  package-apps-windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write   # its compiler cache's branch save replaces older entries
    uses: ./.github/workflows/package-apps-windows.yml

  # The OpenNova Switcher (switcher/, .NET, ADR 0054): its xunit suite and the
  # single-file opennova-switcher.exe in one zip, built for PRs and tagged
  # releases alike.
  package-switcher-windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/package-switcher-windows.yml

  # Every same-repo pull request's run publishes its five builds to staging once
  # the package jobs (and their boot smokes) pass, not the whole suite, so a flaky
  # test never holds a build back (ADR 0072): Publish (publish.yml) has staging's
  # service pack the runtime and the editor and publish all five, its downloads
  # host then offers them (the game zips rendered from the runtime), and an
  # installed editor or game updates in place. The newest run wins: one publish at
  # a time, never cancelled once begun. A fork's run has no secrets and is
  # skipped. Not a required check: until staging runs this branch's service, an
  # app's build is refused there. The called job asks for no more than this
  # grant (a called job never gets more than its caller's).
  publish-staging:
    needs: [package-godot-windows, package-blender-windows, package-apps-windows, package-switcher-windows]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: publish-staging
      cancel-in-progress: false
    permissions:
      contents: write   # Publish's prod run attaches the release's zips; staging's writes nothing
      actions: read     # this run's artifacts
    uses: ./.github/workflows/publish.yml
    with:
      deployment: staging
      run_id: ${{ github.run_id }}
    secrets: inherit

  # Surface the Windows packages on the PR as a single comment that updates
  # in place after every package succeeds. A failed package leaves the previous
  # comment untouched.
  pr-build-links:
    runs-on: ubuntu-latest
    needs: [package-godot-windows, package-blender-windows, package-apps-windows, package-switcher-windows]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the build-links comment
        uses: actions/github-script@v7
        env:
          RUNTIME_URL: ${{ needs.package-godot-windows.outputs.runtime_artifact_url }}
          EDITOR_URL: ${{ needs.package-godot-windows.outputs.editor_artifact_url }}
          BLENDER_URL: ${{ needs.package-blender-windows.outputs.artifact_url }}
          TOOLS_URL: ${{ needs.package-apps-windows.outputs.artifact_url }}
          SWITCHER_URL: ${{ needs.package-switcher-windows.outputs.artifact_url }}
        with:
          script: |
            // A hidden marker lets us find our own comment across runs, so there
            // is only ever one: find it -> update; absent -> create.
            const marker = '<!-- opennova-ci-build-links -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = (context.payload.pull_request.head.sha || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### OpenNova CI builds',
              '',
              `Windows builds for this PR (commit \`${sha}\`, run [#${context.runNumber}](${runUrl})). The runtime and the editor use the debug export template and template_debug GDExtension, and talk to OpenNova's staging service alone: its NovaWorld menu's OpenNova choice dials nw.staging.opennova.net. The Blender add-on, the tools and the switcher are Release builds. This run publishes all five to staging once they pass (the publish-staging job; a fork's PR is skipped): staging's downloads host, downloads.staging.opennova.net, then offers the installable zips (each game's zip is this runtime with its game's wizards, updating from update.staging.opennova.net), and an installed editor or game updates in place. The runtime and editor zips below are the plain builds the service packs, with no wizard. Tagged releases publish every build to prod, with the runtime and the editor in release mode.`,
              '',
              '| Build | Download |',
              '| --- | --- |',
              `| Runtime: opennova.exe, update.exe and revupdat.exe, the plain build the service packs as ONRUNTIME (the game zips on staging's downloads host are this runtime with each game's wizards) | [opennova-runtime-windows.zip](${process.env.RUNTIME_URL}) |`,
              `| Editor: oneditor.exe and onplay.exe, the runtime it plays a project with, in one folder with the updater pair (experimental) | [opennova-editor-windows.zip](${process.env.EDITOR_URL}) |`,
              `| Blender 5.0+ add-on for Windows: import/export .3di models and their .adm/.bad animations; install the zip from disk | [opennova-blender-addon-windows.zip](${process.env.BLENDER_URL}) |`,
              `| Tools: opennova-3di, opennova-extract, opennova-lan-probe, opennova-parity, opennova-serve (the headless game server), opennova-update-tool and opennova-wire | [opennova-tools-windows.zip](${process.env.TOOLS_URL}) |`,
              `| Switcher: opennova-switcher.exe, a tray app that points the original dfx2.exe at OpenNova's NovaWorld through the hosts file; run it as administrator | [opennova-switcher-windows.zip](${process.env.SWITCHER_URL}) |`,
              '',
              'Downloading requires a GitHub login. Artifacts are removed after 90 days. This comment updates on each successful build.',
            ].join('\n');
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // Forked-PR tokens are read-only and cannot comment; warn instead of
              // failing CI. Same-repo branch PRs (the normal path here) always work.
              core.warning(`Could not post build-links comment (forked PR or token lacks pull-requests:write?): ${err.message}`);
            }

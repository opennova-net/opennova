name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run tests
        shell: bash
        run: scripts/run_tests.sh

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Package addon
        run: scripts/package_addon.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novalogic_importer
          path: dist/*.zip

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# On a PR, github.head_ref is the source branch, so a new push cancels the older
# run (and prevents two runs racing to post the build-links comment). On push to
# master, head_ref is empty and we fall back to the unique run_id, so master runs
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The C++ engine + ctest suite. Built with Ninja + sccache (GitHub Actions
  # cache backend): the Visual Studio generator ignores CMAKE_*_COMPILER_LAUNCHER,
  # so the ~640-TU engine compile used to run uncached (~16 min) on every push.
  # scripts/build.sh lets CMake read CMAKE_GENERATOR and the launcher
  # variables from the environment on a fresh configure — and Release carries no
  # PDB flags, so every object is cacheable as-is. First run after a cache miss
  # is cold; after that only changed sources recompile.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      HAVE_REFERENCE_ASSETS: ${{ secrets.REFERENCE_ASSETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ and assets/ only
          submodules: recursive
          # Full history so the diff-scoped maturity lint can resolve
          # origin/master...HEAD on PR builds (it self-skips without a base).
          fetch-depth: 0

      - name: Pull Git LFS assets (fixtures/ and assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**,assets/**"

      # The extracted retail asset tree lives in the private
      # opennova-net/opennova-reference-assets repository (its README). With the
      # REFERENCE_ASSETS_TOKEN secret (a fine-grained token with contents: read on
      # that repository) the checkout below lands beside the tree and the
      # asset-gated tests run against it instead of reporting Skipped
      # (docs/asset-gated-tests.md); without the secret the gates stay closed.
      - name: Check out the reference assets
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        uses: actions/checkout@v4
        with:
          repository: opennova-net/opennova-reference-assets
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          path: .reference-assets

      # The packed retail install (opennova-net/opennova-reference-retail-packed:
      # the .pff set + expansion/revx02, 3.7 GB committed as 95 MiB parts) feeds
      # OPENNOVA_JO_DIR. It is restored from the Actions cache keyed by that
      # repository's commit; only a new commit there pays the clone + reassembly.
      - name: Resolve the packed retail install's revision
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        id: packed-rev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
        run: |
          sha="$(gh api repos/opennova-net/opennova-reference-retail-packed/commits/main --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Restore the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        id: packed-cache
        uses: actions/cache@v4
        with:
          path: .reference-retail-packed
          key: retail-packed-${{ steps.packed-rev.outputs.sha }}

      - name: Check out the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true' && steps.packed-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: opennova-net/opennova-reference-retail-packed
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          path: .reference-retail-packed

      - name: Reassemble the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true' && steps.packed-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash .reference-retail-packed/reassemble.sh
          rm -rf .reference-retail-packed/.git

      - name: Point the asset gates at the reference data
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        shell: bash
        run: |
          echo "OPENNOVA_JO_ASSETS=${GITHUB_WORKSPACE}/.reference-assets" >> "$GITHUB_ENV"
          echo "OPENNOVA_MISSION_CORPUS=${GITHUB_WORKSPACE}/.reference-assets" >> "$GITHUB_ENV"
          echo "OPENNOVA_JO_DIR=${GITHUB_WORKSPACE}/.reference-retail-packed" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Maturity-program guards (docs/maturity-program.md, STD-1), enforced
      # since the Wave-2 boundary (STD-3): the ratchet fails on any counter
      # increase vs scripts/lint/maturity_baseline.json; the diff-scoped
      # dict-contract lint fails on new class-level Dictionary contracts
      # (magic numbers stay advisory); the ledger check fails if the
      # divergence scoreboard drifts from its tables (--write regenerates).
      # The link-graph check (LIBS-1, ADR 0020) has no configured build tree
      # at this point in the job, so it walks the CMake files transitively;
      # local runs against build/ use `cmake --graphviz` ground truth.
      - name: Maturity gates (STD-1, enforced)
        shell: bash
        run: |
          python scripts/lint/ratchet_counts.py --enforce
          python scripts/lint/maturity_lint.py --enforce
          python scripts/lint/link_graph_check.py --enforce
          python scripts/lint/include_graph_check.py --enforce
          # Orphan engine headers (the post-merge tidy rounds' recurring
          # finding): a header included only by its test must carry the
          # STAGED, NOT WIRED paragraph or a reasoned allowlist row.
          python scripts/lint/orphan_header_check.py --enforce
          python scripts/lint/ledger_check.py --check
          # Host-terminology gate (CONTEXT.md Host / Joiner): "host" means
          # the game/server host and nothing else. Any uncovered use fails;
          # the KEEP taxonomy lives in scripts/lint/host_allowlist.json.
          python scripts/lint/host_lint.py --enforce
          # Fixture provenance gate (fixtures/README.md): every fixture is
          # minted by a generator, authored, or a keep-set retail-interop row
          # in scripts/lint/fixture_allowlist.json; LFS-tracked, under 2 MiB,
          # referenced by a test or doc, and materialized in this checkout.
          python scripts/lint/fixture_lint.py --enforce --require-pulled
          # Environment-variable gate (docs/dev-env-vars.md): the four machine
          # roots through their resolvers, GODOT_BIN in the scripts, the
          # deployed service's own config and the OS variables; nothing else.
          python scripts/lint/env_lint.py --enforce

      # cl/link on PATH for the Ninja generator (the VS generator found them by
      # itself; vcvars prepends the VC bin dir, and CMake's Ninja compiler search
      # takes the first compiler in PATH order); sccache in front of cl for the
      # compiler-launcher cache.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Toolchain sanity (Ninja + cl on PATH)
        shell: bash
        run: |
          cmake --version
          ninja --version
          command -v cl

      - name: Build and test
        shell: bash
        run: scripts/build.sh --no-godot

      # A green ctest run never proves the asset-gated tests saw their data
      # (a gate reports Skipped or SKIP-LEG). With the reference data mounted,
      # every test the three roots gate must have run.
      - name: Asset-gated tests ran
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        shell: bash
        run: |
          python scripts/ci/retail_gates_ran.py --junit build/Testing/ctest.xml \
            --roots jo_dir,jo_assets,mission_corpus

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  # Linux build of the standalone novaworld server with the Crow HTTP layer ON,
  # plus the net-scoped ctests. This mirrors what the deploy image builds; the
  # Windows `test` job compiles the same net libs and runs the same tests
  # with BUILD_NOVAWORLD_HTTP=OFF (no Crow/asio FetchContent on the hot legs).
  # Target-scoped build: the wider lib corpus is Windows-covered and this repo
  # has no other Linux leg yet.
  novaworld-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # net stack consumes no LFS game assets (net fixtures pulled below)

      # nw_self_capture_test compares against the committed opennova-produced
      # self-capture pcap, which is LFS-tracked (fixtures/** in .gitattributes).
      # Pull only this subtree to keep checkout fast.
      - name: Materialize net parity fixtures (LFS)
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/novaworld/**"

      - name: Install libcurl (server links it when HTTP is ON)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure (BUILD_NOVAWORLD_HTTP=ON)
        run: cmake -S . -B build-server -DCMAKE_BUILD_TYPE=Release -DBUILD_NOVAWORLD_HTTP=ON

      - name: Build server + net tests
        run: |
          cmake --build build-server -j "$(nproc)" --target opennova_novaworld_server \
            url_cipher_test crc32_test nwu_test pubcrypto_test epask_test \
            envelope_test tlv_test session_test \
            registration_url_test gate_response_test gate_probe_test lobby_update_test \
            gate_server_loopback_test gsb_roundtrip_test protocol_message_test \
            connection_registry_test connection_manager_test \
            db_sqlite_test session_hello_roundtrip_test lobby_session_test \
            backend_schema_test nw_codec_identity_test nw_self_capture_test

      - name: Run net ctests
        run: |
          ctest --test-dir build-server --output-on-failure --parallel "$(nproc)" -R \
            "^(url_cipher|crc32|nwu|pubcrypto|epask|envelope|tlv|session|registration_url|gate_response|gate_probe|lobby_update|gate_server_loopback|gsb_roundtrip|protocol_message|connection_registry|connection_manager|db_sqlite|session_hello_roundtrip|lobby_session|backend_schema|nw_codec_identity|nw_self_capture)$"

  # Type-check + build the NovaWorld web portal (web/). The built dist is an
  # artifact only; production images bake it via web/Dockerfile (Track B).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          if-no-files-found: error
          path: web/dist

  # Compile the GDExtension (godot/src + engine/ + the pinned third_party/godot-cpp)
  # once per flavour; godot-tests and the two Windows package jobs download the
  # DLLs instead of recompiling. Flavours are godot-cpp targets and name the DLL:
  #   template_debug   -> what the Godot EDITOR loads (godot-tests, and the export
  #                       step's script scan) and what a --export-debug exe loads.
  #   template_release -> what a --export-release exe loads (the release zips).
  # A pull request builds only template_debug and packages in debug export mode
  # (~4.7 min per flavour on a warm cache, mostly MSVC preprocessing on sccache
  # hits — halving the legs halves the wall-clock in front of godot-tests and the
  # PR build links). Master pushes and manual runs also build template_release,
  # in parallel, so the release flavour and release-mode packaging stay
  # continuously verified. sccache caches godot-cpp's objects across runs, so
  # after one warm-up only changed engine/libs sources recompile. Windows must
  # use Ninja: the Visual Studio generator ignores CMAKE_*_COMPILER_LAUNCHER.
  build-gdextension-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Per-key fromJSON is the documented matrix form. The target -> CMake
        # config mapping lives in the build step, NOT in matrix.include: an
        # include entry whose target is absent from this list would be added as
        # an extra combination and resurrect the release leg on PRs.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["template_debug"]') || fromJSON('["template_debug","template_release"]') }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false   # the build consumes no LFS game assets

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build GDExtension (${{ matrix.target }})
        shell: pwsh
        env:
          GODOTCPP_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          # First-run toolchain sanity: CMake must be >= 3.25 for the /Z7 flag, and
          # Ninja + cl must be on PATH (the latter via msvc-dev-cmd).
          cmake --version
          ninja --version
          Write-Host "cl: $((Get-Command cl -ErrorAction SilentlyContinue).Source)"
          # template_debug is built RelWithDebInfo: optimized native code plus
          # symbols, the same flavour scripts/build_godot.sh Dev produces for the
          # editor. template_release is a plain Release. The build dirs keep their
          # historical names on purpose: sccache keys embed the absolute paths of
          # godot-cpp's generated headers under the build dir, so renaming a dir
          # invalidates every cached godot-cpp object (one cold ~28 min leg per
          # cache scope).
          $flavours = @{
            template_debug   = @{ config = "RelWithDebInfo"; dir = "build-godot-debug" }
            template_release = @{ config = "Release"; dir = "build-godot-release" }
          }
          $flavour = $flavours[$env:GODOTCPP_TARGET]
          if (-not $flavour) { throw "unknown GODOTCPP_TARGET: $env:GODOTCPP_TARGET" }
          $buildType = $flavour.config
          $buildDir = $flavour.dir
          # -G Ninja so the sccache compiler launcher is honored. /Z7 (embedded
          # debug info via CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) makes the
          # RelWithDebInfo objects cacheable; the default /Zi separate-PDB is not.
          # CMP0141=NEW forces that policy into godot-cpp (its CMake policy ceiling
          # is < 3.25).
          cmake -S godot/src -B $buildDir -G Ninja `
            "-DGODOTCPP_TARGET=$env:GODOTCPP_TARGET" `
            "-DCMAKE_BUILD_TYPE=$buildType" `
            "-DCMAKE_POLICY_DEFAULT_CMP0141=NEW" `
            "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          if ($LASTEXITCODE -ne 0) { throw "configure $env:GODOTCPP_TARGET failed" }
          cmake --build $buildDir --target opennova
          if ($LASTEXITCODE -ne 0) { throw "build $env:GODOTCPP_TARGET failed" }
          $dll = "godot/bin/libopennova.windows.$env:GODOTCPP_TARGET.x86_64.dll"
          if (-not (Test-Path $dll)) { throw "missing GDExtension DLL: $dll" }

      - name: sccache stats
        shell: bash
        run: sccache --show-stats

      - name: Upload Windows GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: gdext_windows_${{ matrix.target }}
          if-no-files-found: error
          path: godot/bin/libopennova.windows.${{ matrix.target }}.x86_64.dll

  godot-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [build-gdextension-windows]
    env:
      GODOT_VERSION: 4.6.1-stable
      HAVE_REFERENCE_ASSETS: ${{ secrets.REFERENCE_ASSETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the tests read fixtures/ and assets/ only
          submodules: recursive

      - name: Pull Git LFS assets (fixtures/ and assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/**,assets/**"

      # The extracted retail asset tree lives in the private
      # opennova-net/opennova-reference-assets repository (its README). With the
      # REFERENCE_ASSETS_TOKEN secret (a fine-grained token with contents: read on
      # that repository) the checkout below lands beside the tree and the
      # asset-gated tests run against it instead of reporting Skipped
      # (docs/asset-gated-tests.md); without the secret the gates stay closed.
      - name: Check out the reference assets
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        uses: actions/checkout@v4
        with:
          repository: opennova-net/opennova-reference-assets
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          path: .reference-assets

      # The packed retail install (opennova-net/opennova-reference-retail-packed:
      # the .pff set + expansion/revx02, 3.7 GB committed as 95 MiB parts) feeds
      # OPENNOVA_JO_DIR. It is restored from the Actions cache keyed by that
      # repository's commit; only a new commit there pays the clone + reassembly.
      - name: Resolve the packed retail install's revision
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        id: packed-rev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
        run: |
          sha="$(gh api repos/opennova-net/opennova-reference-retail-packed/commits/main --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Restore the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        id: packed-cache
        uses: actions/cache@v4
        with:
          path: .reference-retail-packed
          key: retail-packed-${{ steps.packed-rev.outputs.sha }}

      - name: Check out the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true' && steps.packed-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: opennova-net/opennova-reference-retail-packed
          token: ${{ secrets.REFERENCE_ASSETS_TOKEN }}
          path: .reference-retail-packed

      - name: Reassemble the packed retail install
        if: env.HAVE_REFERENCE_ASSETS == 'true' && steps.packed-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash .reference-retail-packed/reassemble.sh
          rm -rf .reference-retail-packed/.git

      - name: Point the asset gates at the reference data
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        shell: bash
        run: |
          echo "OPENNOVA_JO_ASSETS=${GITHUB_WORKSPACE}/.reference-assets" >> "$GITHUB_ENV"
          echo "OPENNOVA_MISSION_CORPUS=${GITHUB_WORKSPACE}/.reference-assets" >> "$GITHUB_ENV"
          echo "OPENNOVA_JO_DIR=${GITHUB_WORKSPACE}/.reference-retail-packed" >> "$GITHUB_ENV"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ matrix.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" ]; then
            mkdir -p .godot-bin
            curl -fL -o .godot-bin/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -o .godot-bin/godot.zip -d .godot-bin
            chmod +x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi

      - name: Install Godot (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:GODOT_VERSION}"
          $bin = ".godot-bin/Godot_v${version}_win64_console.exe"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path .godot-bin | Out-Null
            $url = "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile .godot-bin/godot.zip
            Expand-Archive -Path .godot-bin/godot.zip -DestinationPath .godot-bin -Force
          }

      # The editor binary that runs GUT loads the template_debug flavour only.
      - name: Download GDExtension (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: gdext_windows_template_debug
          path: godot/bin

      - name: Prime Godot import cache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          else
            GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/bootstrap_godot.sh
          # The editor importer can still crash on a cold import; a half-baked
          # cache makes the test run fail with confusing "missing resource"
          # errors instead of a clear signal. Retry, and fail loudly if the
          # import never completes (was previously masked by continue-on-error).
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --path godot --import; then ok=1; break; fi
            echo "::warning::Godot import attempt ${attempt} failed; retrying"
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Godot import did not complete after 3 attempts"
            exit 1
          fi

      - name: Run Godot tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_win64_console.exe"
          else
            export GODOT_BIN="${PWD}/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          fi
          bash scripts/test_godot.sh 2>&1 | tee gut.log
          exit "${PIPESTATUS[0]}"

      # The GUT gates report pending without their data; with the reference
      # data mounted none of them may still name a mounted root.
      - name: Asset-gated GUT tests ran
        if: env.HAVE_REFERENCE_ASSETS == 'true'
        shell: bash
        run: |
          python scripts/ci/retail_gates_ran.py --gut-log gut.log \
            --roots jo_dir,jo_assets,mission_corpus

  # One job, the workflow's two zips. The DEV zip (game + ONED + loose assets/,
  # one copy of the data) is what PRs and master builds hand out; the GAME zip
  # (opennova.exe + the packed pffs, built by ONED's
  # --pack-game CLI) is what tagged releases ship — built here on every run so
  # the pack path is exercised long before a tag needs it.
  package-godot-windows:
    runs-on: windows-latest
    needs: [build-gdextension-windows]
    outputs:
      artifact_url: ${{ steps.upload_windows.outputs.artifact-url }}
      artifact_id: ${{ steps.upload_windows.outputs.artifact-id }}
      game_artifact_url: ${{ steps.upload_game.outputs.artifact-url }}
      game_artifact_id: ${{ steps.upload_game.outputs.artifact-id }}
    env:
      GODOT_VERSION: 4.6.1-stable
      GODOT_VERSION_PLAIN: 4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # scoped below: the package copies assets/ only
          submodules: recursive

      - name: Pull Git LFS assets (assets/ only)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="assets/**"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_VERSION_PLAIN }}.stable
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      # Every flavour this run built (template_debug only on a PR).
      - name: Download GDExtension
        uses: actions/download-artifact@v4
        with:
          pattern: gdext_windows_*
          merge-multiple: true
          path: godot/bin

      # The imgui-godot addon must be present for BOTH export modes: ONED's ImGui
      # surface ships it always, and the game's export plugin keeps it for a debug
      # export / strips it from a release one (export_presets.cfg imgui/*). GUT stays
      # out of the export tree: only the addon script runs here, never bootstrap_godot.sh.
      - name: Install the imgui-godot addon
        shell: bash
        run: bash scripts/bootstrap_imgui_godot.sh

      # PRs export in debug mode (debug export template + the template_debug DLL,
      # the development flavour); master/manual runs export in
      # release mode like the release workflow.
      - name: Package Godot Windows apps
        shell: pwsh
        run: scripts/package_godot_windows.ps1 -SkipBuild -ExportMode ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

      - name: Upload OpenNova Windows dev zip
        id: upload_windows
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-windows-v*.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenNova Windows game zip
        id: upload_game
        uses: actions/upload-artifact@v7
        with:
          path: dist/opennova-game-windows-v*.zip
          archive: false
          if-no-files-found: error

  # Surface the Windows build on the PR as a single comment that updates in
  # place. Depends on the Windows package job (not the test jobs), so the link
  # only ever advances to a build that succeeded; a failed build skips this job
  # and the previous comment is left untouched.
  pr-build-links:
    runs-on: ubuntu-latest
    needs: [package-godot-windows]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the build-links comment
        uses: actions/github-script@v7
        env:
          WINDOWS_URL: ${{ needs.package-godot-windows.outputs.artifact_url }}
          GAME_URL: ${{ needs.package-godot-windows.outputs.game_artifact_url }}
        with:
          script: |
            // A hidden marker lets us find our own comment across runs, so there
            // is only ever one: find it -> update; absent -> create.
            const marker = '<!-- opennova-ci-build-links -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = (context.payload.pull_request.head.sha || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### OpenNova CI builds',
              '',
              `Windows debug-mode build for this PR (commit \`${sha}\`, run [#${context.runNumber}](${runUrl})): debug export template plus the template_debug GDExtension. Release-mode builds come from the release workflow.`,
              '',
              '| Build | Download |',
              '| --- | --- |',
              `| Dev build: game + ONED + loose assets (opennova.exe, opennova-modtools.exe) | [opennova-windows.zip](${process.env.WINDOWS_URL}) |`,
              `| Game build: opennova.exe + packed pffs (the tagged-release flavour) | [opennova-game-windows.zip](${process.env.GAME_URL}) |`,
              '',
              'Downloading requires a GitHub login. Artifacts are removed after 90 days. This comment updates on each successful build.',
            ].join('\n');
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // Forked-PR tokens are read-only and cannot comment; warn instead of
              // failing CI. Same-repo branch PRs (the normal path here) always work.
              core.warning(`Could not post build-links comment (forked PR or token lacks pull-requests:write?): ${err.message}`);
            }

  # Build + test the OpenNova launcher (launcher/, C# WinForms, hosts-file
  # redirection model). Publishes the single-file exe as an artifact; the
  # release flow (launcher-publish workflow) handles distribution.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test launcher/OpenNovaLauncher.sln -c Release --nologo

      - name: Publish single-file exe
        run: dotnet publish launcher/src/OpenNovaLauncher/OpenNovaLauncher.csproj -c Release -r win-x64

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNovaLauncher-win-x64
          if-no-files-found: error
          path: launcher/src/OpenNovaLauncher/bin/Release/net8.0-windows/win-x64/publish/OpenNovaLauncher.exe

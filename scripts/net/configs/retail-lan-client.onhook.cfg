// Debug-only direct LAN joiner for the retail/OpenNova parity harness.
// Copy beside CLIENT/Jointops.exe as onhook.cfg.
DebugMode 1
RendererHooksEnabled 1
PoolHooksEnabled 0
PatchesEnabled 1
ForceThirdPerson 0

LanJoinAddress 127.0.0.1
LanJoinPort 32786
LanJoinCallsign RetailJoiner
LanJoinDiscoveryTimeoutMs 30000

// These keys are consumed by scripts/net/join_opennova.ps1.
OpenNovaResourceDir .
OpenNovaExpansion revx02
OpenNovaWindowed 1
OpenNovaResolution 1920x1080
OpenNovaIntegrityProfile retail-revx02-024f56f2-2d087374

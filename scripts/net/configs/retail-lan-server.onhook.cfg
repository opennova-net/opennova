// Debug-only direct LAN host for the retail/OpenNova parity harness.
// Copy beside SERVER/Jointops.exe as onhook.cfg.
DebugMode 1
RendererHooksEnabled 1
PoolHooksEnabled 0
PatchesEnabled 1
ForceThirdPerson 0

LanHostMission 01TR.bms
LanHostPort 32786
LanHostLanMode 1
LanHostCallsign RetailHost
LanHostGameType 65568
LanHostMaxPlayers 4
LanHostReadyTimeoutMs 120000
LanHostReadyProbeIntervalMs 1000

// These keys are consumed by scripts/net/host_opennova.ps1.
OpenNovaResourceDir .
OpenNovaExpansion revx02
OpenNovaIntegrityProfile retail-revx02-024f56f2-2d087374
OpenNovaWindowed 1
OpenNovaResolution 1920x1080

// Authored fixture for the engine/formats/score roundtrip test -- NOT retail data.
//
// Grammar sample only: three GAMETYPE blocks in the shipped file's index order
// (0 COOP, 1 TDM, 2 COOP) so the block-order-is-the-row-index rule and the
// index-0 -> 2 remap are both exercised. The VAR values here are the retail
// Co-op row's witnessed ones for the two entries the scoring port reads
// (ENEMYKILL 5, MEDICSAVE 2); everything else is trimmed.
//
// The full retail score.ini (VERSION 40, 12 blocks) is NOT committed -- point
// OPENNOVA_SCORE_INI at a local copy to exercise the sweep in the same test.

VERSION 40

EXP_FANFARE 0 0

GAMETYPE "COOP"

FIELD "NUMENEMYKILLS" 1

VAR "ENEMYKILL" 5
VAR "MEDICSAVE" 2

GAMETYPE "TDM"

FIELD "NUMENEMYKILLS" 1

VAR "ENEMYKILL" 1
VAR "FRIENDLYKILL" -1

GAMETYPE "COOP"

FIELD "NUMENEMYKILLS" 1

VAR "ENEMYKILL" 5
VAR "MEDICSAVE" 2

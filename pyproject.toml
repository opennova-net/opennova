[project]
name = "opennova-tools"
version = "0.1.54"
description = "OpenNova format parsers and DCC integrations (Blender + 3ds Max)"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
onimport = "apps.onimport.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
    "pytest-qt>=4",
    "PySide6>=6.5",
]
# bpy lives in a uv-only dependency group rather than project
# optional-dependencies so it doesn't constrain `requires-python` for
# Max's bundled Python (3.7 / 3.9 / 3.11 across versions). The marker
# scopes the dep to Python 3.11 (the only range bpy 5.x supports), so
# uv can resolve cleanly even with our wider 3.7+ project bound. Pull
# bpy in with `uv sync --group blender` for the headless Blender flow.
blender = [
    "bpy>=5.0,<6.0; python_version >= '3.11' and python_version < '3.12'",
]
# pymxs is supplied by 3ds Max's bundled Python at runtime. This group is
# only for normal-Python local validation harnesses that launch 3dsmaxbatch.exe.
max = [
    "pytest>=8",
]

# Pin uv's resolution to Python 3.11 for the dev environment. This keeps
# the lockfile sane while we ship a wider `requires-python` for end-user
# installs into Max's 3.7/3.9 bundled Python.
[tool.uv]
environments = ["python_version == '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "apps*", "pyopennova*", "opennova_max*",
    "opennova_jobs*", "opennova_blender*", "opennova_qt_ui*", "blender*",
]

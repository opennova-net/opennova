[project]
name = "opennova-tools"
version = "0.1.0"
description = "Standalone OpenNova tools (importer)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bpy>=5.0,<6.0",
]

[project.scripts]
onimport = "apps.importer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*"]

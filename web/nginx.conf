# The visitor's address behind Cloudflare's proxy (generated by web/cloudflare-realip.sh):
# $remote_addr becomes CF-Connecting-IP for a Cloudflare peer only, so the X-Real-IP below
# names the visitor, the address the NovaWorld server's website login/register rate limits
# and session records use (it trusts this nginx through ONNET_TRUSTED_PROXIES). Being a
# Cloudflare peer does not make the header true: a Worker on any zone can fetch this origin
# from a Cloudflare edge with a CF-Connecting-IP of its choosing, until edge authentication
# is on (below). The server therefore keeps these addresses' buckets apart from the retail
# login's, which keys on its own TCP peer.
include /etc/nginx/cloudflare-realip.conf;

# Edge authentication: $opennova_edge_refused is 1 for a request without the
# X-OpenNova-Edge secret our zone's Transform Rule stamps, once EDGE_AUTH_SECRET
# switches it on (docker-entrypoint.sh renders this file; the image's copy is off).
# With it on, /api/ refuses such a request, so every address the server receives
# came through our own zone, where Cloudflare sets CF-Connecting-IP itself.
include /etc/nginx/edge-auth.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        if ($opennova_edge_refused) {
            return 403;
        }
        proxy_pass http://host.docker.internal:8080/api/;
        # The edge secret goes no further than this nginx.
        proxy_set_header X-OpenNova-Edge "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}

# The web build (ADR 0049): game.<domain> is the game container's site
# (deploy/game/nginx.conf). Its COOP/COEP headers, which the threaded build
# needs, pass through; HTTP/1.1 upstream lets that nginx gzip the wasm.
server {
    listen 80;
    server_name ~^game\.;

    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

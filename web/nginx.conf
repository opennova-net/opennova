# The visitor's address behind Cloudflare's proxy (generated by web/cloudflare-realip.sh):
# $remote_addr becomes CF-Connecting-IP for a Cloudflare peer only, so the X-Real-IP below
# names the visitor, the address the NovaWorld server's website login/register rate limits
# and session records use (it trusts this nginx through ONNET_TRUSTED_PROXIES). Being a
# Cloudflare peer does not make the header true: a Worker on any zone can fetch this origin
# from a Cloudflare edge with a CF-Connecting-IP of its choosing, until edge authentication
# is on (below). The server therefore keeps these addresses' buckets apart from the retail
# login's, which keys on its own TCP peer.
include /etc/nginx/cloudflare-realip.conf;

# Edge authentication: $opennova_edge_refused is 1 for a request without the
# X-OpenNova-Edge secret our zone's Transform Rule stamps (or, during a rotation,
# the previous one), once EDGE_AUTH_SECRET switches it on (docker-entrypoint.sh
# renders this file; the image's copy is off). With it on, this nginx forwards to
# /api/ only requests that came through our own zone, where Cloudflare sets
# CF-Connecting-IP itself. It guards this proxy only: the retail port is open to
# the whole internet for the retail client (through the retail server below),
# so web's /api/ answers only this server's 127.0.0.1 when web runs with
# ONNET_API_PROXY_ONLY=1 (its ECS task definition, infra/aws/programs.tf;
# apps/novaworld_common/README.md).
include /etc/nginx/edge-auth.conf;

# Where the site listens (listen.conf, which docker-entrypoint.sh writes):
# 443 with TLS once ORIGIN_TLS_CERT and ORIGIN_TLS_KEY are set (prod and
# staging: Cloudflare's Origin CA certificate, so Cloudflare reaches this
# origin over TLS it verifies, "Full (strict)"), plain 80 without them (a local
# run of the image).
server {
    include /etc/nginx/listen.conf;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The pages: any path is the app's index.html, always revalidated, so a
    # browser picks up a deploy's new asset names at once.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # The build's hashed assets. One this image lacks is a 404, never the
    # index.html above: in a rolling deploy a page from one web task asks
    # another for its version's assets, and an index.html served as a 200
    # under a .js name was kept by the browser for Cloudflare's 4-hour browser
    # TTL, so the site loaded blank until a hard refresh.
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        if ($opennova_edge_refused) {
            return 403;
        }
        # Web, the other container in this one's ECS task: they share the
        # task's network, so it is 127.0.0.1:8080, and web sees this nginx at
        # 127.0.0.1, the proxy it trusts (ONNET_TRUSTED_PROXIES).
        proxy_pass http://127.0.0.1:8080/api/;
        # The game data admin page uploads a tree's files in 32 MiB parts
        # (the service's part size; apps/novaworld_web/data_sets), each PUT
        # to web, which hands it to the store: every deployment's upload
        # parts pass here now, within Cloudflare's 100 MB request body
        # limit. Every other API body stays small.
        client_max_body_size 32m;
        # The edge secret goes no further than this nginx.
        proxy_set_header X-OpenNova-Edge "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The retail HTTP port (the balancer's game_http_port listener lands here,
# infra/aws/load_balancer.tf portal_retail_port): every request a stock
# client makes of web's server (the NW*.dll pages, the .gsb feeds, the
# templates and static files) passes this server, which refuses a body past
# client_max_body_size (413) before web buffers any of it. A stock client's
# largest body is its login form (POST /NWLogin.dll), each field byte
# EPASK-encrypted into eight characters: a few KiB at the most. The request
# goes on to web's server on the task's loopback from 127.0.0.2, the address
# web knows as this proxy (ONNET_RETAIL_PROXY): web takes the client's address
# from the X-Real-IP set here, this connection's own TCP peer (the balancer
# keeps each client's address; no Cloudflare header counts on this port), so
# its retail routes, their login brake and records see the client. 127.0.0.2
# is no trusted proxy, so web refuses /api/ here as it refuses any client. The
# request goes as the client sent it (its path, Host and every header but the
# client address ones), and the reply comes back with web's own Server and
# Date and no redirect rewritten.
server {
    listen 8082;
    server_name _;

    client_max_body_size 16k;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_bind 127.0.0.2;
        proxy_redirect off;
        proxy_pass_header Server;
        proxy_pass_header Date;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-OpenNova-Edge "";
    }
}

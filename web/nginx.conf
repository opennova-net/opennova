# The visitor's address behind Cloudflare's proxy (generated by web/cloudflare-realip.sh):
# $remote_addr becomes CF-Connecting-IP for a Cloudflare peer only, so the X-Real-IP below
# names the visitor, the address the NovaWorld server's login/register rate limits and
# session records use (it trusts this nginx through ONNET_TRUSTED_PROXIES).
include /etc/nginx/cloudflare-realip.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}

# The web build (ADR 0049): game.<domain> is the game container's site
# (deploy/game/nginx.conf). Its COOP/COEP headers, which the threaded build
# needs, pass through; HTTP/1.1 upstream lets that nginx gzip the wasm.
server {
    listen 80;
    server_name ~^game\.;

    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

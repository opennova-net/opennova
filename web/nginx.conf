# The visitor's address behind Cloudflare's proxy (generated by web/cloudflare-realip.sh):
# $remote_addr becomes CF-Connecting-IP for a Cloudflare peer only, so the X-Real-IP below
# names the visitor, the address the NovaWorld server's website login/register rate limits
# and session records use (it trusts this nginx through ONNET_TRUSTED_PROXIES). Being a
# Cloudflare peer does not make the header true: a Worker on any zone can fetch this origin
# from a Cloudflare edge with a CF-Connecting-IP of its choosing, until edge authentication
# is on (below). The server therefore keeps these addresses' buckets apart from the retail
# login's, which keys on its own TCP peer.
include /etc/nginx/cloudflare-realip.conf;

# Edge authentication: $opennova_edge_refused is 1 for a request without the
# X-OpenNova-Edge secret our zone's Transform Rule stamps (or, during a rotation,
# the previous one), once EDGE_AUTH_SECRET switches it on (docker-entrypoint.sh
# renders this file; the image's copy is off). With it on, this nginx forwards to
# /api/ only requests that came through our own zone, where Cloudflare sets
# CF-Connecting-IP itself. It guards this proxy only: the server's own port (8080)
# is reachable straight from the internet for the retail client, so its /api/
# answers only this nginx when web runs with ONNET_API_PROXY_ONLY=1 (its ECS task
# definition, infra/aws/programs.tf; apps/novaworld_common/README.md).
include /etc/nginx/edge-auth.conf;

# Where the site listens (listen.conf, which docker-entrypoint.sh writes):
# 443 with TLS once ORIGIN_TLS_CERT and ORIGIN_TLS_KEY are set (prod and
# staging: Cloudflare's Origin CA certificate, so Cloudflare reaches this
# origin over TLS it verifies, "Full (strict)"), plain 80 without them (a local
# run of the image).
server {
    include /etc/nginx/listen.conf;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        if ($opennova_edge_refused) {
            return 403;
        }
        # Web, the other container in this one's ECS task: they share the
        # task's network, so it is 127.0.0.1:8080, and web sees this nginx at
        # 127.0.0.1, the proxy it trusts (ONNET_TRUSTED_PROXIES).
        proxy_pass http://127.0.0.1:8080/api/;
        # The game data admin page uploads a tree's files in 32 MiB parts
        # (the service's part size; apps/novaworld_web/data_sets), each PUT
        # to web, which hands it to the store: every deployment's upload
        # parts pass here now, within Cloudflare's 100 MB request body
        # limit. Every other API body stays small.
        client_max_body_size 32m;
        # The edge secret goes no further than this nginx.
        proxy_set_header X-OpenNova-Edge "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}

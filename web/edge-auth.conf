# Edge authentication, OFF: every /api/ request passes. docker-entrypoint.sh
# rewrites this file when EDGE_AUTH_SECRET is set, so that /api/ answers only
# requests carrying X-OpenNova-Edge: <secret>, the header a Cloudflare
# Transform Rule on this zone adds (infra/aws cloudflare_ruleset.edge_auth;
# DEPLOY.md, "Edge authentication").
map $http_x_opennova_edge $opennova_edge_refused {
    default 0;
}

# The web build's site (ADR 0049). The portal's nginx routes game.<domain> here
# (web/nginx.conf); locally, docker run -p 8090:8090.
server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The threaded build needs SharedArrayBuffer, which a browser grants only
    # to a cross-origin isolated page. (A location that adds its own header
    # drops these, so each one repeats them.)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/json application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }

    # The page and the bundled asset list change with every release; the rest
    # revalidates by ETag.
    location ~ ^/(index\.html|assets/manifest\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }
}

# Prod overlay, layered on docker-compose.yml: the stack a deployment's service
# host runs (prod and staging alike). Never run by hand: the host's converge
# (deploy/host/converge.sh) runs it from the release bundle, through
# /usr/local/sbin/opennova-compose, with four env files, later ones overriding
# earlier ones:
#   ../env/app.prod.env        the committed non-secret values
#   /run/opennova/infra.env    what Terraform knows (SSM /opennova/<deployment>/infra.env):
#                              ONNET_PUBLIC_HOST, ONNET_SITE_URL, the hosted
#                              machines' settings, AWS_REGION, the log group
#   ../env/release.env         the release's images, pinned by digest
#   /run/opennova/secret.env   the vault's secrets (secrets sync; SSM .../secret/*)
#
# The NovaWorld server runs on the host's network (the retail UDP ports and
# 8080 straight on the Elastic IP; a bridge would rewrite the source ports the
# listings take). The portal's nginx and the web build share a bridge network,
# `edge`: nginx at a fixed address (its X-Real-IP is the one the server trusts,
# ONNET_TRUSTED_PROXIES in app.prod.env) reaches the server through the host
# gateway and the web build by name. Every service logs to CloudWatch
# (/opennova/<deployment>/service, a stream per service; ./deploy/run.sh app logs).

networks:
  edge:
    driver: bridge
    ipam:
      config:
        # nginx's address (.10) lies outside the range docker hands out, so no
        # other container can take it first.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1

services:
  novaworld:
    image: ${SERVER_IMAGE:?set SERVER_IMAGE (release.env)}
    build: !reset null
    network_mode: host
    # The image's own user; named here so no override runs the server as root
    # (the host's metadata fence admits this UID alone besides root).
    user: "10002"
    # The server's graceful shutdown (sessions, hosted servers' admin links)
    # before compose kills it.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION (infra.env)}
        awslogs-group: ${OPENNOVA_LOG_GROUP:?set OPENNOVA_LOG_GROUP (infra.env)}
        awslogs-stream: novaworld
        mode: non-blocking
        max-buffer-size: 4m

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE (release.env)}
    build: !reset null
    networks:
      edge:
        ipv4_address: 172.30.0.10
    ports:
      - "80:80"
    # The baked nginx.conf proxies /api/ to host.docker.internal:8080: the host
    # (where the server listens), through the bridge's gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION (infra.env)}
        awslogs-group: ${OPENNOVA_LOG_GROUP:?set OPENNOVA_LOG_GROUP (infra.env)}
        awslogs-stream: web
        mode: non-blocking
        max-buffer-size: 4m

  # The web build's site (:8090 on the edge network alone); the portal's nginx
  # proxies game.<domain> to it by name.
  game:
    image: ${GAME_IMAGE:?set GAME_IMAGE (release.env)}
    build: !reset null
    networks:
      - edge
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION (infra.env)}
        awslogs-group: ${OPENNOVA_LOG_GROUP:?set OPENNOVA_LOG_GROUP (infra.env)}
        awslogs-stream: game
        mode: non-blocking
        max-buffer-size: 4m

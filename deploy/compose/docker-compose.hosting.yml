# Hosted game servers in the local stack, over the dev overlay: the fleet's
# machines are containers of the hostd image (apps/serve/Dockerfile's hostd
# target) that the worker's docker machine driver launches on the stack's
# network (apps/novaworld_common/hosted/docker_machine_driver.h), as a
# deployment's worker launches EC2 machines. Each runs the image's own
# opennova-hostd with its process runtime (the image's opennova-serve its
# servers): it redeems the one-time token its launch handed it at
# the fleet's internal listener (bound at the fleet's fixed address,
# admitting the stack's subnet), syncs from the machine's address, and runs
# each server the fleet places on its slots as an opennova-serve child at
# the slot's fixed ports; the fleet's admin links reach those on the
# machine's address; the servers list through the gate at ONNET_PUBLIC_HOST.
#
#   docker-api    the worker's Docker Engine API: a socket proxy that admits
#                 the whole containers API, on every container of this
#                 machine (no images, volumes, networks, exec start or swarm).
#                 That is root on this machine (a container it creates can
#                 mount anything or run privileged, and a container's /json
#                 shows its environment, secrets included), so it sits on a
#                 network of its own (docker-api, internal: no route out) that
#                 the worker alone joins: no other program and no machine (a
#                 game server's) reaches it. The local stack's alone, never a
#                 deployment's.
#   machine-data  the local object store (the base file's `store` volume: the
#                 data sets' trees the site's Game data page uploads, which
#                 scripts/dev_stack.sh up --data or --synthetic-data seeds
#                 through the admin API) at /var/lib/opennova/store, the path
#                 web and the data program see it at, read-only; the machines take every
#                 mount of this container (ONNET_HOSTED_DOCKER_DATA_FROM), so a
#                 machine's hostd copies a tree from
#                 file:///var/lib/opennova/store/trees/<id>/, the URL the
#                 fleet hands it, into its own /opt/game.
#   machine-image the machines' image, the hostd image, built and never run.
#
# scripts/dev_stack.sh up --data <dir> (or --synthetic-data) adds this file.
# The machines are no compose service: `scripts/dev_stack.sh down` removes them
# (label opennova.deployment=dev) before the stack.

# The Docker API's network: the proxy and the worker alone, no route out.
networks:
  docker-api:
    name: opennova-dev-docker-api
    internal: true

# The fleet's policy, which web, the fleet and the worker read alike.
x-hosting-env: &hosting-env
  ONNET_HOSTED_PROVIDER: docker
  ONNET_HOSTED_SERVE_IMAGE: ${SERVE_IMAGE:-opennova-serve:local}
  # The fleet's internal listener at its fixed address (the dev
  # overlay's), admitting the agents from the stack's subnet; the machines'
  # admin.cfg admits the fleet's network.
  ONNET_INTERNAL_HTTP_BIND: 172.30.77.10:8070
  ONNET_HOSTED_BOOTSTRAP_CIDRS: 172.30.77.0/24
  # A small fleet: one shared machine of 4 slots, one own machine.
  ONNET_FLEET_SHARED_SLOTS: ${ONNET_FLEET_SHARED_SLOTS:-4}
  ONNET_FLEET_MAX_SHARED: ${ONNET_FLEET_MAX_SHARED:-1}
  ONNET_FLEET_MAX_OWN: ${ONNET_FLEET_MAX_OWN:-1}

services:
  novaworld-web:
    environment:
      <<: *hosting-env

  novaworld-fleet:
    environment:
      <<: *hosting-env

  # On the stack's network and the Docker API's, which it alone joins; the
  # docker driver's own settings, its alone.
  novaworld-worker:
    environment:
      <<: *hosting-env
      ONNET_HOSTED_DOCKER_URL: http://docker-api:2375
      ONNET_HOSTED_DOCKER_NETWORK: opennova-dev
      ONNET_HOSTED_DOCKER_DATA_FROM: opennova-dev-machine-data
      ONNET_HOSTED_DEPLOYMENT: dev
      # The machines' image (a server's start pins the serve image by name
      # alone: the machines run their own binary).
      ONNET_HOSTED_HOSTD_IMAGE: ${HOSTD_IMAGE:-opennova-hostd:local}
    networks:
      default: {}
      docker-api: {}
    depends_on:
      docker-api:
        condition: service_started
      machine-data:
        condition: service_started

  docker-api:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # A container of no image of ours: the machines take every mount it has
  # (VolumesFrom), so it holds the store alone, read-only, at the path web and
  # the data program mount it at (ONNET_OBJECT_STORE_URL names it).
  machine-data:
    image: alpine:3.20
    container_name: opennova-dev-machine-data
    restart: unless-stopped
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - store:/var/lib/opennova/store:ro

  # The machines' image (apps/serve/Dockerfile's hostd target: opennova-hostd
  # with opennova-serve beside it), which the worker's driver starts each
  # machine from: built here, never started as a service (the `machines`
  # profile).
  machine-image:
    profiles: ["machines"]
    image: ${HOSTD_IMAGE:-opennova-hostd:local}
    build:
      context: ../..
      dockerfile: apps/serve/Dockerfile
      target: hostd

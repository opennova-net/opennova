# Dev overlay: publish the game ports to the host, set the dev environment,
# run a local PostgreSQL for the server (its data in the pg_data volume;
# `down -v` wipes it), and serve the web UI via Vite with hot-reload (no
# image rebuild on web changes). On a Windows + WSL2 docker host the
# published ports reach the Windows host, so a retail JO process on the same
# machine (with the hosts file pointing gs.novaworld.net at 127.0.0.1)
# connects straight through.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   # then open the web UI at http://localhost:5173 (Vite, hot-reload)
#
# NOTE on networking: we deliberately use the published-port BRIDGE network
# here, NOT `network_mode: host`. Host mode was tried so the server could
# observe the real client source IP for the host/join reflection flow, and it
# did (the gate saw 127.0.0.1) — but on Docker Desktop + WSL2 it left the NW
# UDP (:64206) handshake unreachable and bounced the engine. Instead the join
# endpoint is made reachable via the reflection override (see the novaworld
# `environment:` block below), which forces the advertised host endpoint to a
# locally reachable address without depending on source observation.

services:
  # The server's database: PostgreSQL 17, created SQL_ASCII with the C locale
  # as the server requires (backend/README.md): bytes stored as sent, ordered
  # byte by byte. Not published to the host; scripts/dev_postgres.sh runs one
  # on 127.0.0.1 for a server built outside Docker.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: novaworld
      POSTGRES_DB: novaworld
      POSTGRES_PASSWORD: dev
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=SQL_ASCII"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "novaworld", "-d", "novaworld"]
      interval: 2s
      timeout: 5s
      retries: 30

  novaworld:
    depends_on:
      postgres:
        condition: service_healthy
    # Local host/join (peer-to-peer) config — MACHINE-SPECIFIC. Set these to your
    # adapter's LAN IPv4 (ipconfig) and point the hosts line at the same IP, so
    # retail binds its host game socket where the server advertises it; a
    # loopback/LAN mismatch leaves joiners stuck on "Enumerating". Override per
    # machine via shell env, e.g.:
    #   ONNET_PUBLIC_HOST=192.168.1.50 ONNET_CLIENT_REFLECT_IP=192.168.1.50 \
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    environment:
      ONNET_PUBLIC_HOST: ${ONNET_PUBLIC_HOST:-192.168.10.120}
      # The postgres service above.
      DATABASE_URL: postgresql://novaworld@postgres:5432/novaworld
      DATABASE_PASSWORD: dev
      # The dev admin token: without it the admin API stays CLOSED and the web
      # /admin gate 401s. Override per shell via ADMIN_API_TOKEN=...
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token}
      # Seed the local test accounts (test/foo) for dev only; prod leaves this
      # unset so 0002_dev_users.sql is skipped. This is test DATA only — the
      # login/auth logic is identical in dev and prod.
      SEED_DEV_USERS: "1"
      ONNET_CLIENT_REFLECT_IP: ${ONNET_CLIENT_REFLECT_IP:-192.168.10.120}
      # Two reflect ports, mirroring onnet's separate gate/nw_udp processes and
      # JO game.cfg. Each is the retail client's LOCAL UDP port for that socket
      # (docker hides the real source, so we set them):
      #   gate-server socket = mpgateserverlocalport (49152) -> ReflectedPortNumber
      #   novaworld session  = mpnovaworldport (32768) -> advertised to joiners
      ONNET_CLIENT_REFLECT_GATE_PORT: ${ONNET_CLIENT_REFLECT_GATE_PORT:-49152}
      ONNET_CLIENT_REFLECT_NOVAWORLD_PORT: ${ONNET_CLIENT_REFLECT_NOVAWORLD_PORT:-32768}
      # Billing in Stripe's test mode: the base file passes the STRIPE_* set
      # through from the shell, which deploy/env/billing.dev.env.tpl fills from
      # the vault's stripe-test item, e.g.
      #   op run --env-file=../env/billing.dev.env.tpl -- \
      #     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      # and `stripe listen --forward-to localhost:8080/api/billing/webhook`
      # delivers the webhooks (its whsec_ as STRIPE_WEBHOOK_SECRET). Unset,
      # billing is off. Checkout and the portal return to the Vite site.
      ONNET_SITE_URL: ${ONNET_SITE_URL:-http://localhost:5173}
    ports:
      - "7597:7597/udp"      # novaworld_gate
      - "64206:64206/udp"    # NovaWorld UDP
      - "8080:8080/tcp"      # HTTP / API

  # Web UI via the Vite dev server. Edits to web/ hot-reload live at
  # http://localhost:5173 with no rebuild. Vite proxies /api to the novaworld
  # server on the compose network (see web/vite.config.ts; its polling watch
  # makes file changes reliable on WSL2). The nginx image (base web + the prod
  # overlay) is the production path and is left untouched.
  web:
    image: node:21-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../../web:/app
      - /app/node_modules    # container-owned; keep the host bind-mount off node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://novaworld:8080

volumes:
  pg_data:

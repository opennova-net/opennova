# Base compose for the OpenNova NovaWorld stack: the C++ server (gate UDP,
# NW UDP, HTTP) plus the nginx web portal. SQLite lives in the nw_data
# volume. Overlays add dev (published ports, dev env) or prod (host
# networking, GHCR images, backup sidecar) on top of this file.
#
# Run from this directory, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  novaworld:
    image: ${SERVER_IMAGE:-opennova-novaworld-server:local}
    build:
      # Build context is the repo root (two levels up) so the Dockerfile
      # can reach engine/, backend/, third_party/, apps/.
      context: ../..
      dockerfile: apps/novaworld_server/Dockerfile
    restart: unless-stopped
    # Docker's init (tini) is PID 1 and forwards signals to the server. As PID 1
    # the server would ignore a second SIGTERM: its handler puts the default
    # action back after the first (apps/novaworld_server/main.cpp), and the
    # kernel drops a default-action signal sent to a PID namespace's init
    # (pid_namespaces(7)), so a second `docker kill -s TERM` could not end a
    # stuck shutdown. The overlays inherit it.
    init: true
    volumes:
      - nw_data:/data
    environment:
      ONNET_PUBLIC_HOST: ${ONNET_PUBLIC_HOST:-127.0.0.1}
      DATABASE_PATH: /data/novaworld.db
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # The website session (apps/novaworld_server/README.md): the cookie's
      # Secure flag for an https site, the proxy whose X-Real-IP names the
      # client, and the account made the first site admin at boot.
      ONNET_COOKIE_SECURE: ${ONNET_COOKIE_SECURE:-}
      ONNET_TRUSTED_PROXIES: ${ONNET_TRUSTED_PROXIES:-}
      ONNET_BOOTSTRAP_ADMIN: ${ONNET_BOOTSTRAP_ADMIN:-}

  web:
    image: ${WEB_IMAGE:-opennova-web:local}
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:-}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:-}
    depends_on:
      - novaworld

  # The web build (ADR 0049): nginx on :8090 serving the Godot Web export. The
  # portal's nginx routes game.<domain> to it (web/nginx.conf).
  game:
    image: ${GAME_IMAGE:-opennova-game:local}
    build:
      # The repo root: the image builds the engine, the GDExtension and the export.
      context: ../..
      dockerfile: deploy/game/Dockerfile
    restart: unless-stopped

volumes:
  nw_data:

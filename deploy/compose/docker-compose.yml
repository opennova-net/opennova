# Base compose for the OpenNova NovaWorld service's five programs, each its own
# image (one Dockerfile, a runtime target per program), plus the web portal:
#   novaworld-gate        the gate (UDP 7597; the hosts' status blobs land there)
#   novaworld-lobby       a lobby instance (UDP 64206)
#   novaworld-web         the HTTP routes (8080: the retail NW*.dll and .gsb
#                         routes, the website's API behind the portal)
#   novaworld-controller  the fleet's reconcile pass, the jobs' scheduling, the
#                         machines' internal listener (8070, the leader alone)
#   novaworld-worker      the background jobs (the fleet's machine driver calls
#                         among them)
#   portal                the website (web/): nginx in its image
# Every program answers GET /livez on ONNET_HEALTH_PORT (8081), web on its HTTP
# port as well. No program keeps state of its own: the database is
# PostgreSQL, named by DATABASE_URL (a libpq URI) with DATABASE_PASSWORD beside
# it, web's ephemeral state Valkey (ONNET_REDIS_URL, with ONNET_REDIS_PASSWORD
# beside it), and the hosted servers' game data the object store (a deployment's
# S3; here the `store` volume, a directory web and the worker share: the data
# sets' trees the site's Game data page uploads). The
# dev overlay (docker-compose.dev.yml) makes
# this the local stack: a local PostgreSQL and Valkey, the published ports and
# the dev environment; the hosting overlay (docker-compose.hosting.yml) adds the
# hosted game servers' machines. A deployment runs the same images as ECS
# services (infra/aws/programs.tf), not through compose.
#
# scripts/dev_stack.sh runs it (DEVELOPING.md "Run the NovaWorld servers
# locally"), or by hand from this directory:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

# What every program's service shares. Each names its image and its target.
x-novaworld: &novaworld
  build: &novaworld-build
    # Build context is the repo root (two levels up) so the Dockerfile
    # can reach engine/, backend/, third_party/, apps/.
    context: ../..
    dockerfile: apps/novaworld_common/Dockerfile
  restart: unless-stopped
  # Docker's init (tini) is PID 1 and forwards signals to the program. As PID 1
  # the program would ignore a second SIGTERM: its handler puts the default
  # action back after the first, and the kernel drops a default-action signal
  # sent to a PID namespace's init (pid_namespaces(7)), so a second `docker
  # kill -s TERM` could not end a stuck shutdown. (ECS: initProcessEnabled.)
  init: true
  # The programs' only writes are temporary files (the Stripe calls' and the
  # ec2 provider's owner-only scratch directories): memory, never the image.
  tmpfs:
    - /tmp
  # Its liveness: the program's stall watchdog, on the health port.
  healthcheck: &novaworld-health
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "2", "http://127.0.0.1:8081/livez"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s

# Every program's settings. A program reads what it needs; the rest is unused.
x-novaworld-env: &novaworld-env
  # The gate's public address (POSTIPADDRESS: where clients and host status
  # blobs land) and the ports the programs listen on (unset: 7597, 64206,
  # 8080), and every program's health port (unset: 8081).
  ONNET_PUBLIC_HOST: ${ONNET_PUBLIC_HOST:-127.0.0.1}
  ONNET_GATE_UDP_PORT: ${ONNET_GATE_UDP_PORT:-}
  ONNET_NW_UDP_PORT: ${ONNET_NW_UDP_PORT:-}
  ONNET_HTTP_PORT: ${ONNET_HTTP_PORT:-}
  ONNET_HEALTH_PORT: ${ONNET_HEALTH_PORT:-}
  # Web's address as the gate and the lobby announce it (the startup URL, the
  # web domain, HOST_URL, GSB_SERVER), and the controller's internal listener
  # as the machines' hostd and the other programs reach it.
  ONNET_WEB_HOST: ${ONNET_WEB_HOST:-}
  ONNET_INTERNAL_URL: ${ONNET_INTERNAL_URL:-}
  # The database (apps/novaworld_common/README.md "Database"): the libpq
  # URI, the role's password kept apart from it (a secret; the URI is
  # not), and the most connections a program opens.
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  # The website session: the cookie's Secure flag for an https site, the
  # proxy whose X-Real-IP names the client, /api/ for that proxy alone, and
  # the account made the first site admin at boot.
  ONNET_COOKIE_SECURE: ${ONNET_COOKIE_SECURE:-}
  ONNET_TRUSTED_PROXIES: ${ONNET_TRUSTED_PROXIES:-}
  ONNET_API_PROXY_ONLY: ${ONNET_API_PROXY_ONLY:-}
  ONNET_BOOTSTRAP_ADMIN: ${ONNET_BOOTSTRAP_ADMIN:-}
  # 1 lists no host whose HostKey names no account (unset: listed with no
  # owner); 0 stops minting a DFX2 account's first CD key at its first
  # activation (unset: on).
  ONNET_REQUIRE_HOST_KEY: ${ONNET_REQUIRE_HOST_KEY:-}
  ONNET_CD_KEY_AUTO_MINT: ${ONNET_CD_KEY_AUTO_MINT:-}
  # Outbound mail: the sender and SES's region; unset, mail is off
  # (registration and resets still work, nothing is sent).
  ONNET_MAIL_FROM: ${ONNET_MAIL_FROM:-}
  ONNET_MAIL_REGION: ${ONNET_MAIL_REGION:-}
  # Hosted game servers: unset, hosting is off. The hosting overlay turns it on
  # with the docker driver (the local stack's machines); a deployment's web,
  # controller and worker get the ec2 driver's settings from their task
  # definitions (infra/aws/fleet.tf).
  ONNET_HOSTED_PROVIDER: ${ONNET_HOSTED_PROVIDER:-none}
  ONNET_HOSTED_CAP: ${ONNET_HOSTED_CAP:-}
  # The game data's store (apps/novaworld_common/object_store.h; ADR 0064):
  # the data sets' trees, which the site's Game data page fills; hosting is
  # on only with one. A deployment names its bucket in S3 (s3://<bucket>/data,
  # with the region); this stack a directory, the store volume below, shared
  # by web (the page's uploads, which it puts there part by part) and the
  # worker (the trees it finalizes); the controller only builds URLs under it
  # and mounts nothing.
  ONNET_OBJECT_STORE_URL: ${ONNET_OBJECT_STORE_URL:-file:///var/lib/opennova/store}
  ONNET_OBJECT_STORE_REGION: ${ONNET_OBJECT_STORE_REGION:-}
  # Billing, the monthly support tiers over Stripe: on only when the set is
  # complete and well-formed, else a boot warning and billing off. The key
  # and the webhook secret are secrets (the vault's stripe-test or
  # stripe-live item); the price ids are comma lists (the first sold, the
  # rest grandfathered); ONNET_SITE_URL is the site's origin, where Checkout
  # and the portal return.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_TIER1: ${STRIPE_PRICE_TIER1:-}
  STRIPE_PRICE_TIER2: ${STRIPE_PRICE_TIER2:-}
  STRIPE_PRICE_TIER3: ${STRIPE_PRICE_TIER3:-}
  STRIPE_PRICE_OWN_MACHINE: ${STRIPE_PRICE_OWN_MACHINE:-}
  ONNET_SITE_URL: ${ONNET_SITE_URL:-}
  ONNET_STRIPE_CURL: ${ONNET_STRIPE_CURL:-}
  ONNET_BILLING_AUTOMATIC_TAX: ${ONNET_BILLING_AUTOMATIC_TAX:-}
  ONNET_BILLING_RECONCILE_MINUTES: ${ONNET_BILLING_RECONCILE_MINUTES:-}

services:
  novaworld-gate:
    <<: *novaworld
    image: ${GATE_IMAGE:-opennova-novaworld-gate:local}
    build:
      <<: *novaworld-build
      target: gate
    environment:
      <<: *novaworld-env
      # The lobby the gate hands a client while no lobby instance is live
      # (host:port; unset, none).
      ONNET_LOBBY_ENDPOINT: ${ONNET_GATE_FALLBACK_LOBBY:-}

  novaworld-lobby:
    <<: *novaworld
    image: ${LOBBY_IMAGE:-opennova-novaworld-lobby:local}
    build:
      <<: *novaworld-build
      target: lobby
    environment:
      <<: *novaworld-env
      # The lobby address the gate hands clients (host:port), which every lobby
      # announces alike (on ECS the load balancer's: the gate's address and the
      # lobby port).
      ONNET_LOBBY_ENDPOINT: ${ONNET_LOBBY_ENDPOINT:-}

  novaworld-web:
    <<: *novaworld
    image: ${WEB_IMAGE:-opennova-novaworld-web:local}
    build:
      <<: *novaworld-build
      target: web
    healthcheck:
      <<: *novaworld-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "2", "http://127.0.0.1:8080/livez"]
    environment:
      <<: *novaworld-env
      # Web's ephemeral state (sessions, pins, rate limits): Valkey, redis://
      # or rediss:// host:port[/db], and its AUTH token apart from it.
      ONNET_REDIS_URL: ${ONNET_REDIS_URL:-}
      ONNET_REDIS_PASSWORD: ${ONNET_REDIS_PASSWORD:-}
    volumes:
      - store:/var/lib/opennova/store

  novaworld-controller:
    <<: *novaworld
    image: ${CONTROLLER_IMAGE:-opennova-novaworld-controller:local}
    build:
      <<: *novaworld-build
      target: controller
    environment:
      <<: *novaworld-env
      # Where the internal listener binds (<IPv4>:<port>; unset: the ECS
      # task's private address, else 127.0.0.1:8070).
      ONNET_INTERNAL_HTTP_BIND: ${ONNET_INTERNAL_HTTP_BIND:-}

  novaworld-worker:
    <<: *novaworld
    image: ${WORKER_IMAGE:-opennova-novaworld-worker:local}
    build:
      <<: *novaworld-build
      target: worker
    environment:
      <<: *novaworld-env
      # Job threads (unset: 4; at most DATABASE_POOL_MAX less 2).
      ONNET_WORKER_THREADS: ${ONNET_WORKER_THREADS:-}
    volumes:
      - store:/var/lib/opennova/store

  # The website: the portal's nginx image (web/Dockerfile), which serves the
  # built site and proxies /api/ to web's server on 127.0.0.1:8080. It shares
  # novaworld-web's network as the two containers of web's ECS task share the
  # task's, so that loopback is web's (a port of the portal's, 80 here or 443
  # with TLS, is published on novaworld-web).
  portal:
    image: ${PORTAL_IMAGE:-opennova-portal:local}
    build:
      context: ../../web
      dockerfile: Dockerfile
    network_mode: "service:novaworld-web"
    restart: unless-stopped
    environment:
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:-}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:-}
      # Edge authentication (DEPLOY.md): unset, off.
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
      EDGE_AUTH_SECRET_PREVIOUS: ${EDGE_AUTH_SECRET_PREVIOUS:-}
    depends_on:
      - novaworld-web

volumes:
  # The local game data store (ONNET_OBJECT_STORE_URL above): the trees the
  # Game data page uploads; `down -v` wipes it.
  store:

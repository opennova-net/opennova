# The deploy toolbox container. The operator runs it via deploy/run.sh
# (or run.ps1), supplying only OP_SERVICE_ACCOUNT_TOKEN. The repo is
# mounted at /workspace; secrets are rendered to a tmpfs that never
# touches disk.
#
#   export OP_SERVICE_ACCOUNT_TOKEN=ops_...
#   ./deploy/run.sh secrets check
#   ./deploy/run.sh --deployment staging infra plan   # the deployment: the flag alone

services:
  deploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennova-deploy:local
    # The toolbox's downloads are x86_64 builds (deploy/Dockerfile); an arm64
    # machine runs it emulated.
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ../:/workspace
      # `app deploy` resolves image tags to digests on the operator's docker.
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /run/secrets:mode=0700
    environment:
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN:?set OP_SERVICE_ACCOUNT_TOKEN to your 1Password service-account token}
      OP_VAULT: ${OP_VAULT:-OpenNova-Deploy}
    stdin_open: true
    tty: true

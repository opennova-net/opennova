[[deliverables]]
id = "asset-importer"
source = "onimport-v{python_version}.exe"
public = "opennova-asset-importer-windows-{release_version}.exe"
kind = "exe"
platform = "Windows"
title = "OpenNova Asset Importer"
purpose = "Standalone Windows importer for converting NovaLogic game assets to Blender, ASE, and OpenNova project files."
install = "Download the exe and run it directly; no separate installer is required."
use = "Launch it, point it at a game directory, choose assets, and select the output formats to write."

[[deliverables]]
id = "blender-ase-exporter"
source = "opennova_blender-v{blender_version}.zip"
public = "opennova-blender-ase-exporter-{release_version}.zip"
kind = "zip"
platform = "Windows and Linux"
title = "OpenNova Blender ASE Exporter"
purpose = "Blender 5.x addon for exporting NovaLogic-compatible ASE files, bundled with native libraries for Windows and Linux."
install = "Install from Blender with Edit > Preferences > Add-ons > Install, then select this zip."
use = "In Blender, use File > Export > Novalogic ASE (.ase)."
required_entries = [
    "blender_manifest.toml",
    "__init__.py",
    "lib/windows-x64/opennova.dll",
    "lib/linux-x64/libopennova.so",
]

[[deliverables]]
id = "modding-editor"
source = "opennova-modtools-windows-v{godot_version}.zip"
public = "opennova-modding-editor-windows-{release_version}.zip"
kind = "zip"
platform = "Windows"
title = "OpenNova Modding Editor"
purpose = "Standalone OpenNova Editor for authoring NovaLogic terrain, environment, tile, and related mod data."
install = "Extract the zip to a writable folder."
use = "Run opennova-modtools.exe to launch the editor."
required_entries = [
    "opennova-modtools.exe",
    "libopennova.windows.template_release.x86_64.dll",
]

[[deliverables]]
id = "game-runtime"
source = "opennova-runtime-windows-v{godot_version}.zip"
public = "opennova-game-runtime-windows-{release_version}.zip"
kind = "zip"
platform = "Windows"
title = "OpenNova Game Runtime"
purpose = "Standalone Godot-based OpenNova runtime for loading exported scenes and runtime systems."
install = "Extract the zip to a writable folder."
use = "Run opennova.exe to launch the runtime."
required_entries = [
    "opennova.exe",
    "libopennova.windows.template_release.x86_64.dll",
]

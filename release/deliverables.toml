[[deliverables]]
id = "asset-importer"
source = "onimport-v{python_version}.exe"
public = "opennova-asset-importer-windows-{release_version}.exe"
kind = "exe"
platform = "Windows"
title = "OpenNova Asset Importer"
purpose = "Standalone Windows importer for converting NovaLogic game assets to Blender, ASE, and OpenNova project files."
install = "Download the exe and run it directly; no separate installer is required."
use = "Launch it, point it at a game directory, choose assets, and select the output formats to write."

[[deliverables]]
id = "blender-ase-exporter"
source = "opennova_blender-v{blender_version}.zip"
public = "opennova-blender-ase-exporter-{release_version}.zip"
kind = "zip"
platform = "Windows and Linux"
title = "OpenNova Blender ASE Exporter"
purpose = "Blender 5.x addon for exporting NovaLogic-compatible ASE files, bundled with native libraries for Windows and Linux."
install = "Install from Blender with Edit > Preferences > Add-ons > Install, then select this zip."
use = "In Blender, use File > Export > Novalogic ASE (.ase)."
required_entries = [
    "blender_manifest.toml",
    "__init__.py",
    "lib/windows-x64/opennova.dll",
    "lib/linux-x64/libopennova.so",
]

# The workflow's two Windows zips. {gdextension_target} is the godot-cpp flavour
# the exes load: template_release for release-mode exports (what a tagged release
# ships) and template_debug for pull-request CI's debug-mode packages.
#
# The DEV build (PRs + master CI, never tagged releases): game + ONED +
# the loose assets/ sources. ONE copy of the data, with no packing in the loop.
# ONED runs the sibling opennova.exe against that tree, so the two exes
# travel together.
[[deliverables]]
id = "windows-apps"
source = "opennova-windows-v{godot_version}.zip"
public = "opennova-windows-{release_version}.zip"
kind = "zip"
platform = "Windows"
title = "OpenNova Dev Build (game, ONED, sources)"
purpose = "The OpenNova game and ONED side by side, with the game's tracked loose sources under assets/."
install = "Extract the zip to a writable folder, keeping its layout."
use = "Run opennova.exe directly, or use opennova-modtools.exe to select loose sources or a packed game, run OpenNova, stage and run a configured retail install, and stop the managed child."
required_entries = [
    "opennova-modtools.exe",
    "opennova.exe",
    "libopennova.windows.{gdextension_target}.x86_64.dll",
    "assets/items.def",
    "assets/mnml.bms",
    "assets/mnml.cpt",
]

# The GAME build (what tagged releases ship): opennova.exe + the packed game,
# retail-style — localres.pff beside the exe (packed at package time by
# ONED's hidden --pack-game CLI) plus the loose-by-contract files. The
# runtime default-mounts its own directory, so it is pre-configured by layout.
[[deliverables]]
id = "windows-game"
source = "opennova-game-windows-v{godot_version}.zip"
public = "opennova-game-windows-{release_version}.zip"
kind = "zip"
platform = "Windows"
title = "OpenNova Game"
purpose = "The OpenNova game, runnable as shipped: opennova.exe boots the packed game beside it with zero setup."
install = "Extract the zip anywhere, keeping its layout: the root is the game dir."
use = "Run opennova.exe."
required_entries = [
    "opennova.exe",
    "libopennova.windows.{gdextension_target}.x86_64.dll",
    "localres.pff",
    "menumus.sbf",
    "gamemus.sbf",
    "earlyerr.txt",
]
